<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Octopus">
<meta name="theme-color" content="#E7EDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071319" media="(prefers-color-scheme: dark)">
<title>Octopus Quest Board</title>
<style>
  :root{ --bg:#E7EDEB; --ink:#0E1F26; --ink-3:#7C939A; }
  @media (prefers-color-scheme:dark){ :root{ --bg:#071319; --ink:#DFEAE9; --ink-3:#6A828A; } }
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
    display:flex;align-items:center;justify-content:center}
  #boot{text-align:center;font-size:13px;color:var(--ink-3);line-height:1.8;padding:24px}
  #boot .o{font-size:34px;display:block;margin-bottom:10px;
    animation:sway 1.6s ease-in-out infinite}
  @keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  @media (prefers-reduced-motion:reduce){ #boot .o{animation:none} }
  #boot b{color:var(--ink);font-weight:600}
</style>
</head>
<body>

<div id="boot"><span class="o">🐙</span>불러오는 중…</div>

<script>
/* Thin loader.
   The home-screen icon and GitHub Pages both cache aggressively, so this file
   is kept tiny and never changes — caching it is harmless. The actual app is
   fetched fresh every launch with a cache-busting query, and mirrored into
   localStorage so the board still opens with no connection. */
(function(){
  "use strict";
  var CACHE = "octopus.app.html";

  function boot(html){
    document.open();
    document.write(html);
    document.close();
  }

  function offline(){
    var saved = null;
    try { saved = localStorage.getItem(CACHE); } catch(e){}
    if (saved){ boot(saved); return; }
    document.getElementById("boot").innerHTML =
      '<span class="o">🐙</span><b>연결이 안 돼.</b><br>' +
      '인터넷에 연결한 다음 한 번만 열어주면,<br>그 다음부턴 오프라인에서도 열려.';
  }

  fetch("app.html?v=" + Date.now(), { cache: "no-store" })
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.text(); })
    .then(function(html){
      if (html.indexOf("Quest Board") < 0) throw new Error("bad payload");
      try { localStorage.setItem(CACHE, html); } catch(e){}
      boot(html);
    })
    .catch(offline);
})();
</script>

</body>
</html>
