<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Octopus">
<meta name="theme-color" content="#E7EDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071319" media="(prefers-color-scheme: dark)">
<title>Octopus Quest Board</title>
</head>
<body>
<style>
/* ── tokens: light (bare :root = complete palette) ────────────── */
:root{
  --bg:#E7EDEB;
  --surface:#F6FAF9;
  --surface-2:#DCE5E3;
  --sunk:#CFDAD8;
  --ink:#0E1F26;
  --ink-2:#4B646C;
  --ink-3:#7C939A;
  --line:#C8D4D2;
  --line-soft:#DAE3E1;
  --accent:#B06A16;
  --accent-ink:#8A520C;
  --accent-soft:rgba(176,106,22,.13);
  --good:#2C7A5E;
  --good-soft:rgba(44,122,94,.13);
  --cs1:#93A6AB; --cs2:#7C9AA3; --cs3:#3F7F8C; --cs4:#3D8A72; --cs5:#2C7A5E;
  --t1:#7C939A;
  --t2:#3F7F8C;
  --t3:#B06A16;
  --shadow:0 1px 2px rgba(14,31,38,.07), 0 6px 18px rgba(14,31,38,.05);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;
  --font-num:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071319;
    --surface:#0E2029;
    --surface-2:#152E38;
    --sunk:#0A1A21;
    --ink:#DFEAE9;
    --ink-2:#9BB1B6;
    --ink-3:#6A828A;
    --line:#1B3742;
    --line-soft:#132A34;
    --accent:#E0A050;
    --accent-ink:#F0BC77;
    --accent-soft:rgba(224,160,80,.16);
    --good:#4FA383;
    --good-soft:rgba(79,163,131,.16);
    --cs1:#5E767D; --cs2:#5B8B96; --cs3:#5AA2B0; --cs4:#4FA383; --cs5:#6FBF9C;
    --t1:#6A828A;
    --t2:#5AA2B0;
    --t3:#E0A050;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#071319;
  --surface:#0E2029;
  --surface-2:#152E38;
  --sunk:#0A1A21;
  --ink:#DFEAE9;
  --ink-2:#9BB1B6;
  --ink-3:#6A828A;
  --line:#1B3742;
  --line-soft:#132A34;
  --accent:#E0A050;
  --accent-ink:#F0BC77;
  --accent-soft:rgba(224,160,80,.16);
  --good:#4FA383;
  --good-soft:rgba(79,163,131,.16);
  --cs1:#5E767D; --cs2:#5B8B96; --cs3:#5AA2B0; --cs4:#4FA383; --cs5:#6FBF9C;
  --t1:#6A828A;
  --t2:#5AA2B0;
  --t3:#E0A050;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
html{touch-action:manipulation}          /* kills double-tap-to-zoom, keeps pinch */
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  touch-action:manipulation;
  padding:0 0 64px;
}
button,.row,.chip,.tabs button,.condpick button,.seg button,.dowpick button{
  touch-action:manipulation;
}
.tnote{margin-top:12px;padding:11px 13px;border-radius:9px;background:var(--good-soft);
  border:1px solid color-mix(in srgb,var(--good) 28%,transparent);
  font-size:12.5px;line-height:1.6;color:var(--good)}
.tnote b{font-weight:700}
.tnote.up{background:var(--accent-soft);color:var(--accent-ink);
  border-color:color-mix(in srgb,var(--accent) 28%,transparent)}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 0}

/* ── masthead ─────────────────────────────────────────────────── */
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.mast h1{
  font-size:14px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;
  margin:0;color:var(--ink-2);
}
.mast h1 span{color:var(--accent)}
.mast .per{font-family:var(--font-num);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ── tabs ─────────────────────────────────────────────────────── */
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--sunk);
  padding:3px;border-radius:9px;margin-bottom:18px}
.tabs button{
  appearance:none;border:0;background:transparent;color:var(--ink-3);
  font-family:inherit;font-size:12.5px;font-weight:600;letter-spacing:0;
  padding:8px 2px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── card ─────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card > h2{
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 12px;
}
.card > h2.mt{margin-top:22px}

/* ── date navigator ───────────────────────────────────────────── */
.datenav{display:flex;align-items:center;gap:6px;margin:-2px 0 12px}
.datenav button{appearance:none;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-2);font:inherit;font-size:19px;line-height:1;width:38px;height:36px;
  border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.datenav button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.datenav button:disabled{opacity:.28;cursor:default}
.datenav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.datenav .dlabel{flex:1;text-align:center;font-family:var(--font-num);font-size:15px;
  font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;
  justify-content:center;gap:6px}
.datenav .dlabel span{color:var(--ink-3);font-weight:400}
.datenav .dlabel b{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--accent-ink);background:var(--accent-soft);padding:3px 7px;border-radius:5px}
.datenav .dlabel b.soon{color:var(--t2);background:color-mix(in srgb,var(--t2) 15%,transparent)}
.jump em{font-style:normal;font-family:var(--font-num);opacity:.7;margin-left:3px}
.jump{appearance:none;width:100%;border:1px dashed var(--line);background:transparent;
  color:var(--ink-3);font:inherit;font-size:12.5px;padding:8px;border-radius:8px;
  cursor:pointer;margin-bottom:12px}
.jump:hover{color:var(--ink);border-color:var(--ink-3)}
.jump:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── the readout (big number) ─────────────────────────────────── */
.readout{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.readout .big{font-family:var(--font-num);font-size:44px;line-height:.92;font-weight:600;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.readout .big em{font-style:normal;font-size:20px;color:var(--ink-3);margin-left:2px}
.readout .side{text-align:right;font-family:var(--font-num);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;line-height:1.6}
.readout .side b{color:var(--ink-2);font-weight:600}

/* ── daily track: grid of target cells ────────────────────────── */
.track{display:grid;gap:3px;height:34px;margin-bottom:6px}
.cell{background:var(--sunk);border-radius:3px}
.blk{border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-num);font-size:10px;font-weight:700;color:var(--bg);
  animation:pop .28s cubic-bezier(.2,.9,.3,1.4)}
.blk.t1{background:var(--t1)} .blk.t2{background:var(--t2)} .blk.t3{background:var(--t3)}
@keyframes pop{from{transform:scaleX(.3);opacity:0}to{transform:scaleX(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.blk{animation:none}}
.track-legend{display:flex;justify-content:space-between;font-family:var(--font-num);
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.bonus{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent-ink)}
.bonus .bar{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bonus .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ── done banner ──────────────────────────────────────────────── */
.done-banner{
  margin:14px 0 2px;padding:13px 14px;border-radius:10px;
  background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);
  display:flex;align-items:center;gap:10px;
}
.done-banner b{color:var(--good);font-size:14.5px;font-weight:650}
.done-banner span{color:var(--ink-2);font-size:12.5px}

/* ── weekly: day columns ──────────────────────────────────────── */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:96px;margin-bottom:7px}
.day{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;position:relative}
.day .stack{background:var(--surface-2);border-radius:3px 3px 2px 2px;min-height:3px;
  transition:height .3s ease;position:relative;overflow:hidden}
.day.hit .stack{background:var(--good)}
.day.some .stack{background:var(--t2)}
.day.today .stack{outline:1.5px solid var(--accent);outline-offset:1px}
.day .pt{font-family:var(--font-num);font-size:10px;text-align:center;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.day.hit .pt,.day.some .pt{color:var(--ink-2)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10.5px;text-align:center;
  color:var(--ink-3);letter-spacing:.02em}
.dow span.now{color:var(--accent);font-weight:700}
.tgtline{border-top:1px dashed var(--line);position:relative;margin:0 0 -1px}

/* ── reward ladder ────────────────────────────────────────────── */
.rail{position:relative;height:9px;background:var(--sunk);border-radius:5px;margin:18px 0 10px}
.rail i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px;transition:width .35s ease}
.rail u{position:absolute;top:-4px;width:1.5px;height:17px;background:var(--line);text-decoration:none}
.rail u.on{background:var(--accent-ink)}
.ladder{display:flex;flex-direction:column;gap:1px}
.rw{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px}
.rw .pct{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3);width:36px;
  font-variant-numeric:tabular-nums;flex:none}
.rw input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;padding:2px 0}
.rw input::placeholder{color:var(--ink-3);font-style:italic}
.rw input:focus{outline:0;border-bottom:1px solid var(--accent)}
.rw .st{font-family:var(--font-num);font-size:11px;color:var(--ink-3);flex:none;
  font-variant-numeric:tabular-nums}
.rw.locked{opacity:.55}
.rw.next{background:var(--accent-soft)}
.rw.next .pct{color:var(--accent-ink)}
.rw.got{background:var(--good-soft)}
.rw.got .pct{color:var(--good)}
.rw button{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--bg);
  font:inherit;font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:6px;cursor:pointer;flex:none}
.rw button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* ── task rows ────────────────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:8px;
  cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:transparent}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;transition:.14s}
.row.on .box{background:var(--good);border-color:var(--good)}
.box svg{width:11px;height:11px;stroke:var(--bg);stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.on .box svg{opacity:1}
.row .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row.on .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.tier{font-family:var(--font-num);font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:2px 6px;border-radius:4px;flex:none}
.tier.t1{color:var(--t1);background:color-mix(in srgb,var(--t1) 15%,transparent)}
.tier.t2{color:var(--t2);background:color-mix(in srgb,var(--t2) 15%,transparent)}
.tier.t3{color:var(--t3);background:color-mix(in srgb,var(--t3) 18%,transparent)}
.dayspec{font-family:var(--font-num);font-size:10.5px;color:var(--ink-3);flex:none;letter-spacing:.06em}
/* touch devices have no hover, so row buttons must stay visible there */
.del,.edit{appearance:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  line-height:1;padding:5px 7px;border-radius:5px;flex:none;opacity:.5;
  display:flex;align-items:center}
.del{font-size:17px}
.edit svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){ .del,.edit{opacity:0} }
.row:hover .del,.row:hover .edit,.del:focus-visible,.edit:focus-visible{opacity:1}
.del:hover,.edit:hover{color:var(--accent-ink);background:var(--surface-2)}

/* ── inline edit ──────────────────────────────────────────────── */
.editrow{display:flex;flex-direction:column;gap:9px;padding:12px 10px;margin:2px 0;
  background:var(--surface-2);border:1px solid var(--accent);border-radius:10px}
.editrow input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;font-size:14px}
.editrow input[type=text]:focus{outline:0;border-color:var(--accent)}
.editbtns{display:flex;gap:7px}
.editbtns button{flex:1;appearance:none;border:0;font:inherit;font-size:13px;font-weight:650;
  padding:10px;border-radius:8px;cursor:pointer}
.editbtns .ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.editbtns .ghost:hover{background:var(--bg)}
.editbtns .save{background:var(--ink);color:var(--bg)}
.editbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.del:hover{color:var(--accent-ink);background:var(--surface-2)}
.rate{font-family:var(--font-num);font-size:11px;color:var(--ink-3);flex:none;
  font-variant-numeric:tabular-nums}

.empty{padding:22px 8px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.7}

/* ── study time ───────────────────────────────────────────────── */
.tchip{appearance:none;border:1px dashed var(--line);background:transparent;color:var(--ink-3);
  font-family:var(--font-num);font-size:11px;font-weight:600;padding:4px 8px;border-radius:6px;
  cursor:pointer;flex:none;white-space:nowrap;touch-action:manipulation}
.tchip:hover{border-color:var(--accent);color:var(--accent-ink)}
.tchip.set{border-style:solid;border-color:var(--t2);color:var(--t2);
  background:color-mix(in srgb,var(--t2) 10%,transparent)}
.tchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── timeline ─────────────────────────────────────────────────── */
/* fixed-width gutter so the times line up into a column and the list reads
   as a schedule; the ＋시각 affordance has to stay visible because touch
   devices have no hover to reveal it */
.atchip{appearance:none;border:1px dashed var(--line);background:transparent;color:var(--ink-3);
  font-family:var(--font-num);font-size:11px;font-weight:600;padding:4px 0;border-radius:6px;
  cursor:pointer;flex:none;width:52px;text-align:center;white-space:nowrap;
  font-variant-numeric:tabular-nums;touch-action:manipulation}
.atchip:hover{border-color:var(--accent);color:var(--accent-ink)}
.atchip.set{border-style:solid;border-color:var(--line);background:var(--surface-2);color:var(--ink-2)}
.row.on .atchip.set{border-color:var(--line-soft);background:transparent;color:var(--ink-3)}
.atchip:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.nowline{display:flex;align-items:center;gap:7px;margin:4px 0;pointer-events:none}
.nowline::before{content:"";width:52px;height:1px;background:var(--accent);opacity:.45;flex:none}
.nowline::after{content:"";flex:1;height:1px;background:var(--accent);opacity:.28}
.nowline span{font-family:var(--font-num);font-size:10px;font-weight:650;letter-spacing:.06em;
  color:var(--accent-ink);flex:none;font-variant-numeric:tabular-nums}

.secdiv{font-size:10px;letter-spacing:.11em;color:var(--ink-3);margin:11px 0 3px;padding-left:8px}

.tphint{margin-top:9px;font-size:11.5px;line-height:1.6;color:var(--ink-3)}
.tphint b{color:var(--ink-2);font-weight:650}

/* a row jumps to a new position the moment its time changes — light it so the
   eye can follow where it went */
@keyframes rowflash{from{background:var(--accent-soft)} to{background:transparent}}
.row.flash{animation:rowflash 1.5s ease-out}
@media (prefers-reduced-motion:reduce){ .row.flash{animation:none;background:var(--accent-soft)} }

.tpick{margin:2px 0 6px;padding:12px;border-radius:10px;background:var(--surface-2);
  border:1px solid var(--line)}
.tpl{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
.tprow{display:flex;flex-wrap:wrap;gap:5px}
.tprow.custom{margin-top:8px}
.tprow button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font-family:var(--font-num);font-size:12.5px;font-weight:600;padding:9px 11px;border-radius:8px;
  cursor:pointer;touch-action:manipulation}
.tprow button:hover{border-color:var(--accent);color:var(--ink)}
.tprow button[aria-pressed="true"]{background:var(--t2);border-color:var(--t2);color:var(--surface)}
.tprow button.clr{color:var(--ink-3);border-style:dashed}
.tprow button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.tprow input{flex:1;min-width:90px;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:9px 11px;color:var(--ink);font-family:var(--font-num);font-size:13px}
.tprow input:focus{outline:0;border-color:var(--accent)}

.studyrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  margin-top:13px;padding:12px 13px;border-radius:9px;background:var(--sunk)}
.studyrow span{font-size:11px;letter-spacing:.11em;text-transform:uppercase;color:var(--ink-3)}
.studyrow b{font-family:var(--font-num);font-size:19px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.studyrow b.zero{font-size:13px;font-weight:400;color:var(--ink-3)}
.studyhint{margin-top:7px;font-size:11.5px;color:var(--ink-3);text-align:right}

.days.mins .stack{background:var(--t2)}
.card > h2 em{float:right;font-style:normal;font-family:var(--font-num);font-size:12px;
  letter-spacing:0;text-transform:none;color:var(--ink-2)}
.bl em{font-style:normal;font-family:var(--font-num);font-size:11px;color:var(--ink-3);font-weight:400}


/* ── add form ─────────────────────────────────────────────────── */
.add{margin-top:12px;padding-top:14px;border-top:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:10px}
.add input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;font-size:14px}
.add input[type=text]:focus{outline:0;border-color:var(--accent)}
.seg{display:flex;gap:4px}
.seg button{flex:1;appearance:none;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:8px 4px;
  border-radius:7px;cursor:pointer;transition:.13s}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dowpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dowpick button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-3);
  font:inherit;font-size:12px;font-weight:600;padding:8px 0;border-radius:7px;cursor:pointer}
.dowpick button[aria-pressed="true"]{background:var(--t2);border-color:var(--t2);color:var(--bg)}
.dowpick button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.addbtn{appearance:none;border:0;background:var(--ink);color:var(--bg);font:inherit;
  font-size:13.5px;font-weight:650;padding:11px;border-radius:8px;cursor:pointer}
.addbtn:disabled{opacity:.35;cursor:default}
.addbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── settings / footer ────────────────────────────────────────── */
.foot{display:flex;gap:8px;margin-top:4px}
.foot button{flex:1;appearance:none;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:10px;
  border-radius:8px;cursor:pointer}
.foot button:hover{background:var(--surface-2)}
.foot button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;
  font-size:13.5px;border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:0}
.setrow input{width:66px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:7px 9px;color:var(--ink);font-family:var(--font-num);font-size:14px;text-align:center}
.setrow input:focus{outline:0;border-color:var(--accent)}
.setrow small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}

.bkstat{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:9px;overflow:hidden;margin-bottom:14px}
.bkstat > div{background:var(--surface);padding:11px 10px;text-align:center}
.bkstat span{display:block;font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:4px}
.bkstat b{font-family:var(--font-num);font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.bkstat b.old{color:var(--accent-ink)}

/* ── condition tab ────────────────────────────────────────────── */
.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timegrid label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;
  letter-spacing:.06em;color:var(--ink-3)}
.timegrid input{background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;color:var(--ink);font-family:var(--font-num);font-size:17px;
  font-variant-numeric:tabular-nums;width:100%;min-height:46px}
.timegrid input:focus{outline:0;border-color:var(--accent)}

.sleepbig{margin-top:14px;padding:14px;background:var(--sunk);border-radius:10px;
  display:flex;align-items:baseline;justify-content:center;gap:5px}
.sleepbig b{font-family:var(--font-num);font-size:34px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.sleepbig em{font-style:normal;font-size:14px;color:var(--ink-3)}
.sleepbig .none{font-size:12.5px;color:var(--ink-3)}

.condpick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.condpick button{appearance:none;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-3);font-family:inherit;font-size:11px;font-weight:600;
  padding:10px 2px 9px;border-radius:9px;cursor:pointer;transition:.13s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  -webkit-tap-highlight-color:transparent}
.condpick button i{width:11px;height:11px;border-radius:50%;display:block}
.condpick i.c1{background:var(--cs1)} .condpick i.c2{background:var(--cs2)}
.condpick i.c3{background:var(--cs3)} .condpick i.c4{background:var(--cs4)}
.condpick i.c5{background:var(--cs5)}

/* ── sleep trend chart ────────────────────────────────────────── */
.schart{width:100%;height:auto;display:block;overflow:visible}
.slegend{display:flex;align-items:center;gap:5px;margin-top:10px;flex-wrap:wrap;
  font-size:10.5px;color:var(--ink-3)}
.slegend i{width:9px;height:9px;border-radius:50%;display:block;flex:none}
.slegend i.cs1{background:var(--cs1)} .slegend i.cs2{background:var(--cs2)}
.slegend i.cs3{background:var(--cs3)} .slegend i.cs4{background:var(--cs4)}
.slegend i.cs5{background:var(--cs5)}
.slegend .lr{margin-left:2px}
.condpick button:hover{border-color:var(--ink-3);color:var(--ink)}
.condpick button[aria-pressed="true"]{background:var(--surface-2);border-color:var(--accent);
  color:var(--ink);box-shadow:0 0 0 2px var(--accent-soft)}
.condpick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.drep{display:flex;flex-direction:column;gap:1px}
.drow{display:flex;align-items:baseline;gap:12px;padding:10px 2px;
  border-bottom:1px solid var(--line-soft)}
.drow:last-child{border-bottom:0}
.drow .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  width:62px;flex:none}
.drow .v{font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.drow .v s{text-decoration:none;color:var(--ink-3);font-size:11.5px;margin-left:6px}
.drow.good .v{color:var(--good);font-weight:600}

.submitrow{display:flex;gap:8px;margin-top:16px}
.submitrow button{flex:1;appearance:none;border:0;font:inherit;font-size:14px;font-weight:650;
  padding:13px;border-radius:9px;cursor:pointer;transition:.13s}
.submitrow .submit{background:var(--ink);color:var(--bg)}
.submitrow .submit:disabled{opacity:.3;cursor:default}
.submitrow .ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.submitrow .ghost:hover{background:var(--surface-2);color:var(--ink)}
.submitrow .ghost.danger{color:var(--ink-3)}
.submitrow .ghost.danger:hover{color:var(--accent-ink);border-color:var(--accent)}
.submitrow button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{margin-top:9px;text-align:center;font-size:12px;color:var(--ink-3)}

/* ── sleep vs output, in the weekly report ────────────────────── */
.cmp{display:flex;flex-direction:column;gap:1px;margin:12px 0 4px}
.cmpline{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 12px;background:var(--sunk);border-radius:8px;font-size:13px;color:var(--ink-2)}
.cmpline > span{display:flex;flex-direction:column;gap:2px;min-width:0}
.cmpline > span i{font-style:normal;font-family:var(--font-num);font-size:10.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums}
.cmpline b{font-family:var(--font-num);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.cmpline:first-child b{color:var(--good)}

.slist{display:flex;flex-direction:column;gap:1px;margin-top:12px}
.sline{display:grid;grid-template-columns:28px 1fr 1fr 56px;align-items:center;gap:8px;
  padding:8px 2px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.sline:last-child{border-bottom:0}
.sline .d{color:var(--ink-3);font-weight:600}
.sline .s,.sline .p{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sline .p{text-align:right;color:var(--ink-2)}
.sline .c{color:var(--ink-3)}

/* ── report ───────────────────────────────────────────────────── */
.rep-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
.rep-h .t{font-size:16px;font-weight:650}
.rep-h .t i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--t2);background:color-mix(in srgb,var(--t2) 15%,transparent);
  padding:3px 7px;border-radius:5px;vertical-align:2px;margin-left:4px}
.rep-h .d{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:9px;overflow:hidden;margin:16px 0}
.stat{background:var(--surface);padding:11px 12px}
.stat .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.stat .v{font-family:var(--font-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:3px}
.stats.three{grid-template-columns:repeat(3,1fr)}
.stats.three .stat{padding:11px 8px}
.stat .v.sm{font-family:var(--font-ui);font-size:15px;font-weight:600}
.stat .v.hit{color:var(--good)}
.note{font-size:13px;color:var(--ink-2);line-height:1.65;padding:12px 13px;background:var(--sunk);
  border-radius:9px;margin-top:14px}
.note.big{font-size:14px;line-height:1.8;padding:16px}

/* ── today vs yesterday ───────────────────────────────────────── */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:11px;overflow:hidden;margin-bottom:12px}
.vs.solo{grid-template-columns:1fr}
.vscol{background:var(--surface);padding:16px 12px;text-align:center}
.vscol .lab{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);
  margin-bottom:6px}
.vscol .num{font-family:var(--font-num);font-size:38px;line-height:1;font-weight:600;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink-3)}
.vscol .unit{font-family:var(--font-num);font-size:11px;color:var(--ink-3);margin-top:3px}
.vscol.now{background:var(--surface-2)}
.vscol.now .num{color:var(--ink)}

.delta{text-align:center;font-family:var(--font-num);font-size:15px;font-weight:600;
  font-variant-numeric:tabular-nums;padding:9px;border-radius:8px}
.delta.up{color:var(--good);background:var(--good-soft)}
.delta.flat{color:var(--ink-3);background:var(--sunk)}
.delta.down{color:var(--ink-2);background:var(--sunk)}
.goalline{text-align:center;font-size:12px;color:var(--ink-3);margin-top:11px;
  font-variant-numeric:tabular-nums}

/* ── insights ─────────────────────────────────────────────────── */
.need{padding:14px;background:var(--sunk);border-radius:9px;font-size:12.5px;
  color:var(--ink-3);line-height:1.65;text-align:center}
.need b{font-family:var(--font-num);font-size:15px;color:var(--ink-2)}

.caution{display:flex;flex-direction:column;gap:3px;margin-bottom:13px;padding:10px 12px;
  border-radius:8px;background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 30%,transparent);
  font-size:12px;line-height:1.55;color:var(--accent-ink)}
.caution s{text-decoration:none;font-family:var(--font-num);font-size:10.5px;
  color:var(--ink-3);font-variant-numeric:tabular-nums}

.btable{display:flex;flex-direction:column;gap:1px}
.brow{display:flex;flex-direction:column;gap:7px;padding:11px 2px;
  border-bottom:1px solid var(--line-soft)}
.brow:last-child{border-bottom:0}
.bl{font-size:13px;font-weight:600;display:flex;align-items:baseline;gap:7px}
.bl s{text-decoration:none;font-family:var(--font-num);font-size:11px;font-weight:400;color:var(--ink-3)}
.bv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcell{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--ink-3)}
.bcell.wide{grid-column:1 / -1}
.bcell span{flex:none;width:34px}
.bcell u{text-decoration:none;font-family:var(--font-num);font-size:13px;color:var(--ink);
  font-variant-numeric:tabular-nums;flex:none;width:42px}
.mbar{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden;min-width:24px}
.mbar i{display:block;height:100%;border-radius:3px;background:var(--ink-3)}
.mbar i.good{background:var(--good)}
.mbar i.acc{background:var(--accent)}

.finding{margin-top:16px;padding:15px;border-radius:10px;background:var(--accent-soft);
  border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.finding .fk{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--accent-ink)}
.finding .fv{font-family:var(--font-num);font-size:24px;font-weight:600;margin:5px 0 4px;
  color:var(--ink);font-variant-numeric:tabular-nums}
.finding .fs{font-size:11.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}

.secintro{font-size:12.5px;color:var(--ink-2);line-height:1.65;margin:-4px 0 16px}
.secintro b{color:var(--ink);font-weight:600}

.cmp2{margin-bottom:22px;padding-bottom:22px;border-bottom:1px solid var(--line-soft)}
.cmp2:last-child{margin-bottom:0;padding-bottom:0;border-bottom:0}
.cmp2 .ck{font-size:14px;font-weight:650;line-height:1.45;margin-bottom:5px}
.cmp2 .cd{font-size:12px;color:var(--ink-3);line-height:1.6;margin-bottom:11px}
.cmp2 .cmpline{margin-bottom:1px}
.cmpline b s{text-decoration:none;font-size:10.5px;color:var(--ink-3);margin-left:2px}
.cnote{margin-top:10px;font-size:13px;color:var(--ink-2);line-height:1.75;
  padding:13px 14px;border-radius:9px;background:var(--sunk)}
.cnote b{font-weight:650;color:var(--ink)}
.cnote em{display:block;margin-top:8px;font-style:normal;font-family:var(--font-num);
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums;opacity:.85}
.cnote.warn{background:var(--accent-soft);color:var(--accent-ink)}
.cnote.warn b{color:var(--accent-ink)}
.cnote.ok{background:var(--good-soft);color:var(--good)}
.cnote.ok b{color:var(--good)}
.arch{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.arch:hover{background:var(--surface-2)}
.arch .w{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3);flex:none;width:44px}
.arch .p{margin-left:auto;font-family:var(--font-num);font-size:12.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums}

/* ── toast ────────────────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;
  font-size:13.5px;font-weight:600;z-index:60;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
  max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.28)}
#toast.up{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

.warn{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-ink);
  padding:11px 13px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:14px}
.hide{display:none !important}
img.pix{image-rendering:pixelated}
.pet{position:fixed;left:0;bottom:calc(env(safe-area-inset-bottom,0px) + 6px);
  width:72px;height:72px;z-index:30;cursor:pointer;
  -webkit-tap-highlight-color:transparent;touch-action:manipulation}
.pet img{width:100%;height:100%;object-fit:contain;display:block;
  filter:drop-shadow(0 2px 3px rgba(14,31,38,.28))}
.pet.pix img{image-rendering:pixelated}
.pet.flip img{transform:scaleX(-1)}
.gset{margin:10px 0 2px}
.bkask .bkrow{display:flex;gap:8px;margin-top:10px}
.bkask .bkrow button{flex:1;padding:10px;font-size:13px}
/* the gacha readout counts a handful of tickets, not a 3-digit percentage —
   the shared 44px display number reads as a shout at that scale */
.greadout .big{font-size:26px}
.greadout .big em{font-size:13px}
.greadout{margin-bottom:11px}
.greadout .big.owe{color:var(--ink-3)}
.readout .side .rate{color:var(--ink-3);font-size:11px}
.gline{display:flex;gap:9px;align-items:center;margin:11px 0 3px}
.gline .pull{flex:1;padding:13px;border-radius:10px;border:0;font:inherit;font-weight:700;
  font-size:14px;background:var(--accent);color:#fff;cursor:pointer}
.gline .pull[disabled]{background:var(--sunk);color:var(--ink-3);cursor:default}
.gline .dexbtn{padding:13px 15px;border-radius:10px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink-2);font:inherit;font-size:13px;cursor:pointer}
.gres{display:flex;gap:13px;align-items:center;margin-top:12px;padding:12px;
  border-radius:11px;background:var(--surface-2);border:1px solid var(--line-soft)}
.gres img{width:74px;height:74px;flex:none;object-fit:contain}
.gres .nm{font-size:16px;font-weight:700;line-height:1.35}
.gres .mt{font-size:11.5px;color:var(--ink-3);margin-top:3px}
.gnew{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
  background:var(--good-soft);color:var(--good);font-size:10px;font-weight:700;letter-spacing:.06em}
.gdup{display:inline-block;margin-left:6px;padding:1px 6px;border-radius:5px;
  background:var(--sunk);color:var(--ink-3);font-size:10px;font-weight:700}
.dexgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));
  gap:5px;margin-top:11px}
.dexcell{position:relative;aspect-ratio:1;border-radius:8px;background:var(--surface-2);
  border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center}
.dexcell img{width:100%;height:100%;object-fit:contain}
.dexcell.miss img{filter:brightness(0);opacity:.17}
.dexcell .cnt{position:absolute;right:2px;bottom:1px;font-size:9.5px;font-weight:700;
  color:var(--ink-3)}
.dexcell.leg{border-color:var(--accent);background:var(--accent-soft)}
.dexcell.walk{border-color:var(--accent);border-width:2px;box-shadow:0 0 0 2px var(--accent-soft)}
.dexcell.walk::after{content:"산책";position:absolute;left:2px;top:1px;font-size:8.5px;
  font-weight:700;color:var(--accent-ink);background:var(--accent-soft);border-radius:4px;padding:0 3px}
/* the whole grid turns when the set is finished — a scatter of green cells
   read as noise rather than as an achievement */
.dexgrid.done .dexcell{border-color:var(--good)}
.dexgrid.done .dexcell .cnt{color:var(--good)}
.mrow{display:flex;gap:8px;align-items:center;padding:8px 10px;border-radius:9px;
  background:var(--surface-2);border:1px solid var(--line-soft);margin-top:7px}
.mrow img{width:38px;height:38px;flex:none;object-fit:contain}
.mrow .nm{flex:1;font-size:13px;font-weight:600}
.mrow button{padding:7px 11px;border-radius:8px;border:0;background:var(--accent);
  color:#fff;font:inherit;font-size:12px;font-weight:700;cursor:pointer}
.mpick{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.mpick button{display:flex;flex-direction:column;align-items:center;gap:2px;
  padding:7px 9px;border-radius:9px;border:1px solid var(--line);
  background:var(--surface);color:var(--ink);font:inherit;font-size:11px;cursor:pointer}
.mpick img{width:40px;height:40px;object-fit:contain}
/* ── 인적성 (취준 기록판) ───────────────────────────────────── */
.tglab{font-size:10.5px;letter-spacing:.08em;color:var(--ink-3);margin:14px 0 6px;font-weight:600}
.tchips{display:flex;flex-wrap:wrap;gap:5px}
.tchips button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:12.5px;padding:7px 11px;border-radius:999px;cursor:pointer;
  touch-action:manipulation}
.tchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--bg);font-weight:600}
.tchips button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.numgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.numgrid.three{grid-template-columns:1fr 1fr 1fr}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin:10px 0 2px}
.lgi{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2)}
.lgi.off{opacity:.4}
.lgi{cursor:pointer}
.lgi.hid{opacity:.32;text-decoration:line-through;text-decoration-thickness:1px}
.lgi:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}
.lgi svg{width:12px;height:12px;flex:none}
.lgi i{font-style:normal;font-family:var(--font-num);font-size:10.5px;color:var(--ink-3)}
.card > h2.h2row{display:flex;align-items:center;gap:8px}
.card > h2.h2row em{flex:1}
.hbtn{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font-family:inherit;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:none;
  padding:6px 10px;border-radius:7px;cursor:pointer;flex:none}
.hbtn:hover,.hbtn:focus-visible{color:var(--ink);border-color:var(--ink-3)}

/* Minutes are the currency, not tickets. Each set prices a pull differently,
   and a ticket count can't be shared across two prices. Spending in minutes
   also makes an edited study time behave exactly as expected: changing 30min
   to 60min adds 30 minutes of pulling power, no rounding drift either way. */
var COST = { pk:20, sr:30 };
/* beta pulls are free so artwork can be checked without grinding for tickets.
   Production always pays. */
var FREEPULL = IS_BETA;
var STW  = {1:9, 2:3, 3:1};   /* each evolution step is 3x rarer */
var LEGRATE = 0.005;          /* legendary+mythical share of a full pool */
var LEGW = (function(){
  var wnl=0, nl=0;
  DIDS.forEach(function(i){ if (DEX[i].leg) nl++; else wnl += STW[DEX[i].stage]; });
  return (LEGRATE*wnl/(1-LEGRATE))/nl;
})();
function gw(i){ return DEX[i].leg ? LEGW : STW[DEX[i].stage]; }
function sprite(id){

/* ───────── 외부 팩 ─────────
   A pack carries its own artwork and its own item list. Nothing from a pack
   ships with this app or lives in the repository — it is imported from a file
   and kept in this browser only, under its own storage key so a board backup
   stays small and the two files never get confused for each other. */
var PACKKEY = IS_BETA ? "octopus.pack.sr.beta" : "octopus.pack.sr";
var PACK=null, SRBY={}, SRG={}, SRIDS=[];
function packInstall(p){
  PACK=p; SRBY={}; SRG={}; SRIDS=[];
  (p.items||[]).forEach(function(it){
    SRBY[it.id]=it; SRIDS.push(it.id);
    (SRG[it.slug]=SRG[it.slug]||[]).push(it.id);
  });
}
try {
  var _pr = localStorage.getItem(PACKKEY);
  if (_pr) packInstall(JSON.parse(_pr));
} catch(e){ PACK=null; }

/* ───────── 세트 공통 인터페이스 ─────────
   Both sets answer the same questions, so pool / pull / dex code is written
   once. Pokemon weights by evolution stage; a pack is flat. */
function SET(k){
  if (k==="sr"){
    if (!PACK) return null;
    return { key:"sr", label:(PACK.name||"팩"), ids:SRIDS, pix:false, cap:3, groupCeil:false,
      grp:function(id){ return SRBY[id].slug; },
      mem:function(g){ return SRG[g]; },
      w:function(){ return 1; },
      nm:function(id){ return SRBY[id].ko; },
      im:function(id){ return SRBY[id].img; },
      sub:function(){ return ""; } };
  }
  return { key:"pk", label:"포켓몬", ids:DIDS, pix:true, cap:0, groupCeil:true,
    grp:function(id){ return DEX[id].line; },
    mem:function(g){ return LINES[g]; },
    w:gw,
    nm:function(id){ return DEX[id].ko; },
    im:sprite,
    sub:function(id){ var p=DEX[id];
      return "No."+String(id).padStart(3,"0")+" · "+p.ty+" · "+p.stage+"단계"+(p.leg?" · 전설":""); } };
}

function G(){
  var g=S.gacha;
  if (!g) g = S.gacha = {usedMins:0, set:"pk",
                         pk:{dex:{},hold:{},last:null}, sr:{dex:{},hold:{},last:null}};
  if (g.dex || g.hold){                    /* carry over the single-set shape */
    g.pk={dex:g.dex||{}, hold:g.hold||{}, last:g.last||null};
    delete g.dex; delete g.hold; delete g.last;
  }
  if (g.usedMins===undefined){ g.usedMins = (g.used||0) * 20; delete g.used; }
  if (!g.pk) g.pk={dex:{},hold:{},last:null};
  if (!g.sr) g.sr={dex:{},hold:{},last:null};
  if (g.set!=="sr" && g.set!=="pk") g.set="pk";
  return g;
}
/* keep whatever the user picked, even with no pack installed — otherwise the
   set silently snaps back to Pokemon and the "load a pack" screen is
   unreachable. Every caller already handles SET() returning null. */
function curKey(){ var g=G(); return g.set==="sr" ? "sr" : "pk"; }
function gsub(k){ return G()[k||curKey()]; }

/* a group leaves the pool once every member is REGISTERED — registration is
   permanent, so merging away your copies can never re-open a finished group */
function grpDone(D,k,g){
  var m=D.mem(g), dx=gsub(k).dex;
  for (var i=0;i<m.length;i++) if (!dx[m[i]]) return false;
  return true;
}
/* Each set gets exactly one ceiling, whichever suits it.
   Pokemon: a whole evolution line leaves once every member is registered —
   spares still matter there because three of them merge into the next stage.
   A pack: no merging, so the ceiling sits on the picture itself. Hold `cap`
   of one and it steps aside, and pulls keep moving toward what you don't have. */
function poolOf(D,k){
  /* the game closes when the dex is full — spares are never a requirement */
  if (dexCountOf(k) >= D.ids.length) return [];
  var out=[], memo={}, hold=gsub(k).hold;
  for (var i=0;i<D.ids.length;i++){
    var id=D.ids[i];
    if (D.groupCeil){
      var g=D.grp(id);
      if (memo[g]===undefined) memo[g]=grpDone(D,k,g);
      if (memo[g]) continue;
    }
    if (D.cap && (hold[id]||0) >= D.cap) continue;
    out.push(id);
  }
  return out;   /* empty means finished — for a capped set that is the goal */
}
function dexCountOf(k){ var n=0, dx=gsub(k).dex; for (var i in dx) if (dx[i]) n++; return n; }

function studyMins(){
  var s=0;
  for (var d in S.time) for (var id in S.time[d]) s += S.time[d][id];
  return s;
}
/* the balance is allowed to go negative: deleting a study record takes back
   the pulls it paid for, and the board says so plainly instead of hiding it.
   It is a balance, not a punishment — shown in muted ink, never in alarm red. */
function balMins(){ return studyMins() - (G().usedMins||0); }
function costOf(k){ return COST[k] || COST.pk; }
function ticketsLeft(k){
  if (FREEPULL) return Infinity;
  return Math.floor(balMins()/costOf(k||curKey()));
}

function doPull(){
  var k=curKey(), D=SET(k);
  if (!D || (!FREEPULL && balMins() < costOf(k))) return null;
  var p=poolOf(D,k); if (!p.length) return null;

  /* A pack may name the character its very first pull should give, so someone
     opening the set for the first time meets the one they came for. Once only,
     and only while that set's dex is still empty. */
  if (k==="sr" && PACK && PACK.first && dexCountOf("sr")===0){
    var favs=[];
    for (var f=0; f<p.length; f++) if (SRBY[p[f]].slug===PACK.first) favs.push(p[f]);
    if (favs.length){
      var fid=favs[Math.floor(Math.random()*favs.length)], gg=G(), sst=gg.sr;
      if (!FREEPULL) gg.usedMins=(gg.usedMins||0)+costOf(k);
      sst.hold[fid]=(sst.hold[fid]||0)+1;
      sst.dex[fid]=1;
      sst.last={id:fid, neu:true};
      return sst.last;
    }
  }

  var tot=0, i;
  for (i=0;i<p.length;i++) tot += D.w(p[i]);
  var r=Math.random()*tot;
  for (i=0;i<p.length;i++){ r -= D.w(p[i]); if (r<=0) break; }
  var id=p[Math.min(i,p.length-1)], g=G(), st=g[k];
  if (!FREEPULL) g.usedMins=(g.usedMins||0)+costOf(k);
  st.hold[id]=(st.hold[id]||0)+1;
  var neu=!st.dex[id];
  st.dex[id]=1;
  st.last={id:id, neu:neu};
  return st.last;
}
/* merging exists only where there is something to evolve into */
function canMerge(id){
  return curKey()==="pk" && DEX[id].to.length>0 && (gsub("pk").hold[id]||0)>=3;
}
function doMerge(id, to){
  if (!canMerge(id) || DEX[id].to.indexOf(to)<0) return null;
  var st=gsub("pk");
  st.hold[id]-=3;
  if (!st.hold[id]) delete st.hold[id];
  st.hold[to]=(st.hold[to]||0)+1;
  var neu=!st.dex[to];
  st.dex[to]=1;
  st.last={id:to, neu:neu};
  return st.last;
}
function mergeables(){ return curKey()==="pk" ? DIDS.filter(canMerge) : []; }

/* Walking companion. One character you have actually caught wanders along the
   bottom of the screen. Decoration only: it never touches points, tickets or
   the dex, and it can only ever show something already registered. */
var petState={x:24,dir:1,phase:"walk",until:0,cur:null,raf:null,last:0};

function petPool(){
  var out=[];
  ["pk","sr"].forEach(function(k){
    var D=SET(k); if(!D) return;
    var dx=(G()[k]||{}).dex||{};
    for (var i=0;i<D.ids.length;i++) if (dx[D.ids[i]]) out.push({k:k,id:D.ids[i]});
  });
  return out;
}
function petShow(pick){
  var box=el("pet"); if(!box) return false;
  var D=SET(pick.k); if(!D) return false;
  var img=box.querySelector("img");
  img.onerror=function(){ img.onerror=null; petNext(true); };
  img.src=D.im(pick.id);
  box.classList.toggle("pix", !!D.pix);
  petState.cur=pick;
  return true;
}
/* The walker is chosen, not shuffled. Falls back to the first thing you own so
   a stale choice can never leave the screen empty. */
function petValid(p){
  if(!p || !p.k || p.id===undefined || p.id===null) return false;
  if(!SET(p.k)) return false;
  return !!(((G()[p.k]||{}).dex)||{})[p.id];
}
function petChosen(){
  if(petValid(S.petPick)) return S.petPick;
  var p=petPool();
  return p.length ? p[0] : null;
}
function petNext(){
  var pick=petChosen();
  if(!pick){ el("pet").classList.add("hide"); return; }
  petShow(pick);
  el("pet").classList.remove("hide");
}
function petStop(){
  if(petState.raf){ cancelAnimationFrame(petState.raf); petState.raf=null; }
  var b=el("pet"); if(b) b.classList.add("hide");
}
function petStart(){
  petStop();
  if(S.pet===false) return;
  if(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  if(!petPool().length) return;
  petNext();
  petState.last=0;
  petState.raf=requestAnimationFrame(petStep);
}
function petStep(ts){
  petState.raf=requestAnimationFrame(petStep);
  var box=el("pet"); if(!box || box.classList.contains("hide")) return;
  if(!petState.last) petState.last=ts;
  var dt=Math.min(64, ts-petState.last); petState.last=ts;

  if(ts>petState.until){
    if(petState.phase==="walk"){ petState.phase="idle"; petState.until=ts+2000+Math.random()*4000; }
    else {
      petState.phase="walk"; petState.until=ts+3000+Math.random()*6000;
      if(Math.random()<0.45) petState.dir*=-1;
    }
  }
  var w=box.offsetWidth||72, max=Math.max(0, innerWidth-w-6);
  if(petState.phase==="walk"){
    petState.x += petState.dir*(dt*0.044);   /* 유저 요청으로 2배 */
    if(petState.x<4){ petState.x=4; petState.dir=1; }
    if(petState.x>max){ petState.x=max; petState.dir=-1; }
  }
  var bob=petState.phase==="walk" ? Math.sin(ts/170)*2.2 : Math.sin(ts/620)*1.1;
  box.style.transform="translate("+Math.round(petState.x)+"px,"+bob.toFixed(1)+"px)";
  box.classList.toggle("flip", petState.dir<0);
}

/* ───────── date helpers (UTC-free, local calendar) ───────── */
function iso(d){
  return d.getFullYear() + "-" +
         String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ return addDays(d, -d.getDay()); }          /* Sunday start */
function weekNo(ws){
  var diff = Date.UTC(ws.getFullYear(), ws.getMonth(), ws.getDate()) - W33;
  return 33 + Math.round(diff / 604800000);
}
function weekKey(ws){ return ws.getFullYear() + "-W" + weekNo(ws); }
function monthKey(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0"); }
function md(d){ return (d.getMonth()+1) + "/" + d.getDate(); }

/* ───────── state ───────── */
var S, storageOK = true;

function blank(){
  return {
    v: 1,
    dailyTarget: 7,
    weeklyTarget: 35,
    tasks: [],
    log: {},                                     /* "YYYY-MM-DD": { taskId: true } */
    cond: {},                                    /* "YYYY-MM-DD": {sleep:"23:30", wake:"07:10", score:1..5}
                                                    filed under the date you WOKE UP */
    time: {},                                    /* "YYYY-MM-DD": { taskId: minutes }

    rewards: [ {pct:25,text:"",claimed:false},
               {pct:50,text:"",claimed:false},

    backupAsked: null,          /* "YYYY-MM" — 이 달의 백업 물음에 이미 답했다 */
    aptit: [],                   /* 인적성 연습 기록 — pt와 완전히 분리 */
    aptex: [],                   /* 인적성 시험 기록 (영역 통째로) */
    aptitV: 2,                   /* 연습 회차 버전 — 2 = 유형별 */
    aptexV: 2,                   /* 시험 회차 버전 — 2 = 영역별 */
