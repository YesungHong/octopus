    petPick: null                /* {k,id} — 산책할 애는 직접 고른다 */
  };
}

function encode(o){
  var bytes = new TextEncoder().encode(JSON.stringify(o));
  var bin = "";
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decode(s){
  var b = s.replace(/-/g,"+").replace(/_/g,"/");
  while (b.length % 4) b += "=";
  var bin = atob(b), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

function load(){
  var fromHash = null;
  if (location.hash.length > 3){
    try { fromHash = decode(location.hash.slice(1)); } catch(e){ fromHash = null; }
  }
  var stored = null;
  try { var raw = localStorage.getItem(KEY); if (raw) stored = JSON.parse(raw); }
  catch(e){ storageOK = false; }

  /* probe writability — a sandbox may allow read but block write */
  try { localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
  catch(e){ storageOK = false; }

  S = fromHash || stored || blank();
  if (fromHash) toast("링크에서 불러왔어");

  if (S.aptitV !== 2){
    var seenP = {};
    (S.aptit || []).slice().sort(function(a,b){
      if (a.ds !== b.ds) return a.ds < b.ds ? -1 : 1;
      return a.id < b.id ? -1 : 1;
    }).forEach(function(r){
      var k = r.exam + "|" + r.type;
      seenP[k] = (seenP[k] || 0) + 1;
      r.run = seenP[k];
    });
    S.aptitV = 2;
  }
  if (S.aptexV !== 2){
    var seenRun = {};
    (S.aptex || []).slice().sort(function(a,b){
      if (a.ds !== b.ds) return a.ds < b.ds ? -1 : 1;
      var ar = a.run||1, br = b.run||1;
      if (ar !== br) return ar - br;
      return a.id < b.id ? -1 : 1;
    }).forEach(function(r){
      var k = r.exam + "|" + r.sec;
      seenRun[k] = (seenRun[k] || 0) + 1;
      r.run = seenRun[k];
    });
    S.aptexV = 2;
  }

  var b = blank();
  for (var k in b) if (!(k in S)) S[k] = b[k];

  /* sweep minutes and log entries left behind by tasks deleted before the
     deletion path cleaned up after itself */
  var live = {};
  (S.tasks || []).forEach(function(t){ live[t.id] = 1; });
  [S.time, S.log].forEach(function(store){
    for (var d in store){
      for (var id in store[d]) if (!live[id]) delete store[d][id];
      if (!Object.keys(store[d]).length) delete store[d];
    }
  });
  /* 회차를 시험 단위로 세던 시절의 기록을 영역 단위로 다시 매긴다. 순서(무엇을
     먼저 봤나)는 그대로 두고 번호만 영역 안에서 1..N으로 고쳐 붙인다. */
  /* seed on first run so the question starts at the next month boundary
     rather than firing the moment this version lands mid-month */
  if (!S.backupAsked) S.backupAsked = monthKey(today());
  return S;
}

function save(){
  if (storageOK){
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ storageOK = false; }
  }
  if (!storageOK){
    /* fallback: keep the whole board in the address bar so a bookmark survives */
    try { history.replaceState(null,"", "#" + encode(S)); } catch(e){}
  }
  paintWarn();
}

function paintWarn(){
  var el = document.getElementById("storewarn");
  if (storageOK){ el.classList.add("hide"); return; }
  el.classList.remove("hide");
  el.textContent = "이 브라우저에 저장이 막혀 있어. 대신 주소창에 데이터를 싣고 있으니, 이 페이지를 즐겨찾기 해두면 기록이 남아.";
}

/* ───────── sleep & condition ───────── */
var CLABEL = {1:"지침", 2:"별로", 3:"보통", 4:"괜찮음", 5:"좋음"};

/* hours slept, wrapping past midnight; null when either end is missing */
function sleepHours(c){
  if (!c || !c.sleep || !c.wake) return null;
  var a = c.sleep.split(":"), b = c.wake.split(":");
  var s = (+a[0])*60 + (+a[1]), w = (+b[0])*60 + (+b[1]);
  var mins = w - s;
  if (mins <= 0) mins += 1440;
  return Math.round(mins/6)/10;
}
function condOn(ds){ return S.cond[ds] || null; }

/* A rough day earns a smaller finish line. Defaults derive from the base target;
   once the user edits them in settings they're stored outright and stay put. */
function defaultCondTargets(){
  var b = S.dailyTarget;
  return { 1: Math.max(1, b-2), 2: Math.max(1, b-1), 3: b, 4: b, 5: b };
}
function condTargets(){ return S.condTarget || defaultCondTargets(); }
function targetFor(ds){
  var c = condOn(ds);
  if (!c || !c.score) return S.dailyTarget;
  var m = condTargets();
  return m[c.score] || S.dailyTarget;
}
function targetNote(ds){
  var c = condOn(ds);
  if (!c || !c.score) return "";
  var t = targetFor(ds), b = S.dailyTarget;
  if (t === b) return "";
  if (t < b){
    return '<div class="tnote">컨디션이 <b>'+ CLABEL[c.score] +'</b>이라 오늘 목표를 '
         + t +'pt로 낮췄어. 그만큼이면 오늘 몫은 다 한 거야.</div>';
  }
  return '<div class="tnote up">컨디션이 <b>'+ CLABEL[c.score] +'</b>이라 오늘 목표가 '
       + t +'pt야. 무리다 싶으면 설정에서 언제든 내려도 돼.</div>';
}
function setCond(ds, key, val){
  if (!S.cond[ds]) S.cond[ds] = {};
  if (val === null || val === "") delete S.cond[ds][key];
  else S.cond[ds][key] = val;
  if (!Object.keys(S.cond[ds]).length) delete S.cond[ds];
}
function mean(arr){
  var v = arr.filter(function(x){ return x !== null && x !== undefined; });
  if (!v.length) return null;
  return v.reduce(function(a,b){ return a+b; },0) / v.length;
}
function median(arr){
  var v = arr.filter(function(x){ return x !== null && x !== undefined; }).slice().sort(function(a,b){ return a-b; });
  if (!v.length) return null;
  var m = Math.floor(v.length/2);
  return v.length % 2 ? v[m] : (v[m-1]+v[m])/2;
}

/* ───────── study time ─────────
   Deliberately has no target. Points answer "did it get done"; minutes answer
   "what did it cost me". Scoring the minutes would reward sitting still. */
function minsOn(ds){
  var m = S.time[ds] || {}, s = 0;
  for (var k in m) s += m[k];
  return s;
}
function minsFor(ds, id){ return (S.time[ds] && S.time[ds][id]) || 0; }
function setMins(ds, id, v){
  if (!S.time[ds]) S.time[ds] = {};
  if (!v) delete S.time[ds][id]; else S.time[ds][id] = v;
  if (!Object.keys(S.time[ds]).length) delete S.time[ds];
}
function weekMins(ws){
  var s = 0;
  for (var i=0;i<7;i++) s += minsOn(iso(addDays(ws,i)));
  return s;
}
function hm(mins){
  if (!mins) return "0분";
  var h = Math.floor(mins/60), m = mins % 60;
  if (!h) return m + "분";
  return h + "시간" + (m ? " " + m + "분" : "");
}
/* minutes recorded per tier, across all history */
function tierTimes(){
  var acc = {1:[], 2:[], 3:[]};
  for (var ds in S.time){
    for (var id in S.time[ds]){
      var t = taskById(id);
      if (t && acc[t.tier]) acc[t.tier].push(S.time[ds][id]);
    }
  }
  return acc;
}

/* ───────── scoring ───────── */
function taskById(id){
  for (var i=0;i<S.tasks.length;i++) if (S.tasks[i].id === id) return S.tasks[i];
  return null;
}
function doneOn(dateStr, id){ return !!(S.log[dateStr] && S.log[dateStr][id]); }

function toggle(dateStr, id){
  if (!S.log[dateStr]) S.log[dateStr] = {};
  if (S.log[dateStr][id]) delete S.log[dateStr][id];
  else S.log[dateStr][id] = true;
  if (!Object.keys(S.log[dateStr]).length) delete S.log[dateStr];
}

function ptsOn(dateStr){
  var m = S.log[dateStr], sum = 0;
  if (!m) return 0;
  for (var id in m){ var t = taskById(id); if (t) sum += PTS[t.tier]; }
  return sum;
}
function weekPts(ws){
  var sum = 0;
  for (var i=0;i<7;i++) sum += ptsOn(iso(addDays(ws,i)));
  return sum;
}

/* tasks that belong on a given date:
   - weekly  : routine scheduled on that weekday
   - day     : added from 일간, lives only on its own date
   - once    : ledger item, shows every day until it's done */
function tasksFor(d){
  var ds = iso(d), dow = d.getDay(), out = [];
  S.tasks.forEach(function(t){
    if (t.repeat === "weekly"){
      if (t.days.indexOf(dow) >= 0) out.push(t);
    } else if (t.repeat === "day"){
      if (t.date === ds) out.push(t);
    } else {
      if (doneOn(ds,t.id) || !oneOffDone(t.id)) out.push(t);
    }
  });
  return out;
}
function oneOffDone(id){
  for (var d in S.log) if (S.log[d][id]) return true;
  return false;
}
function oneOffDate(id){
  for (var d in S.log) if (S.log[d][id]) return d;
  return null;
}

/* ───────── scheduled time ─────────
   t.at is "HH:MM" or absent. It is a property of the task itself, so editing it
   on a weekly routine moves that routine on every day it runs — a one-day
   exception is a 그날 전용 task instead. Absent = 시간 미정, which is a normal
   state, not a missing value: most ledger items never get a time. */
function atMin(t){
  if (!t || !t.at) return null;
  var p = t.at.split(":");
  return (+p[0]) * 60 + (+p[1]);
}
function nowMin(){
  var n = new Date();
  return n.getHours() * 60 + n.getMinutes();
}
function setAt(id, v){
  var t = taskById(id);
  if (!t){ atId = null; render(); return; }
  if (v) t.at = v; else delete t.at;
  atId = null;
  flashId = id;                    /* the row is about to jump; light it so it can be followed */
  save(); render();
  setTimeout(function(){ flashId = null; }, 1600);
}

/* ───────── rendering ───────── */
var view = "day";
var dayOffset = 0;                                  /* 0 = today, negative = past */
var weekOffset = 0;                                 /* 0 = this week */
function cursorDay(){ return addDays(today(), dayOffset); }
function cursorWeek(){ return addDays(weekStart(today()), weekOffset*7); }

/* points already scheduled in a week, done or not — used to preview a future week */
function plannedPts(ws){
  var sum = 0;
  for (var i=0;i<7;i++){
    tasksFor(addDays(ws,i)).forEach(function(t){
      if (t.repeat !== "once") sum += PTS[t.tier];
    });
  }
  return sum;
}
var el = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function render(){
  var d = today(), ws = weekStart(d);
  el("period").textContent = "오늘 " + md(d) + " · W" + weekNo(ws);
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.v === view ? "true" : "false");
  });
  var v = el("view"), top = backupDue() ? backupBanner() : "";
  if (view === "cond") v.innerHTML = top + viewCond(cursorDay());
  if (view === "day")  v.innerHTML = top + viewDay(cursorDay());
  if (view === "week") v.innerHTML = top + viewWeek(cursorWeek());
  if (view === "all")  v.innerHTML = top + viewAll();
  if (view === "apt")  v.innerHTML = top + viewApt();
  wire();
}

/* shared by 컨디션 and 일간 — both ride the same date cursor */
function dayNav(d){
  var isToday = iso(d) === iso(today()), ahead = dayOffset > 0;
  var s = '<div class="datenav">'
    + '<button data-act="prevday" aria-label="이전 날">‹</button>'
    + '<div class="dlabel">'+ md(d) +' <span>('+ DOW[d.getDay()] +')</span>'
    +   (isToday ? '<b>오늘</b>' : (ahead ? '<b class="soon">예정</b>' : '')) +'</div>'
    + '<button data-act="nextday" aria-label="다음 날">›</button>'
    + '</div>';
  if (!isToday){
    s += '<button class="jump" data-act="jumptoday">오늘로 돌아가기 <em>'
       + (ahead ? "+"+dayOffset : dayOffset) + '일</em></button>';
  }
  return s;
}

/* ── 컨디션 ── */
/* Sleep over time. Gaps are left as gaps — the line never bridges a night you
   didn't record, because a straight line across missing data reads as a
   measurement that was never taken. */
function sleepChart(endDate, nDays){
  var pts = [];
  for (var i = nDays-1; i >= 0; i--){
    var d = addDays(endDate, -i), ds = iso(d), c = condOn(ds);
    pts.push({ ds: ds, d: d, hrs: sleepHours(c), score: c && c.score ? c.score : 0 });
  }
  var have = pts.filter(function(p){ return p.hrs !== null; });
  if (!have.length){
    return '<div class="need">아직 수면 기록이 없어. 위에서 잠든 시각과 일어난 시각을 넣어봐.</div>';
  }

  var W = 320, H = 132, pl = 24, pr = 8, pt_ = 10, pb = 20;
  var top = Math.max(9, Math.ceil(Math.max.apply(null, have.map(function(p){ return p.hrs; }))));
  var n = pts.length;
  var X = function(i){ return pl + (n <= 1 ? (W-pl-pr)/2 : i*(W-pl-pr)/(n-1)); };
  var Y = function(v){ return pt_ + (1 - v/top) * (H-pt_-pb); };
  var avg = mean(have.map(function(p){ return p.hrs; }));

  var s = '<svg class="schart" viewBox="0 0 '+W+' '+H+'" role="img" '
        + 'aria-label="최근 '+nDays+'일 수면 시간 추이">';

  /* gridlines */
  [0, top/2, top].forEach(function(v){
    s += '<line x1="'+pl+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(v).toFixed(1)+'" '
       + 'stroke="var(--line-soft)" stroke-width="1"/>'
       + '<text x="'+(pl-5)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" '
       + 'font-size="8" fill="var(--ink-3)">'+ (v % 1 ? v.toFixed(1) : v) +'</text>';
  });

  /* the user's own average, as a description — not a recommendation */
  s += '<line x1="'+pl+'" y1="'+Y(avg).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(avg).toFixed(1)+'" '
     + 'stroke="var(--accent)" stroke-width="1" stroke-dasharray="3 3" opacity=".7"/>'
     + '<text x="'+(W-pr)+'" y="'+(Y(avg)-4).toFixed(1)+'" text-anchor="end" '
     + 'font-size="8" fill="var(--accent-ink)">평균 '+ avg.toFixed(1) +'h</text>';

  /* segments only between adjacent recorded nights */
  for (var k=0;k<n-1;k++){
    if (pts[k].hrs === null || pts[k+1].hrs === null) continue;
    s += '<line x1="'+X(k).toFixed(1)+'" y1="'+Y(pts[k].hrs).toFixed(1)+'" '
       + 'x2="'+X(k+1).toFixed(1)+'" y2="'+Y(pts[k+1].hrs).toFixed(1)+'" '
       + 'stroke="var(--t2)" stroke-width="1.8" stroke-linecap="round"/>';
  }
  pts.forEach(function(p,i){
    if (p.hrs === null) return;
    s += '<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.hrs).toFixed(1)+'" r="3.2" '
       + 'fill="'+ (p.score ? 'var(--cs'+p.score+')' : 'var(--surface)') +'" '
       + 'stroke="var(--t2)" stroke-width="1.4"/>';
  });

  /* date ticks: first, middle, last */
  [0, Math.floor((n-1)/2), n-1].forEach(function(i, j, arr){
    if (arr.indexOf(i) !== j) return;
    s += '<text x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="'
       + (i===0 ? 'start' : (i===n-1 ? 'end' : 'middle')) +'" '
       + 'font-size="8" fill="var(--ink-3)">'+ md(pts[i].d) +'</text>';
  });
  s += '</svg>';

  s += '<div class="slegend"><span>점 색 = 그날 컨디션</span>'
     + [1,2,3,4,5].map(function(k2){
         return '<i class="cs'+k2+'" title="'+CLABEL[k2]+'"></i>'; }).join("")
     + '<span class="lr">'+ CLABEL[1] +' → '+ CLABEL[5] +'</span></div>';
  return s;
}

function ensureDraft(ds){
  if (cdraftDate === ds) return;
  cdraftDate = ds;
  var c = condOn(ds) || {};
  cdraft = { sleep: c.sleep || "", wake: c.wake || "", score: c.score || 0 };
  editingCond = false;
}

function viewCond(d){
  var ds = iso(d);
  ensureDraft(ds);
  var saved = condOn(ds);
  var open  = editingCond || !saved;
  var src   = open ? cdraft : saved;
  var hrs   = sleepHours(src);
  var pts = ptsOn(ds), tgt = targetFor(ds);

  var h = '<div class="card">';
  h += dayNav(d);

  if (open){
    h += '<h2>잠</h2>';
    h += '<div class="timegrid">'
       + '<label>잠든 시각<input type="time" id="cSleep" value="'+ (cdraft.sleep||"") +'"></label>'
       + '<label>일어난 시각<input type="time" id="cWake" value="'+ (cdraft.wake||"") +'"></label>'
       + '</div>';
    h += '<div class="sleepbig">'+ sleepBigText(hrs) +'</div>';

    h += '<h2 class="mt">컨디션</h2>';
    h += '<div class="condpick">'
       + [1,2,3,4,5].map(function(k){
           return '<button data-act="score" data-s="'+k+'" aria-pressed="'+(cdraft.score===k)+'">'
                + '<i class="c'+k+'"></i>'+ CLABEL[k] +'</button>';
         }).join("")
       + '</div>';

    var filled = !!(cdraft.sleep || cdraft.wake || cdraft.score);
    h += '<div class="submitrow">';
    if (saved) h += '<button class="ghost" data-act="cancelcond">취소</button>';
    h += '<button class="submit" data-act="submitcond"'+ (filled?'':' disabled') +'>제출</button>';
    h += '</div>';
    if (!filled) h += '<div class="hint">하나라도 채우면 제출할 수 있어.</div>';

  } else {
    h += '<h2>기록됨</h2>';
    h += '<div class="drep">'
       + drow("잠든 시각", saved.sleep || "—", "")
       + drow("일어난 시각", saved.wake || "—", "")
       + drow("수면", hrs === null ? "—" : hrs.toFixed(1) + '시간', hrs !== null ? "good" : "")
       + drow("컨디션", saved.score ? CLABEL[saved.score] : "—", "")
       + '</div>';
    h += '<div class="submitrow">'
       + '<button class="ghost" data-act="editcond">수정</button>'
       + '<button class="ghost danger" data-act="delcond">기록 지우기</button>'
       + '</div>';
  }
  h += '</div>';

  /* 하루 보고서 */
  h += '<div class="card"><h2>하루 보고서</h2>';
  h += '<div class="drep">'
     + drow("퀘스트", pts + ' / ' + tgt + ' pt', pts >= tgt ? "good" : "")
     + drow("수면", sleepText(src, hrs), "", "dSleepVal")
     + drow("컨디션", src.score ? CLABEL[src.score] : "—", "")
     + drow("공부 시간", minsOn(ds) ? hm(minsOn(ds)) : "—", "")
     + '</div>';
  h += '<div class="note" id="dnote">🐙 '+ esc(dayComment(pts, tgt, hrs, src.score, ds)) +'</div>';
  h += '</div>';
  h += '<div class="card"><h2>수면 추이<em>최근 14일</em></h2>'
     + sleepChart(d, 14) + '</div>';

  h += '<button class="jump" data-act="insights">내 패턴 분석</button>';
  return h;
}
function drow(k, v, cls, id){
  return '<div class="drow'+(cls?' '+cls:'')+'"><div class="k">'+ k +'</div>'
       + '<div class="v"'+(id?' id="'+id+'"':'')+'>'+ v +'</div></div>';
}
function sleepText(c, hrs){
  if (hrs === null) return "—";
  return hrs.toFixed(1) + '시간'
       + (c.sleep && c.wake ? ' <s>'+ c.sleep +' → '+ c.wake +'</s>' : '');
}
function sleepBigText(hrs){
  return hrs === null
    ? '<span class="none">두 시각을 넣으면 수면 시간이 계산돼</span>'
    : '<b>'+ hrs.toFixed(1) +'</b><em>시간</em>';
}

/* Update only the numbers that depend on the clocks. A full re-render here
   would rip out the input the iOS wheel is still sitting in — the wheel fires
   `change` on every tick, long before the user taps 완료. */
function patchSleep(){
  var ds = iso(cursorDay());
  var saved = condOn(ds);
  var src = (editingCond || !saved) ? cdraft : saved;
  var hrs = sleepHours(src);

  var big = document.querySelector(".sleepbig");
  if (big) big.innerHTML = sleepBigText(hrs);
  var val = el("dSleepVal");
  if (val) val.innerHTML = sleepText(src, hrs);
  var note = el("dnote");
  if (note) note.textContent = "🐙 " + dayComment(ptsOn(ds), targetFor(ds), hrs, src.score, ds);

  var filled = !!(cdraft.sleep || cdraft.wake || cdraft.score);
  var sub = document.querySelector('[data-act="submitcond"]');
  if (sub) sub.disabled = !filled;
  var hint = document.querySelector(".hint");
  if (hint) hint.style.display = filled ? "none" : "";
}

function dayComment(pts, tgt, hrs, score, ds){
  var future = ds > iso(today());
  if (future) return "아직 오지 않은 날이야. 미리 퀘스트만 얹어둬도 돼.";
  if (!pts && hrs === null && !score) return "아직 아무 기록도 없어. 잠부터 적어도 되고, 퀘스트부터 해도 돼.";
  var s = "";
  if (pts >= tgt) s = "오늘 목표 찍었어. 남은 시간은 온전히 네 거야.";
  else if (pts > 0) s = pts + "pt 쌓였어.";
  else s = "오늘은 기록만 남겼네. 그것도 남긴 거야.";
  /* Never turn sleep into an expectation — "you rested well" quietly becomes
     "so you should have done more". Sleep gets stated, never cashed in. */
  if (hrs !== null){
    if (hrs < 6) s += " 잠이 " + hrs.toFixed(1) + "시간이었네. 오늘 기대치는 낮춰도 괜찮아.";
    else s += " " + hrs.toFixed(1) + "시간 잤어도 피로는 쌓여 있을 수 있어. 무리하지 마.";
  }
  return s;
}

/* ── 내 패턴 (전체 기록 분석) ──
   Every section here is gated on having enough days. An "optimal sleep" number
   derived from four nights is a lie with a decimal point on it, so when the
   data isn't there we say what's missing instead of inventing a finding. */
var BANDS = [
  {lo:0, hi:6,  label:"6시간 미만"},
  {lo:6, hi:7,  label:"6 – 7시간"},
  {lo:7, hi:8,  label:"7 – 8시간"},
  {lo:8, hi:99, label:"8시간 이상"}
];
function bandOf(h){
  for (var i=0;i<BANDS.length;i++) if (h >= BANDS[i].lo && h < BANDS[i].hi) return i;
  return BANDS.length - 1;
}
function condDays(){
  return Object.keys(S.cond).sort().map(function(ds){
    var c = S.cond[ds];
    return { ds: ds, hrs: sleepHours(c), score: c.score || null, pts: ptsOn(ds) };
  });
}
function bar(frac, cls){
  var w = Math.max(0, Math.min(100, frac*100));
  return '<div class="mbar"><i class="'+(cls||"")+'" style="width:'+w.toFixed(0)+'%"></i></div>';
}
function needLine(have, need, what){
  return '<div class="need"><b>'+ have +'일</b> / 최소 '+ need +'일 — '+ what +'</div>';
}
/* Show the finding, but never let a thin sample pass as fact. */
function trust(n, strong, what){
  if (n >= strong) return "";
  return '<div class="caution">데이터가 적어 믿을 만한 수준은 아니에요. 참고만 하세요.'
       + '<s>'+ what +' '+ n +'일 · '+ strong +'일쯤부터 안정적이야</s></div>';
}

/* Say what kind of person the numbers suggest, not what the numbers are.
   Each analysis has its own direction of "risk", so they're handled separately
   rather than through one shared delta — for sleep, the higher group is the
   good one; for load and streaks, the higher group is the one that costs. */
function verdict(type, a, b){
  var FLAT = 0.3;
  var gap, strong, out = {};

  if (type === "load"){
    gap = b - a;                       /* a=몰아서 한 뒤, b=여유로웠던 뒤 */
    strong = gap >= 0.8;
    if (gap > FLAT){
      out.cls = "warn";
      out.t = "너는 <b>몰아서 하면 반동이 오는 타입</b>이야. "
            + "며칠 달리고 나면 그 대가가 컨디션으로 돌아와" + (strong ? ", 그것도 꽤 뚜렷하게" : "") + ". "
            + "큰 거 하나 끝낸 다음 날은 처음부터 가볍게 잡아두는 게 너한테 맞아 — "
            + "그게 게으른 게 아니라 네 몸이 실제로 그렇게 생긴 거야.";
    } else if (gap < -FLAT){
      out.cls = "ok";
      out.t = "너는 <b>달릴수록 붙는 타입</b>이야. 몰아서 한 뒤가 오히려 컨디션이 좋게 나와. "
            + "리듬이 한번 잡히면 그게 힘이 되는 사람인 거지. "
            + "다만 이건 아직 한계 전 구간이라 그럴 수도 있으니, 기록이 더 쌓이면 다시 보자.";
    } else {
      out.cls = "";
      out.t = "몰아서 하든 여유롭든 컨디션이 비슷해. "
            + "적어도 지금 기록에선 <b>일의 양이 네 컨디션을 좌우하지 않아</b>. "
            + "컨디션이 흔들린다면 원인은 다른 데 있을 거야 — 잠이라든지.";
    }
  }

  else if (type === "sleep"){
    gap = a - b;                       /* a=잘 자고 온 날, b=덜 자고 온 날 */
    strong = gap >= 0.8;
    if (gap > FLAT){
      out.cls = "warn";
      out.t = "너는 <b>잠이 컨디션을 좌우하는 타입</b>이야" + (strong ? ", 그것도 아주 확실하게" : "") + ". "
            + "며칠 잘 자두면 그게 그대로 몸 상태로 나와. "
            + "바쁠 때 제일 먼저 깎게 되는 게 잠인데, 너한테는 그게 제일 비싼 선택이야.";
    } else if (gap < -FLAT){
      out.cls = "";
      out.t = "덜 잔 뒤가 오히려 컨디션이 좋게 나왔어. 흔한 결과가 아니라 "
            + "<b>아직 믿기엔 이른 숫자</b>야 — 바쁘고 신났던 시기에 잠도 줄고 컨디션도 좋게 느껴진, "
            + "그런 며칠이 섞였을 수 있어. 기록이 더 쌓이면 뒤집힐 가능성이 커.";
    } else {
      out.cls = "";
      out.t = "잘 잔 뒤나 덜 잔 뒤나 컨디션이 비슷해. "
            + "지금 기록에선 <b>수면 시간이 컨디션을 가르는 요인은 아니야</b>. "
            + "다만 수면 기록이 얇으면 차이가 안 보일 수도 있어.";
    }
  }

  else {                               /* streak — a=안 쉬고 온 날, b=쉬어가며 온 날 */
    gap = b - a;
    strong = gap >= 0.8;
    if (gap > FLAT){
      out.cls = "warn";
      out.t = "너는 <b>쉬는 날이 실제로 필요한 타입</b>이야. "
            + "안 쉬고 이어가면 컨디션이 눈에 띄게 내려가" + (strong ? ", 차이가 작지 않아" : "") + ". "
            + "일주일에 하루쯤 비워두는 게 손해처럼 보이지만, 네 기록상으로는 그게 결국 더 많이 하게 되는 길이야.";
    } else if (gap < -FLAT){
      out.cls = "ok";
      out.t = "쉬지 않고 이어갈 때 컨디션이 오히려 좋아. "
            + "너는 <b>흐름이 끊기는 쪽을 더 힘들어하는 타입</b>인 것 같아. "
            + "다만 원래 컨디션이 안 좋아서 쉰 날이 많았다면 그 때문에 이렇게 보일 수도 있어.";
    } else {
      out.cls = "";
      out.t = "연속으로 하든 중간에 쉬든 컨디션이 비슷해. "
            + "<b>연속 여부는 너한테 큰 변수가 아닌</b> 것 같아. 쉬고 싶을 때 쉬어도 된다는 뜻이기도 하고.";
    }
  }

  out.sub = a.toFixed(1) + " vs " + b.toFixed(1)
          + " · 차이 " + Math.abs(a-b).toFixed(1) + "점";
  return out;
}

function viewInsights(){
  var days = condDays();
  var wSleepCond = days.filter(function(d){ return d.hrs !== null && d.score; });
  var wCond      = days.filter(function(d){ return d.score; });
  var wSleep     = days.filter(function(d){ return d.hrs !== null; });

  var h = '<div class="card">';
  h += '<div class="rep-h"><div class="t">내 패턴</div>'
     + '<div class="d">기록 '+ days.length +'일</div></div>';
  h += '<div class="note">🐙 여기 있는 건 전부 네 기록에서 나온 거야. '
     + '일반적인 권장치가 아니라 <b>너한테</b> 실제로 어땠는지고, '
     + '그래서 기록이 얇으면 아예 말을 안 해.</div></div>';

  /* 1 — 수면 구간별 컨디션 & 성취 */
  h += '<div class="card"><h2>수면 시간에 따라</h2>';
  if (!wSleep.length){
    h += needLine(0, 1, "수면을 하루라도 기록하면 여기부터 채워져");
  } else {
    h += trust(wSleep.length, 10, "수면 기록");
    var rows = BANDS.map(function(b,i){
      var inB = wSleep.filter(function(d){ return bandOf(d.hrs) === i; });
      var sc  = mean(inB.map(function(d){ return d.score; }).filter(Boolean));
      var pt  = mean(inB.map(function(d){ return d.pts; }));
      return { b:b, n:inB.length, sc:sc, pt:pt };
    }).filter(function(r){ return r.n > 0; });

    h += '<div class="btable">';
    rows.forEach(function(r){
      h += '<div class="brow"><div class="bl">'+ r.b.label +'<s>'+ r.n +'일</s></div>'
         + '<div class="bv">'
         +   '<div class="bcell"><span>컨디션</span>'
         +     (r.sc === null ? '<u>—</u>' : '<u>'+ r.sc.toFixed(1) +'</u>' + bar(r.sc/5, "good")) +'</div>'
         +   '<div class="bcell"><span>성취</span><u>'+ r.pt.toFixed(1) +'pt</u>'
         +     bar(r.pt / Math.max(1, S.dailyTarget), "acc") +'</div>'
         + '</div></div>';
    });
    h += '</div>';

    /* 2 — best band, only when a band is actually populated */
    var solid = rows.filter(function(r){ return r.n >= 2 && r.sc !== null; });
    if (solid.length >= 2){
      var best = solid.slice().sort(function(a,b){ return b.sc - a.sc; })[0];
      h += '<div class="finding"><div class="fk">네 기록상 가장 좋았던 구간</div>'
         + '<div class="fv">'+ best.b.label +'</div>'
         + '<div class="fs">컨디션 평균 '+ best.sc.toFixed(1) +' / 5 · 성취 평균 '
         + best.pt.toFixed(1) +'pt · '+ best.n +'일 기준</div></div>';
    } else {
      h += '<div class="need">아직 수면 시간이 한 구간에만 몰려 있어. '
         + '서로 다른 길이로 자 본 날이 생기면 비교할 수 있어.</div>';
    }
  }
  h += '</div>';

  /* 3 — 컨디션별 성취 */
  h += '<div class="card"><h2>컨디션에 따라</h2>';
  if (!wCond.length){
    h += needLine(0, 1, "컨디션을 하루라도 기록하면 여기부터 채워져");
  } else {
    h += trust(wCond.length, 10, "컨디션 기록");
    h += '<div class="btable">';
    [5,4,3,2,1].forEach(function(k){
      var inK = wCond.filter(function(d){ return d.score === k; });
      if (!inK.length) return;
      var pt = mean(inK.map(function(d){ return d.pts; }));
      h += '<div class="brow"><div class="bl">'+ CLABEL[k] +'<s>'+ inK.length +'일</s></div>'
         + '<div class="bv"><div class="bcell wide"><u>'+ pt.toFixed(1) +'pt</u>'
         + bar(pt / Math.max(1, S.dailyTarget), "acc") +'</div></div></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* 3.5 — 티어가 실제 시간과 맞는지 */
  var tt = tierTimes();
  var nT = tt[1].length + tt[2].length + tt[3].length;
  h += '<div class="card"><h2>티어별 실제 걸린 시간</h2>';
  h += '<div class="secintro">네가 붙인 <b>Easy / Medium / Hard</b>가 실제 소요 시간과 맞는지 봐. '
     + '감으로 매긴 난이도를 실측으로 검증하는 거야.</div>';
  if (!nT){
    h += '<div class="need">아직 시간 기록이 없어. 일간에서 퀘스트를 체크하면 <b>+시간</b> 칩이 생겨.</div>';
  } else {
    h += trust(nT, 15, "시간 기록");
    var avg = {}, maxAvg = 1;
    [1,2,3].forEach(function(k){
      avg[k] = tt[k].length ? mean(tt[k]) : null;
      if (avg[k] && avg[k] > maxAvg) maxAvg = avg[k];
    });
    h += '<div class="btable">';
    [1,2,3].forEach(function(k){
      if (!tt[k].length) return;
      h += '<div class="brow"><div class="bl">'+ TNAME[k] +' <em>'+ PTS[k] +'pt</em><s>'+ tt[k].length +'건</s></div>'
         + '<div class="bv"><div class="bcell wide"><u>'+ hm(Math.round(avg[k])) +'</u>'
         + bar(avg[k]/maxAvg, "acc") +'</div></div></div>';
    });
    h += '</div>';

    /* does the point ladder match the time ladder? */
    var have = [1,2,3].filter(function(k){ return tt[k].length >= 2; });
    if (have.length >= 2){
      var lo = have[0], hi = have[have.length-1];
      var tRatio = avg[hi] / avg[lo];
      var pRatio = PTS[hi] / PTS[lo];
      var msg, cls = "";
      if (tRatio > pRatio * 1.6){
        cls = "warn";
        msg = TNAME[hi] +'가 '+ TNAME[lo] +'보다 시간은 <b>'+ tRatio.toFixed(1) +'배</b> 걸리는데, '
            + '점수는 '+ pRatio.toFixed(1) +'배뿐이야. '
            + TNAME[hi] +'짜리가 점수에 비해 훨씬 비싸게 먹히고 있어 — '
            + '쪼개서 여러 개로 만들거나, 애초에 티어를 다시 매기는 걸 고민해봐.';
      } else if (tRatio < pRatio / 1.6){
        msg = TNAME[hi] +'가 생각보다 안 걸려. 시간은 '+ tRatio.toFixed(1) +'배인데 점수는 '
            + pRatio.toFixed(1) +'배야. '
            + '지금 '+ TNAME[hi] +'로 분류한 것들이 사실 그렇게 무겁지 않은 걸 수도 있어.';
      } else {
        cls = "ok";
        msg = '시간 비율('+ tRatio.toFixed(1) +'배)이랑 점수 비율('+ pRatio.toFixed(1) +'배)이 '
            + '대체로 맞아떨어져. <b>티어를 잘 매기고 있어.</b>';
      }
      h += '<div class="cnote'+(cls?' '+cls:'')+'">'+ msg +'</div>';
    }
  }
  h += '</div>';

  /* 4 — 무리한 다음에 오는 것 */
  h += '<div class="card"><h2>누적 피로</h2>';
  h += '<div class="secintro">지나간 며칠이 <b>그날의 컨디션</b>에 어떻게 남는지 봐. '
     + '숫자는 전부 컨디션 평균이고 (5점 만점), 두 무리를 가르는 기준선은 '
     + '<b>네 기록의 가운데 값</b>이야 — 남들 기준이 아니라 네 평소에서 위냐 아래냐.</div>';
  if (wCond.length < 4){
    h += needLine(wCond.length, 4, "직전 며칠과 견주려면 최소 4일은 있어야 계산이 돼");
  } else {
    h += trust(wCond.length, 12, "컨디션 기록");
    var out = [];

    /* 직전 3일 부하 */
    var loaded = wCond.map(function(d){
      var dt = parseISO(d.ds), s = 0;
      for (var k=1;k<=3;k++) s += ptsOn(iso(addDays(dt,-k)));
      return { score:d.score, load:s };
    });
    var medLoad = median(loaded.map(function(x){ return x.load; }));
    var hiL = loaded.filter(function(x){ return x.load >  medLoad; });
    var loL = loaded.filter(function(x){ return x.load <= medLoad; });
    if (hiL.length >= 2 && loL.length >= 2){
      out.push({
        type: "load",
        q: "며칠 몰아서 하면, 그 다음에 지칠까?",
        d: "컨디션을 적은 날마다 <b>그 앞 3일에 얼마나 했는지</b>를 세어서, "
         + "몰아서 한 뒤에 온 날들과 여유롭게 보낸 뒤에 온 날들의 컨디션을 비교했어.",
        a: mean(hiL.map(function(x){ return x.score; })),
        b: mean(loL.map(function(x){ return x.score; })),
        la: "몰아서 한 뒤<i>앞 3일 "+ medLoad.toFixed(0) +"pt 넘김</i>",
        lb: "여유로웠던 뒤<i>앞 3일 "+ medLoad.toFixed(0) +"pt 이하</i>"
      });
    }

    /* 직전 3일 수면 */
    var slept = wCond.map(function(d){
      var dt = parseISO(d.ds), arr = [];
      for (var k=1;k<=3;k++){
        var cc = condOn(iso(addDays(dt,-k)));
        var hh = sleepHours(cc);
        if (hh !== null) arr.push(hh);
      }
      return { score:d.score, avg: arr.length ? mean(arr) : null };
    }).filter(function(x){ return x.avg !== null; });
    if (slept.length >= 4){
      var medS = median(slept.map(function(x){ return x.avg; }));
      var hiS = slept.filter(function(x){ return x.avg >= medS; });
      var loS = slept.filter(function(x){ return x.avg <  medS; });
      if (hiS.length >= 2 && loS.length >= 2){
        out.push({
          type: "sleep",
          q: "잠이 며칠 모자라면, 컨디션이 무너질까?",
          d: "컨디션을 적은 날마다 <b>그 앞 3일을 평균 몇 시간 잤는지</b>를 보고, "
           + "잘 자고 온 날들과 덜 자고 온 날들의 컨디션을 비교했어.",
          a: mean(hiS.map(function(x){ return x.score; })),
          b: mean(loS.map(function(x){ return x.score; })),
          la: "잘 자고 온 날<i>앞 3일 평균 "+ medS.toFixed(1) +"시간 이상</i>",
          lb: "덜 자고 온 날<i>앞 3일 평균 "+ medS.toFixed(1) +"시간 미만</i>"
        });
      }
    }

    /* 연속으로 움직인 날 */
    var streaked = wCond.map(function(d){
      var dt = parseISO(d.ds), run = 0;
      for (var k=1;k<=7;k++){
        if (ptsOn(iso(addDays(dt,-k))) > 0) run++; else break;
      }
      return { score:d.score, run:run };
    });
    var hiR = streaked.filter(function(x){ return x.run >= 3; });
    var loR = streaked.filter(function(x){ return x.run <  3; });
    if (hiR.length >= 2 && loR.length >= 2){
      out.push({
        type: "streak",
        q: "쉬는 날 없이 이어가면, 어떻게 될까?",
        d: "컨디션을 적은 날마다 <b>그 앞에 며칠을 안 쉬고 달려왔는지</b>를 세서, "
         + "3일 넘게 이어온 날들과 중간에 쉬어간 날들의 컨디션을 비교했어.",
        a: mean(hiR.map(function(x){ return x.score; })),
        b: mean(loR.map(function(x){ return x.score; })),
        la: "안 쉬고 온 날<i>앞에 3일 이상 연속</i>",
        lb: "쉬어가며 온 날<i>중간에 쉰 날 있음</i>"
      });
    }

    if (!out.length){
      h += '<div class="need">아직 갈림이 안 보여. 며칠 더 쌓이면 나올 거야.</div>';
    } else {
      out.forEach(function(o){
        var v = verdict(o.type, o.a, o.b);
        h += '<div class="cmp2"><div class="ck">'+ o.q +'</div>'
           + '<div class="cd">'+ o.d +'</div>'
           + '<div class="cmpline"><span>'+ o.la +'</span><b>'+ o.a.toFixed(1) +'<s>/5</s></b></div>'
           + '<div class="cmpline"><span>'+ o.lb +'</span><b>'+ o.b.toFixed(1) +'<s>/5</s></b></div>'
           + '<div class="cnote'+ (v.cls ? ' '+v.cls : '') +'">'+ v.t
           +   '<em>'+ v.sub +'</em></div></div>';
      });
    }
  }
  h += '</div>';

  h += '<div class="foot"><button data-act="closeinsights">돌아가기</button></div>';
  return h;
}

/* ── 어제와 비교 ──
   Four cases, and the one that matters most is the last: on a day that missed
   the target AND came in under yesterday, the comparison is hidden outright.
   Someone having a hard day does not need yesterday's number on screen. */
function viewCompare(d){
  var ds = iso(d), ps = iso(addDays(d,-1));
  var T = ptsOn(ds), Y = ptsOn(ps), G = targetFor(ds);
  var future = ds > iso(today());
  var hit = T >= G, up = T > Y;
  var pct = (Y > 0) ? Math.round((T - Y) / Y * 100) : null;
  var show = !future && !(!hit && !up);        /* case D hides the comparison */

  var c = condOn(ds) || {};
  var hrs = sleepHours(c);
  var rate = G ? Math.round(T / G * 100) : 0;

  var h = '<div class="card">';
  h += '<div class="rep-h"><div class="t">일간 보고서</div>'
     + '<div class="d">'+ md(d) +' ('+ DOW[d.getDay()] +')</div></div>';

  /* today first — finishing the day is the thing that matters */
  var dayMins = minsOn(ds);
  h += '<div class="stats">'
     + '<div class="stat"><div class="k">수면</div><div class="v">'
     +   (hrs === null ? '—' : hrs.toFixed(1) + '<small>시간</small>') +'</div></div>'
     + '<div class="stat"><div class="k">컨디션</div><div class="v sm">'
     +   (c.score ? CLABEL[c.score] : '—') +'</div></div>'
     + '<div class="stat"><div class="k">공부 시간</div><div class="v sm">'
     +   (dayMins ? hm(dayMins) : '—') +'</div></div>'
     + '<div class="stat"><div class="k">달성</div><div class="v'+(hit?' hit':'')+'">'
     +   rate +'<small>%</small></div></div>'
     + '</div>';

  h += '<div class="rail"><i style="width:'+ Math.min(100, rate) +'%"></i></div>';
  h += '<div class="goalline">'+ T +' / '+ G +' pt</div>';

  if (hit && !future){
    h += '<div class="done-banner"><b>오늘 할 일 다 했다.</b>'
       + '<span>'+ (T > G ? '+'+(T-G)+'pt는 주간으로.' : '') +'</span></div>';
  }

  h += '<h2 class="mt">어제와 비교</h2>';

  if (show){
    h += '<div class="vs">'
       + '<div class="vscol now"><div class="lab">오늘</div><div class="num">'+ T +'</div>'
       +   '<div class="unit">pt</div></div>'
       + '<div class="vscol"><div class="lab">어제</div><div class="num">'+ Y +'</div>'
       +   '<div class="unit">pt</div></div>'
       + '</div>';
    var chip;
    if (Y === 0 && T > 0)      chip = '<div class="delta up">▲ +'+ T +' pt</div>';
    else if (pct === null)     chip = '';
    else if (pct > 0)          chip = '<div class="delta up">▲ +'+ pct +'%</div>';
    else if (pct === 0)        chip = '<div class="delta flat">= 어제와 같음</div>';
    else                       chip = '<div class="delta down">▽ '+ Math.abs(pct) +'% 적음</div>';
    h += chip;
  } else if (!future){
    h += '<div class="vs solo">'
       + '<div class="vscol now"><div class="lab">오늘</div><div class="num">'+ T +'</div>'
       +   '<div class="unit">pt</div></div>'
       + '</div>';
  }

  h += '<div class="note big">🐙 '+ esc(compareMsg(T, Y, G, pct, future)) +'</div>';
  h += '</div><div class="foot"><button data-act="closecompare">돌아가기</button></div>';
  return h;
}

function compareMsg(T, Y, G, pct, future){
  if (future) return "아직 오지 않은 날이야. 비교는 지나간 다음에 하자.";
  var hit = T >= G, up = T > Y;

  if (hit && up){
    if (Y === 0) return "어제는 0이었는데 오늘은 " + T + "pt, 목표까지 찍었어. "
                      + "이런 날이 있어서 다음 날이 가능해지는 거야. 오늘은 그냥 기뻐해도 돼.";
    return "어제보다 " + pct + "% 더 했고, 목표도 채웠어. "
         + "오늘 제대로 굴러갔네 — 이런 날은 이유 따지지 말고 그냥 좋아하자. 고생했어.";
  }
  if (hit && !up){
    if (T === Y) return "어제랑 똑같이 해냈고, 목표도 채웠어. "
                      + "같은 자리를 이틀 연속 지키는 건 생각보다 어려운 일이야.";
    return "어제보단 적어. 근데 오늘 목표는 다 채웠잖아 — "
         + "어제가 유난히 많았던 거지, 오늘이 모자란 게 아니야. 채운 날은 채운 날이야.";
  }
  if (!hit && up){
    if (Y === 0) return "목표까진 못 갔어. 그래도 어제 0에서 오늘 " + T + "pt로 올라왔잖아. "
                      + "멈춰 있다가 다시 움직이기 시작하는 구간이 제일 힘들어. 너 지금 그걸 하고 있어.";
    return "목표까진 못 갔어. 그래도 어제보다 " + pct + "% 더 움직였어. "
         + "이건 올라오는 중이라는 뜻이야 — 슬럼프는 이렇게 빠져나오는 거고, 그거 훌륭한 거야.";
  }
  if (T === 0) return "오늘은 힘들었을 거야. 숫자는 접어두자. "
                    + "여기 들어와서 확인한 것만으로 오늘 몫은 한 거고, 내일은 내일 정하면 돼.";
  return "오늘은 힘든 날이었을 거야. 어제랑 비교는 안 할게 — 지금 그게 무슨 소용이야. "
       + T + "pt 했고, 그건 0이 아니야. 오늘은 그거면 충분해.";
}

/* ── 일간 ── */
function viewDay(d){
  var ds = iso(d), tgt = targetFor(ds), got = ptsOn(ds);
  var list = tasksFor(d);

  /* the track: completed tasks occupy blocks proportional to their points */
  var doneList = list.filter(function(t){ return doneOn(ds,t.id); });
  var used = 0, blocks = "", overflow = 0;
  doneList.forEach(function(t){
    var p = PTS[t.tier];
    if (used + p <= tgt){
      blocks += '<div class="blk t'+t.tier+'" style="grid-column:span '+p+'">'+p+'</div>';
      used += p;
    } else if (used < tgt){
      var fit = tgt - used;
      blocks += '<div class="blk t'+t.tier+'" style="grid-column:span '+fit+'">'+fit+'</div>';
      overflow += p - fit; used = tgt;
    } else { overflow += p; }
  });
  for (var i=used;i<tgt;i++) blocks += '<div class="cell"></div>';

  var hit = got >= tgt;
  var left = tgt - got;

  var isToday = ds === iso(today());
  var h = '<div class="card">';
  h += dayNav(d);
  h += '<div class="readout"><div class="big">'+ got +'<em>/'+ tgt +' pt</em></div>'
     +  '<div class="side">완료 <b>'+ doneList.length +'</b> / '+ list.length +'개<br>'
     +  (hit ? '초과 <b>+'+ (got-tgt) +'</b> pt' : '남은 <b>'+ left +'</b> pt') +'</div></div>';
  h += '<div class="track" style="grid-template-columns:repeat('+tgt+',1fr)">'+ blocks +'</div>';
  h += '<div class="track-legend"><span>0</span><span>'+ tgt +' pt</span></div>';
  h += targetNote(ds);

  var todayMins = minsOn(ds);
  h += '<div class="studyrow"><span>공부 시간</span>'
     + '<b'+(todayMins?'':' class="zero"')+'>'+ (todayMins ? hm(todayMins) : '아직 없음') +'</b></div>';
  if (todayMins) h += '<div class="studyhint">시간엔 목표가 없어. 그냥 얼마나 썼는지만 남겨두는 거야.</div>';

  if (overflow > 0){
    h += '<div class="bonus"><span>보너스 +'+ overflow +'</span>'
       + '<div class="bar"><i style="width:'+ Math.min(100, overflow/tgt*100) +'%"></i></div>'
       + '<span>주간으로</span></div>';
  }
  if (hit){
    h += '<div class="done-banner"><b>오늘 할 일 다 했다.</b>'
       + '<span>'+ (got>tgt ? '넘긴 만큼은 주간에 쌓여.' : '여기서 멈춰도 돼.') +'</span></div>';
  }
  h += '</div>';

  h += '<div class="card"><h2>오늘의 퀘스트</h2>';
  if (!list.length){
    h += '<div class="empty">오늘 잡힌 게 없어.<br><b>전체</b> 탭에서 할 일을 적어두면 여기 자동으로 떠.</div>';
  } else {
    h += '<div class="list">' + timeline(list, ds, isToday) + '</div>';
  }

  /* quick-add — lives only on this date */
  h += '<div class="add">'
     + '<input type="text" id="nt" placeholder="'+ (isToday ? '오늘 할 일 추가' : md(d)+' 할 일 추가') +'" autocomplete="off">'
     + '<div class="seg" id="ntier">'
     +   '<button data-t="1" aria-pressed="false">Easy 1</button>'
     +   '<button data-t="2" aria-pressed="true">Med 2</button>'
     +   '<button data-t="3" aria-pressed="false">Hard 3</button></div>'
     + '<button class="addbtn" data-act="add">추가</button>'
     + '</div>';

  h += '</div>';
  h += '<button class="jump" data-act="compare">오늘 하루 보고서</button>';
  return h;
}
/* The quest list IS the timeline: sorted by t.at, 지금 spliced in where it falls,
   and the untimed ones parked underneath. A row sitting above the 지금 line is
   not marked, nagged, or coloured — a past time is just a past time. */
function timeline(list, ds, isToday){
  var timed = list.filter(function(t){ return !!t.at; })
                  .sort(function(a,b){ return atMin(a) - atMin(b); });
  var loose = list.filter(function(t){ return !t.at; });

  var h = "", now = (isToday && timed.length) ? nowMin() : null, drawn = false;
  timed.forEach(function(t){
    if (now !== null && !drawn && atMin(t) > now){ h += nowLine(now); drawn = true; }
    h += taskRow(t, ds);
  });
  if (now !== null && !drawn) h += nowLine(now);         /* the whole day is behind us */
  if (timed.length && loose.length) h += '<div class="secdiv">시간 미정</div>';
  loose.forEach(function(t){ h += taskRow(t, ds); });
  return h;
}
function nowLine(m){
  return '<div class="nowline"><span>지금 '+ clock(m) +'</span></div>';
}
function clock(m){
  var hh = Math.floor(m/60), mm = m % 60;
  return (hh<10?"0":"") + hh + ":" + (mm<10?"0":"") + mm;
}
function atChip(t){
  return '<button class="atchip'+(t.at?' set':'')+'" data-act="atopen" data-id="'+t.id+'"'
       + ' aria-label="'+ (t.at ? t.at+'에 예정, 시각 고치기' : '시각 정하기') +'">'
       + (t.at ? t.at : '＋시각') +'</button>';
}
function atPicker(t){
  return '<div class="tpick"><div class="tpl">언제까지?</div><div class="tprow">'
       + ["09:00","12:00","14:00","18:00","21:00"].map(function(v){
           return '<button data-act="atset" data-v="'+v+'"'
                + (t.at===v?' aria-pressed="true"':'') +'>'+ v +'</button>';
         }).join("")
       + '</div><div class="tprow custom">'
       + '<input type="time" id="atcustom" value="'+ (t.at || "") +'">'
       + '<button data-act="atsetc">확인</button>'
       + (t.at ? '<button class="clr" data-act="atset" data-v="">지우기</button>' : '')
       + '</div><div class="tphint">시각을 고치면 순서도 같이 옮겨가.'
       + (t.repeat==="weekly" ? ' 이건 매주 반복이라 <b>돌아오는 날 전부</b>에 적용돼.' : '')
       + '</div></div>';
}

function taskRow(t, ds){
  if (t.id === editingId) return editRow(t);
  var h = "";
  var on = doneOn(ds,t.id);
  var mins = minsFor(ds, t.id);
  h += '<div class="row'+(on?' on':'')+(flashId===t.id?' flash':'')+'" role="button" tabindex="0" data-act="toggle" data-id="'+t.id+'" data-d="'+ds+'">'
     + atChip(t)
     + chk() + '<div class="ttl">'+ esc(t.title) +'</div>'
     + (t.repeat==="weekly" ? '<div class="dayspec">'+ t.days.map(function(x){return DOW[x];}).join("") +'</div>' : '')
     + '<div class="tier t'+t.tier+'">'+ TNAME[t.tier] +' '+ PTS[t.tier] +'</div>'
     + (on ? '<button class="tchip'+(mins?' set':'')+'" data-act="timeopen" data-id="'+t.id+'" data-d="'+ds+'">'
       + (mins ? hm(mins) : '+시간') +'</button>' : '')
     + editBtn(t.id)
     + (t.repeat !== "weekly" ? delBtn(t.id) : '') +'</div>';

  if (timingId === t.id){
    h += '<div class="tpick"><div class="tpl">얼마나 걸렸어?</div><div class="tprow">'
       + [15,30,45,60,90,120,180].map(function(v){
           return '<button data-act="tset" data-v="'+v+'" data-d="'+ds+'"'
                + (mins===v?' aria-pressed="true"':'') +'>'+ (v<60? v+'분' : hm(v)) +'</button>';
         }).join("")
       + '</div><div class="tprow custom">'
       + '<input type="number" id="tcustom" min="1" max="1440" inputmode="numeric" placeholder="직접 (분)" value="">'
       + '<button data-act="tsetc" data-d="'+ds+'">확인</button>'
       + (mins ? '<button class="clr" data-act="tset" data-v="0" data-d="'+ds+'">지우기</button>' : '')
       + '</div></div>';
  }
  if (atId === t.id) h += atPicker(t);
  return h;
}

function chk(){ return '<div class="box"><svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg></div>'; }

function editBtn(id){
  return '<button class="edit" data-act="edit" data-id="'+id+'" title="수정" aria-label="수정">'
       + '<svg viewBox="0 0 14 14"><path d="M9.6 1.9l2.5 2.5M10.4 1.1a1.2 1.2 0 011.7 1.7L4.4 10.5l-2.6.7.7-2.6z"/></svg>'
       + '</button>';
}
function delBtn(id){
  return '<button class="del" data-act="del" data-id="'+id+'" title="삭제" aria-label="삭제">×</button>';
}

/* inline editor — replaces the row it belongs to */
function editRow(t){
  var lbl = {1:"Easy 1", 2:"Med 2", 3:"Hard 3"};
  var h = '<div class="editrow">';
  h += '<input type="text" id="et" value="'+ esc(t.title) +'" autocomplete="off">';
  h += '<div class="seg" id="etier">'
     + [1,2,3].map(function(k){
         return '<button data-t="'+k+'" aria-pressed="'+(edraft.tier===k)+'">'+ lbl[k] +'</button>'; }).join("")
     + '</div>';
  if (t.repeat === "weekly"){
    h += '<div class="dowpick" id="edays">'
       + DOW.map(function(n,i){
           return '<button data-d="'+i+'" aria-pressed="'+(edraft.days.indexOf(i)>=0)+'">'+ n +'</button>'; }).join("")
       + '</div>';
  }
  h += '<div class="editbtns">'
     + '<button class="ghost" data-act="canceledit">취소</button>'
     + '<button class="save" data-act="saveedit" data-id="'+ t.id +'">저장</button>'
     + '</div></div>';
  return h;
}

/* ── 주간 ── */
function viewWeek(ws){
  var tgt = S.weeklyTarget, got = weekPts(ws);
  var pct = tgt ? Math.min(100, Math.round(got/tgt*100)) : 0;
  var td = iso(today());

  var day = [], maxp = S.dailyTarget;
  for (var i=0;i<7;i++){
    var ds = iso(addDays(ws,i));
    var p = ptsOn(ds);
    if (p > maxp) maxp = p;
    day.push({ds:ds,p:p,i:i});
  }

  var isNow   = weekOffset === 0;
  var isAhead = weekOffset > 0;

  var h = '<div class="card">';
  h += '<div class="datenav">'
     + '<button data-act="prevweek" aria-label="이전 주">‹</button>'
     + '<div class="dlabel">W'+ weekNo(ws) +' <span>'+ md(ws) +'→'+ md(addDays(ws,6)) +'</span>'
     +   (isNow ? '<b>이번 주</b>' : (isAhead ? '<b class="soon">예정</b>' : '')) +'</div>'
     + '<button data-act="nextweek" aria-label="다음 주">›</button>'
     + '</div>';
  if (!isNow){
    h += '<button class="jump" data-act="jumpweek">이번 주로 돌아가기'
       + ' <em>' + (isAhead ? "+"+weekOffset : weekOffset) + '주</em></button>';
  }

  if (isAhead && got === 0){
    var plan = plannedPts(ws);
    h += '<div class="readout"><div class="big">'+ plan +'<em> pt</em></div>'
       + '<div class="side">예정된 점수<br>목표 '+ tgt +' pt</div></div>';
  } else {
    h += '<div class="readout"><div class="big">'+ pct +'<em>%</em></div>'
       + '<div class="side"><b>'+ got +'</b> / '+ tgt +' pt<br>목표 달성 <b>'
       + day.filter(function(x){return x.p >= targetFor(x.ds);}).length +'</b> / 7일</div></div>';
  }

  h += '<div class="days">';
  day.forEach(function(x){
    var cls = x.p >= targetFor(x.ds) ? "hit" : (x.p > 0 ? "some" : "");
    if (x.ds === td) cls += " today";
    var hpx = x.p ? Math.max(4, Math.round(x.p/maxp*76)) : 3;
    h += '<div class="day '+cls+'"><div class="pt">'+ (x.p||"·") +'</div>'
       + '<div class="stack" style="height:'+hpx+'px"></div></div>';
  });
  h += '</div>';
  h += '<div class="dow">'+ DOW.map(function(n,i){
         return '<span'+(iso(addDays(ws,i))===td?' class="now"':'')+'>'+n+'</span>'; }).join("") +'</div>';

  /* second chart: minutes. No target line — this one is only ever a record. */
  var mins = [], maxm = 1;
  for (var mi=0; mi<7; mi++){
    var mv = minsOn(iso(addDays(ws,mi)));
    mins.push(mv); if (mv > maxm) maxm = mv;
  }
  var totMins = mins.reduce(function(a,b){ return a+b; }, 0);
  h += '<h2 class="mt">공부 시간<em>'+ hm(totMins) +'</em></h2>';
  if (!totMins){
    h += '<div class="need">이번 주엔 아직 시간 기록이 없어. 일간에서 퀘스트를 체크하면 <b>+시간</b> 칩이 생겨.</div>';
  } else {
    h += '<div class="days mins">';
    mins.forEach(function(v,i){
      var ds2 = iso(addDays(ws,i));
      var cls = v > 0 ? "some" : "";
      if (ds2 === td) cls += " today";
      var hpx = v ? Math.max(4, Math.round(v/maxm*76)) : 3;
      h += '<div class="day '+cls+'"><div class="pt">'+ (v ? (v>=60 ? (v/60).toFixed(1)+'h' : v+'m') : '·') +'</div>'
         + '<div class="stack" style="height:'+hpx+'px"></div></div>';
    });
    h += '</div>';
    h += '<div class="dow">'+ DOW.map(function(n,i){
           return '<span'+(iso(addDays(ws,i))===td?' class="now"':'')+'>'+n+'</span>'; }).join("") +'</div>';
  }

  /* The reward ladder belongs to the week you are actually living in.
     Showing it against a past week's points would be a lie, so other weeks
     get their saved report instead. */
  if (isNow){
    h += '<div class="rail"><i style="width:'+pct+'%"></i>'
       + S.rewards.map(function(r){
           return '<u class="'+(pct>=r.pct?"on":"")+'" style="left:calc('+r.pct+'% - .75px)"></u>'; }).join("")
       + '</div>';

    h += '<h2 class="mt">보상</h2><div class="ladder">';
    var nextIdx = -1;
    S.rewards.forEach(function(r,i){ if (nextIdx<0 && pct < r.pct) nextIdx = i; });
    S.rewards.forEach(function(r,i){
      var open = pct >= r.pct;
      var cls = r.claimed ? "got" : (open ? "" : (i===nextIdx ? "next" : "locked"));
      var need = Math.max(0, Math.ceil(tgt*r.pct/100) - got);
      h += '<div class="rw '+cls+'"><div class="pct">'+ r.pct +'%</div>'
         + '<input type="text" data-act="reward" data-i="'+i+'" value="'+ esc(r.text) +'" placeholder="보상 적기">';
      if (r.claimed)      h += '<div class="st">받음 ✓</div>';
      else if (open)      h += '<button data-act="claim" data-i="'+i+'">받기</button>';
      else if (i===nextIdx) h += '<div class="st">'+ need +'pt 남음</div>';
      else                h += '<div class="st">'+ need +'pt</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  var saved = -1;
  S.reports.forEach(function(x,i){ if (x.key === weekKey(ws)) saved = i; });
  if (saved >= 0){
    h += '<button class="jump" data-act="openrep" data-i="'+saved+'">이 주 보고서 보기</button>';
  } else {
    h += '<button class="jump" data-act="previewrep">'
       + (isNow ? '이번 주 보고서 미리보기' : '이 주 보고서 만들어 보기') + '</button>';
  }

  /* archive + tools live on the current week only */
  if (isNow){
    if (S.reports.length){
      h += '<div class="card"><h2>지난 보고서</h2>';
      S.reports.slice().reverse().forEach(function(r,ri){
        var realIdx = S.reports.length-1-ri;
        h += '<div class="arch" role="button" tabindex="0" data-act="openrep" data-i="'+realIdx+'">'
           + '<div class="w">W'+ r.wno +'</div><div>'+ r.range +'</div>'
           + '<div class="p">'+ r.total +' pt</div></div>';
      });
      h += '</div>';
    }
    h += '<div class="foot"><button data-act="copy">링크 복사</button>'
       + '<button data-act="settings">설정</button></div>';
  }
  return h;
}

/* ── 전체 ── */
function gachaCard(){
  var g=G(), k=curKey(), D=SET(k);
  var left=0;
  var h='<div class="card"><h2>뽑기</h2>';

  h+='<div class="seg gset">'
   + '<button data-act="setpk" aria-pressed="'+(k==="pk")+'">포켓몬</button>'
   + '<button data-act="setsr" aria-pressed="'+(k==="sr")+'">'+(PACK?esc(PACK.name||"팩"):"산리오")+'</button>'

  if (!D){
    h+='<div class="empty">이 세트는 그림이 앱에 들어있지 않아.<br>'
     + '<b>팩 파일(.json)</b>을 불러오면 여기서 뽑을 수 있어.<br>'
     + '<span style="font-size:11.5px">아래 버튼 → 파일 앱에서 <b>octopus-pack-sanrio.json</b> 선택</span></div>'
     + '<div class="gline"><button class="pull" data-act="packimp">팩 불러오기</button></div>'
     + '<input type="file" id="packfile" accept="application/json,.json" style="display:none">'
     + '</div>';
    return h;
  }

  var got=dexCountOf(k), tot=D.ids.length, pool=poolOf(D,k), empty=(pool.length===0);
  left=ticketsLeft(k);
  h+='<div class="readout greadout"><div class="big'+(left<0?' owe':'')+'">'
   +   (FREEPULL ? '∞' : left+'<em>장</em>') +'</div>'
   + '<div class="side">'+esc(D.label)+' <span class="rate">('
   +   (FREEPULL ? '베타 · 무제한' : costOf(k)+'분에 1장') +')</span>'
   + '<br><b>'+got+'</b> / '+tot+'</div></div>';
  h+='<div class="rail"><i style="width:'+(tot?Math.round(got/tot*100):0)+'%"></i></div>';

  h+='<div class="gline">'
   + '<button class="pull" data-act="pull"'+((left<1||empty)?' disabled':'')+'>'
   +   (empty?'다 모았어':'뽑기')+'</button>'
   + '<button class="dexbtn" data-act="dextoggle">'+(dexOpen?'닫기':'도감')+'</button>'
   + '</div>';

  if (left<1 && !empty && !FREEPULL)
    h+='<div class="studyhint" style="text-align:left">완료한 퀘스트에 <b>+시간</b>을 붙이면 뽑기권이 쌓여. '
     + costOf(k)+'분에 1장.</div>';

  var st=gsub(k);
  if (st.last && D.ids.indexOf(st.last.id)>=0){
    var id=st.last.id, n=st.hold[id]||0, sb=D.sub(id);
    h+='<div class="gres">'
     + '<img class="'+(D.pix?"pix":"")+'" src="'+D.im(id)+'" alt="" loading="lazy" onerror="this.style.display=\'none\'">'
     + '<div><div class="nm">'+esc(D.nm(id))
     +   (st.last.neu?'<span class="gnew">NEW</span>':'<span class="gdup">중복</span>')+'</div>'
     + '<div class="mt">'+(sb?esc(sb)+' · ':'')+'보유 '+n+'</div></div></div>';
  }

  var mg=mergeables();

}

/* ───────── 인적성 (GSAT · SKCT) ─────────
   취준용 기록판. pt·주간목표·뽑기권 어디에도 들어가지 않는다 — 문항 수가 점수가
   되면 "많이 푸는 것"이 이기는 수가 되고, 정답률을 버리게 되기 때문. 여기서
   나오는 값은 기록과 해석뿐이다. 일간의 공부 시간과도 별개로 잰다. */
var APT = {
  gsat: { nm:"GSAT", groups:[
    { g:"수리", ts:["응용수리","자료해석"] },
    { g:"추리", ts:["명제","추리퀴즈","도형추리","도식추리","단어유추","논리추론"] } ] },
  skct: { nm:"SKCT", groups:[
    { g:"유형", ts:["언어이해","자료해석","창의수리","언어추리","수열추리"] } ] }
};
/* shape + colour per 유형, so eight of them can share one chart */
var TSTYLE = {
  gsat: { "응용수리":{mk:"dot", c:"var(--t2)"},     "자료해석":{mk:"tri", c:"var(--accent)"},
          "명제":{mk:"sq",  c:"var(--good)"},        "추리퀴즈":{mk:"dia", c:"var(--cs3)"},
          "도형추리":{mk:"plus",c:"var(--cs5)"},     "도식추리":{mk:"ring",c:"var(--t3)"},
          "단어유추":{mk:"dtri",c:"var(--cs2)"},     "논리추론":{mk:"ex",  c:"var(--cs4)"} },
  skct: { "언어이해":{mk:"dot", c:"var(--t2)"},      "자료해석":{mk:"tri", c:"var(--accent)"},
          "창의수리":{mk:"sq",  c:"var(--good)"},     "언어추리":{mk:"dia", c:"var(--cs3)"},
          "수열추리":{mk:"plus",c:"var(--cs5)"} }
};
function tstyle(ex, t){ return (TSTYLE[ex] && TSTYLE[ex][t]) || {mk:"dot", c:"var(--ink-3)"}; }
/* series hidden by tapping the legend — view state, never saved */
var hidSeries = {};
function serKey(ex, name){ return ex + "|" + name; }
var TOD  = { am:"오전", pm:"오후", eve:"저녁" };
var TODK = ["am","pm","eve"];
function todNow(){ var h = new Date().getHours(); return h < 12 ? "am" : (h < 18 ? "pm" : "eve"); }
function aptTypes(ex){
  var o = [];
  APT[ex].groups.forEach(function(gr){ gr.ts.forEach(function(t){ o.push(t); }); });
  return o;
}
var adraft = { exam:"gsat", type:null, tod:null, run:null };

function aptRecs(ex, type){
  var rs = (S.aptit || []).slice();
  if (ex)   rs = rs.filter(function(r){ return r.exam === ex; });
  if (type) rs = rs.filter(function(r){ return r.type === type; });
  rs.sort(function(a,b){
    var ar = a.run||1, br = b.run||1;
    if (ar !== br) return ar - br;
    return a.ds < b.ds ? -1 : (a.ds > b.ds ? 1 : (a.id < b.id ? -1 : 1));
  });
  return rs;
}
/* 회차 is counted inside one 유형, exactly like 시험 counts inside one 영역 */
function aptNextRun(ex, type){
  if (!type) return 1;
  var top = 0;
  aptRecs(ex, type).forEach(function(r){ if ((r.run||1) > top) top = r.run||1; });
  return top + 1;
}
function aptMaxRun(ex){
  var top = 1;
  aptRecs(ex).forEach(function(r){ if ((r.run||1) > top) top = r.run||1; });
  return top;
}
function aptRenumber(ex){
  var moved = 0;
  aptTypes(ex).forEach(function(t){
    var rs = aptRecs(ex, t), runs = [];
    rs.forEach(function(r){ var v = r.run||1; if (runs.indexOf(v) < 0) runs.push(v); });
    runs.sort(function(a,b){ return a-b; });
    rs.forEach(function(r){
      var to = runs.indexOf(r.run||1) + 1;
      if ((r.run||1) !== to){ r.run = to; moved++; }
    });
  });
  return { moved:moved };
}
/* weighted by items, not by set — a 20-item set says more than a 5-item one */
function accOf(rs){
  var n = 0, k = 0;
  rs.forEach(function(r){ n += r.n; k += r.ok; });
  return n ? k / n : null;
}
/* seconds per item, counting only sets whose time was actually recorded */
function paceOf(rs){
  var n = 0, s = 0;
  rs.forEach(function(r){ if (r.sec > 0){ n += r.n; s += r.sec; } });
  return n ? s / n : null;
}
function secText(s){
  if (s === null) return "—";
  s = Math.round(s);
  return s < 60 ? s + "초" : Math.floor(s/60) + "분 " + (s%60) + "초";
}
function pctText(a){ return a === null ? "—" : Math.round(a*100) + "%"; }
function aptDays(){
  var m = {};
  (S.aptit || []).forEach(function(r){ m[r.ds] = 1; });
  return m;
}
/* thin samples are labelled, never hidden — same rule as 내 패턴 */
function atrust(n, strong, what){
  if (n >= strong) return "";
  return '<div class="caution">데이터가 적어 믿을 만한 수준은 아니에요. 참고만 하세요.'
       + '<s>'+ what +' '+ n +'건 · '+ strong +'건쯤부터 안정적이야</s></div>';
}
function aneed(txt){ return '<div class="need">'+ txt +'</div>'; }


/* ── 시험 (영역 통째로 푸는 실전) ──
   연습(10문제 세트)과 저장소부터 분리한다. 재는 것이 다르기 때문 — 연습은
   "유형별로 얼마나 맞나", 시험은 "제한시간 안에 어디까지 가나"다. 시험에서는
   시간을 묻지 않는다. 시간이 고정된 게 시험이니까, 대신 못 푼 문항이 그
   시간을 말해준다.

   회차는 영역마다 따로 센다. 수리를 세 번, 추리를 한 번 봤으면 수리 3회차와
   추리 1회차이지 전체 4회차가 아니다 — 영역별로 자기 진도가 따로 흐른다.
   그래프는 한 판에 겹쳐 그리고 영역을 모양으로 구분한다. */
var EXSEC = {
  gsat: [ {s:"수리", n:20, min:30, mk:"dot", c:"var(--t2)"},
          {s:"추리", n:30, min:30, mk:"tri", c:"var(--accent)"} ],
  skct: [ {s:"언어이해", n:20, min:15, mk:"dot",  c:"var(--t2)"},
          {s:"자료해석", n:20, min:15, mk:"tri",  c:"var(--accent)"},
          {s:"창의수리", n:20, min:15, mk:"sq",   c:"var(--good)"},
          {s:"언어추리", n:20, min:15, mk:"dia",  c:"var(--cs3)"},
          {s:"수열추리", n:20, min:15, mk:"plus", c:"var(--cs5)"} ]
};
var aptMode = "prac";                 /* prac | exam */
var exdraft = { sec:null, run:null };  /* run=null 이면 자동, 숫자면 그 회차로 넣는다 */
var exEditId = null, aEditId = null;   /* 기록 한 줄을 그 자리에서 고친다 */

function exSecOf(ex, name){
  var f = EXSEC[ex].filter(function(x){ return x.s === name; });
  return f.length ? f[0] : null;
}
function exRecs(ex, sec){
  var rs = (S.aptex || []).slice();
  if (ex)  rs = rs.filter(function(r){ return r.exam === ex; });
  if (sec) rs = rs.filter(function(r){ return r.sec === sec; });
  rs.sort(function(a,b){
    var ar = a.run||1, br = b.run||1;
    if (ar !== br) return ar - br;
    return a.ds < b.ds ? -1 : (a.ds > b.ds ? 1 : (a.id < b.id ? -1 : 1));
  });
  return rs;
}
/* the next 회차 for one section — its own count, nobody else's */
function exNextRun(ex, sec){
  if (!sec) return 1;
  var rs = exRecs(ex, sec), top = 0;
  rs.forEach(function(r){ if ((r.run||1) > top) top = r.run||1; });
  return top + 1;
}
function exMaxRun(ex){
  var top = 1;
  exRecs(ex).forEach(function(r){ if ((r.run||1) > top) top = r.run||1; });
  return top;
}
/* Deleting a 회차 leaves a hole — 수리 1·2·4. This pulls that section's numbers
   back to 1..N. Sections are renumbered independently, so fixing 수리 never
   moves 추리. */
function exRenumber(ex){
  var moved = 0;
  EXSEC[ex].forEach(function(sc){
    var rs = exRecs(ex, sc.s), runs = [];
    rs.forEach(function(r){ var v = r.run||1; if (runs.indexOf(v) < 0) runs.push(v); });
    runs.sort(function(a,b){ return a-b; });
    rs.forEach(function(r){
      var to = runs.indexOf(r.run||1) + 1;
      if ((r.run||1) !== to){ r.run = to; moved++; }
    });
  });
  return { moved:moved };
}
function exAcc(x){ var d = x.ok + x.wr; return d ? x.ok/d : null; }   /* 맞 / 푼 것 */
function exReach(x){ return x.tot ? (x.ok + x.wr)/x.tot : null; }     /* 푼 양 */

/* one marker, drawn at a point */
function mark(kind, x, y, col){
  var r = 3.4;
  if (kind === "tri")
    return '<polygon points="'+ x.toFixed(1) +','+ (y-r-.6).toFixed(1) +' '
         + (x-r-.4).toFixed(1) +','+ (y+r).toFixed(1) +' '
         + (x+r+.4).toFixed(1) +','+ (y+r).toFixed(1) +'" fill="'+col+'"/>';
  if (kind === "sq")
    return '<rect x="'+ (x-r).toFixed(1) +'" y="'+ (y-r).toFixed(1) +'" width="'+(r*2)
         + '" height="'+(r*2)+'" fill="'+col+'"/>';
  if (kind === "dia")
    return '<polygon points="'+ x.toFixed(1) +','+ (y-r-.8).toFixed(1) +' '
         + (x+r+.8).toFixed(1) +','+ y.toFixed(1) +' '
         + x.toFixed(1) +','+ (y+r+.8).toFixed(1) +' '
         + (x-r-.8).toFixed(1) +','+ y.toFixed(1) +'" fill="'+col+'"/>';
  if (kind === "dtri")
    return '<polygon points="'+ x.toFixed(1) +','+ (y+r+.6).toFixed(1) +' '
         + (x-r-.4).toFixed(1) +','+ (y-r).toFixed(1) +' '
         + (x+r+.4).toFixed(1) +','+ (y-r).toFixed(1) +'" fill="'+col+'"/>';
  if (kind === "ex")
    return '<path d="M'+ (x-r).toFixed(1) +' '+ (y-r).toFixed(1) +'l'+ (r*2).toFixed(1) +' '+ (r*2).toFixed(1)
         + 'M'+ (x+r).toFixed(1) +' '+ (y-r).toFixed(1) +'l-'+ (r*2).toFixed(1) +' '+ (r*2).toFixed(1)
         + '" stroke="'+col+'" stroke-width="2" stroke-linecap="round"/>';
  if (kind === "ring")
    return '<circle cx="'+ x.toFixed(1) +'" cy="'+ y.toFixed(1) +'" r="'+(r-.4)
         + '" fill="none" stroke="'+col+'" stroke-width="1.8"/>';
  if (kind === "plus")
    return '<path d="M'+ (x-r-.6).toFixed(1) +' '+ y.toFixed(1) +'h'+ ((r+.6)*2).toFixed(1)
         + 'M'+ x.toFixed(1) +' '+ (y-r-.6).toFixed(1) +'v'+ ((r+.6)*2).toFixed(1)
         + '" stroke="'+col+'" stroke-width="2.2" stroke-linecap="round"/>';
  return '<circle cx="'+ x.toFixed(1) +'" cy="'+ y.toFixed(1) +'" r="'+r+'" fill="'+col+'"/>';
}
/* One chart, one series per section. x is the 회차 number itself — so 수리 3회차
   and 추리 3회차 sit on the same tick even though they happened weeks apart. */
function multiChart(series, o){
  var live = series.filter(function(sr){ return sr.pts.length; });
  if (!live.length) return "";
  var W = 320, H = 122, pl = 26, pr = 12, ptop = 12, pb = 20;
  var xMax = Math.max(2, o.xMax), yMax = o.yMax;
  var X = function(v){ return pl + (v-1) * (W-pl-pr) / (xMax-1); };
  var Y = function(v){ return ptop + (1 - v/yMax) * (H-ptop-pb); };

  var s = '<svg class="schart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+ o.aria +'">';
  [0, yMax/2, yMax].forEach(function(v){
    s += '<line x1="'+pl+'" y1="'+Y(v).toFixed(1)+'" x2="'+(W-pr)+'" y2="'+Y(v).toFixed(1)+'" '
       + 'stroke="var(--line-soft)" stroke-width="1"/>'
       + '<text x="'+(pl-5)+'" y="'+(Y(v)+3.5).toFixed(1)+'" text-anchor="end" '
       + 'font-size="8" fill="var(--ink-3)">'+ o.tick(v) +'</text>';
  });
  /* 회차 ticks along the bottom, thinned out so they stay readable */
  var step = xMax <= 8 ? 1 : Math.ceil(xMax/8);
  for (var t=1; t<=xMax; t+=step){
    s += '<text x="'+X(t).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" '
       + 'font-size="8" fill="var(--ink-3)">'+ t +'</text>';
  }
  live.forEach(function(sr){
    for (var k=0;k<sr.pts.length-1;k++){
      s += '<line x1="'+X(sr.pts[k].x).toFixed(1)+'" y1="'+Y(sr.pts[k].v).toFixed(1)+'" '
         + 'x2="'+X(sr.pts[k+1].x).toFixed(1)+'" y2="'+Y(sr.pts[k+1].v).toFixed(1)+'" '
         + 'stroke="'+sr.color+'" stroke-width="1.6" stroke-linecap="round" opacity=".75"/>';
    }
    sr.pts.forEach(function(p){ s += mark(sr.mk, X(p.x), Y(p.v), sr.color); });
  });
  s += '</svg>';
  return s;
}
/* Tap a legend entry to drop that series out of the charts. Eight 유형 on one
   axis is unreadable; hiding is view-only and never touches a record. */
function chartLegend(ex, series){
  var lg = '<div class="legend">';
  series.forEach(function(sr){
    var n = sr.pts.length, off = hidSeries[serKey(ex, sr.name)];
    lg += '<span class="lgi'+(n ? (off?' hid':'') : ' off')+'" role="button" tabindex="0" '
        + 'data-act="lgtog" data-x="'+ ex +'" data-n="'+ esc(sr.name) +'">'
        + '<svg viewBox="0 0 12 12" aria-hidden="true">'+ mark(sr.mk, 6, 6, sr.color) +'</svg>'
        + esc(sr.name) +'<i>'+ n +'회</i></span>';
  });
  return lg + '</div>';
}
function visible(ex, series){
  return series.filter(function(sr){ return !hidSeries[serKey(ex, sr.name)]; });
}

function viewAptExam(){
  var ex = adraft.exam, secs = EXSEC[ex];
  if (!exdraft.sec || !exSecOf(ex, exdraft.sec)) exdraft.sec = null;
  var cur = exdraft.sec ? exSecOf(ex, exdraft.sec) : null;
  var recs = exRecs(ex);

  /* ── 기록하기 ── */
  var h = '<div class="card"><h2>시험 기록</h2>';
  h += '<div class="secintro">제한시간 걸고 <b>영역 하나를 통째로</b> 푼 날 여기에 적어. '
     + '연습이랑 따로 쌓이고, <b>회차는 영역마다 따로</b> 세.</div>';
  h += '<div class="seg" style="margin-top:12px">'
     + ["gsat","skct"].map(function(k){
         return '<button data-act="aexam" data-x="'+k+'" aria-pressed="'+(ex===k)+'">'+ APT[k].nm +'</button>';
       }).join("")
     + '</div>';
  h += '<div class="tglab">영역</div><div class="tchips">'
     + secs.map(function(x){
         var done = exRecs(ex, x.s).length;
         return '<button data-act="exsec" data-t="'+ esc(x.s) +'" aria-pressed="'+(exdraft.sec===x.s)+'">'
              + esc(x.s) +' <em>'+ (done ? done + '회 봄' : x.n + '문항 ' + x.min + '분') +'</em></button>';
       }).join("")
     + '</div>';

  h += '<div class="numgrid three">'
     + '<label>맞은<input type="number" id="exok" inputmode="numeric" min="0" max="99" placeholder="0"></label>'
     + '<label>틀린<input type="number" id="exwr" inputmode="numeric" min="0" max="99" placeholder="0"></label>'
     + '<label>못 푼<input type="number" id="exsk" inputmode="numeric" min="0" max="99" placeholder="0"></label>'
     + '</div>';
  h += '<div class="studyhint" style="text-align:left">'
     + (cur ? '<b>'+ esc(cur.s) +' '+ cur.n +'문항</b> · 세 칸을 더하면 '+ cur.n +'이 돼야 해. '
            + '<b>못 푼</b> 칸은 비워두면 나머지로 자동으로 채워.'
           : '영역을 먼저 골라줘. 영역마다 총 문항 수가 달라.')
     + '</div>';

  var autoRun = exNextRun(ex, exdraft.sec);
  var manual = exdraft.run !== null;
  var willRun = manual ? exdraft.run : autoRun;
  var restMsg;
  if (!exdraft.sec){
    restMsg = '영역을 고르면 그 영역의 다음 회차가 잡혀';
  } else if (manual){
    var taken = exRecs(ex, exdraft.sec).filter(function(r){ return (r.run||1) === willRun; });
    restMsg = taken.length
      ? esc(exdraft.sec) +' '+ willRun +'회차는 이미 있어 — 저장하면 같은 번호가 둘이 돼'
      : esc(exdraft.sec) +' '+ willRun +'회차는 비어 있어 · 지웠던 회차를 다시 채우는 거라면 여기가 맞아';
  } else {
    restMsg = esc(exdraft.sec) +'만 세서 '+ willRun +'번째야 · 다른 영역은 각자 따로 세';
  }
  h += '<div class="runrow"><div class="rl">'
     + (exdraft.sec ? esc(exdraft.sec) : '이 기록은')
     + '<input type="number" class="runin" id="exrun" inputmode="numeric" min="1" max="999" value="'+ willRun +'">'
     + '회차<s>'+ restMsg +'</s></div>'
     + (manual ? '<button class="hbtn" data-act="exrunauto">자동으로</button>' : '')
     + '</div>';
  h += '<button class="addbtn" data-act="exadd" style="width:100%;margin-top:12px">시험 기록 추가</button>';
  h += '</div>';

  /* ── 그래프 ── */
  h += '<div class="card"><h2>추이<em>'+ APT[ex].nm +' · 영역별 회차</em></h2>';
  if (!recs.length){
    h += aneed("시험을 한 번 적으면 여기에 점이 하나 찍혀. 같은 영역을 두 번째 볼 때부터 선이 생겨.");
  } else {
    var xMax = exMaxRun(ex);
    /* per-section series, plus 전체 — the sections sitting on the same 회차
       number added together. At a 회차 where only one section exists, 전체 is
       that one section; it is a running total of what you actually sat. */
    var mk = function(val){
      var out = secs.map(function(sc){
        return { name:sc.s, mk:sc.mk, color:sc.c,
                 pts: exRecs(ex, sc.s).map(function(r){
                        return { x:(r.run||1), v:val(r, sc.n) };
                      }).filter(function(p){ return p.v !== null; }) };
      });
      var byRun = {};
      exRecs(ex).forEach(function(r){
        var k = r.run||1, sc = exSecOf(ex, r.sec);
        if (!byRun[k]) byRun[k] = { ok:0, wr:0, sk:0, tot:0 };
        byRun[k].ok += r.ok; byRun[k].wr += r.wr; byRun[k].sk += r.sk;
        byRun[k].tot += sc ? sc.n : (r.ok+r.wr+r.sk);
      });
      var tp = Object.keys(byRun).map(Number).sort(function(a,b){ return a-b; })
        .map(function(k){ return { x:k, v:val(byRun[k], byRun[k].tot) }; })
        .filter(function(p){ return p.v !== null; });
      out.push({ name:"전체", mk:"ring", color:"var(--ink-2)", pts:tp, all:true });
      return out;
    };
    var accS = mk(function(r){ return exAcc(r) === null ? null : exAcc(r)*100; });
    var rchS = mk(function(r, tot){ return (r.ok + r.wr) / tot * 100; });
    var okS  = mk(function(r){ return r.ok; });
    var allN = secs.reduce(function(a,sc){ return a + sc.n; }, 0);
    var pctTick = function(v){ return Math.round(v) + ""; };
    var pctFmt  = function(v){ return Math.round(v) + "%"; };

    h += '<div class="secintro">가로축은 <b>그 영역의 회차</b>야. '
       + '수리 3번·추리 1번 봤으면 수리는 3회차까지, 추리는 1회차에 찍혀 — 영역마다 진도가 따로 흐르니까. '
       + '<b>전체</b>는 같은 회차 번호의 영역들을 합친 값이야. 모양으로 구분해.</div>';
    h += chartLegend(ex, accS);

    h += '<div class="chead"><span>정답률<i>맞은 / 푼 것</i></span></div>';
    h += multiChart(visible(ex, accS), {xMax:xMax, yMax:100, tick:pctTick, aria:"영역별 회차 정답률"});

    h += '<div class="chead"><span>푼 양<i>못 푼 문항을 뺀 비율</i></span></div>';
    h += multiChart(visible(ex, rchS), {xMax:xMax, yMax:100, tick:pctTick, aria:"영역별 회차 푼 양"});

    h += '<div class="chead"><span>맞은 개수<i>영역 문항 기준</i></span></div>';
    h += multiChart(visible(ex, okS), {xMax:xMax, yMax:Math.max(5, allN),
                          tick:function(v){ return Math.round(v)+""; }, aria:"영역별 회차 맞은 개수"});

    h += '<div class="cnote">정답률은 <b>고른 것 중 얼마나 맞았나</b>, 푼 양은 '
       + '<b>시간 안에 어디까지 갔나</b>야. 둘이 같이 안 움직이는 게 정상이고, '
       + '어느 쪽이 발목을 잡는지가 이 두 줄로 갈려.</div>';
  }
  h += '</div>';

  /* ── 영역별 ── */
  h += '<div class="card"><h2>영역별<em>'+ APT[ex].nm +'</em></h2>';
  if (!recs.length){
    h += aneed("시험 기록이 생기면 여기부터 채워져.");
  } else {
    h += atrust(recs.length, 10, "시험 기록");
    var rows = secs.map(function(sc){
      var inS = exRecs(ex, sc.s);
      var agg = { ok:0, wr:0, sk:0, tot:0 };
      inS.forEach(function(r){ agg.ok+=r.ok; agg.wr+=r.wr; agg.sk+=r.sk; agg.tot+=sc.n; });
      return { s:sc.s, n:inS.length, acc:exAcc(agg), reach:exReach(agg) };
    }).filter(function(r){ return r.n > 0; });
    rows.sort(function(a,b){ return a.acc - b.acc; });

    h += '<div class="btable">';
    rows.forEach(function(r){
      h += '<div class="brow"><div class="bl">'+ esc(r.s) +'<s>'+ r.n +'회차까지</s></div>'
         + '<div class="bv">'
         +   '<div class="bcell"><span>정답률</span><u>'+ pctText(r.acc) +'</u>'+ bar(r.acc, "good") +'</div>'
         +   '<div class="bcell"><span>푼 양</span><u>'+ pctText(r.reach) +'</u>'+ bar(r.reach, "acc") +'</div>'
         + '</div></div>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* ── 최근 기록 ── */
  h += '<div class="card"><h2 class="h2row">최근 시험<em>'+ APT[ex].nm +'</em>'
     + (recs.length ? '<button class="hbtn" data-act="exrenum">회차 정리</button>' : '')
     + '</h2>';
  if (recs.length){
    h += '<div class="studyhint" style="text-align:left;margin:-4px 0 10px">'
       + '✎ 로 회차·날짜·숫자를 고칠 수 있어. 수리 3회차를 지웠다면 <b>회차 정리</b>가 '
       + '수리만 1·2·3으로 당겨줘 — 추리는 안 건드려.</div>';
  }
  if (!recs.length){
    h += '<div class="empty">아직 '+ APT[ex].nm +' 시험 기록이 없어.</div>';
  } else {
    h += '<div class="list">';
    recs.slice().reverse().slice(0,14).forEach(function(r){
      var sc = exSecOf(r.exam, r.sec), tot = sc ? sc.n : (r.ok+r.wr+r.sk);
      if (r.id === exEditId){
        h += '<div class="apedit">'
           + '<div class="ael">'+ md(parseISO(r.ds)) +' · <b>'+ esc(r.sec) +'</b>'
           +   '<s>세 칸의 합이 '+ tot +'이 돼야 해 · 회차는 이 영역 안에서의 번호야</s></div>'
           + '<div class="numgrid three">'
           +   '<label>맞은<input type="number" id="exeok" inputmode="numeric" min="0" max="99" value="'+ r.ok +'"></label>'
           +   '<label>틀린<input type="number" id="exewr" inputmode="numeric" min="0" max="99" value="'+ r.wr +'"></label>'
           +   '<label>못 푼<input type="number" id="exesk" inputmode="numeric" min="0" max="99" value="'+ r.sk +'"></label>'
           + '</div>'
           + '<div class="numgrid">'
           +   '<label>회차<input type="number" id="exerun" inputmode="numeric" min="1" max="999" value="'+ (r.run||1) +'"></label>'
           +   '<label>날짜<input type="date" id="exedate" value="'+ r.ds +'"></label>'
           + '</div>'
           + '<div class="submitrow">'
           +   '<button class="ghost" data-act="exeditcancel">취소</button>'
           +   '<button class="submit" data-act="exeditsave" data-id="'+ r.id +'">저장</button>'
           + '</div></div>';
        return;
      }
      h += '<div class="aprow">'
         + '<div class="ad">'+ (r.run||1) +'회<s>'+ md(parseISO(r.ds)) +'</s></div>'
         + '<div class="at">'+ esc(r.sec) +'<s>맞 '+ r.ok +' · 틀 '+ r.wr +' · 못 '+ r.sk +' / '+ tot +'</s></div>'
         + '<div class="ar">'+ pctText(exAcc(r)) +'<s>푼 양 '+ pctText(exReach({ok:r.ok,wr:r.wr,tot:tot})) +'</s></div>'
         + '<button class="adel" data-act="exedit" data-id="'+ r.id +'" aria-label="고치기">✎</button>'
         + '<button class="adel" data-act="exdel" data-id="'+ r.id +'" aria-label="지우기">×</button>'
         + '</div>';
    });
    h += '</div>';
  }
  h += '</div>';
  return h;
}

function viewApt(){
  /* 연습 ↔ 시험 — 같은 탭, 다른 기록판 */
  var mh = '<div class="seg" style="margin-bottom:14px">'
    + [["prac","연습"],["exam","시험"]].map(function(m){
        return '<button data-act="amode" data-x="'+m[0]+'" aria-pressed="'
             + (aptMode===m[0]) +'">'+ m[1] +'</button>';
      }).join("")
    + '</div>';
  if (aptMode === "exam") return mh + viewAptExam();
  if (!adraft.tod) adraft.tod = todNow();
  var ex = adraft.exam, all = aptRecs(), recs = aptRecs(ex);

  /* ── 기록하기 ── */
  var h = mh + '<div class="card"><h2>기록하기</h2>';

     + 'pt나 뽑기권에는 안 들어가 — 여기는 순수한 기록판이야.</div>';
