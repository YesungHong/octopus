     + ["gsat","skct"].map(function(k){
         return '<button data-act="aexam" data-x="'+k+'" aria-pressed="'+(ex===k)+'">'+ APT[k].nm +'</button>';
       }).join("")
     + '</div>';

  APT[ex].groups.forEach(function(gr){
    h += '<div class="tglab">'+ gr.g +'</div><div class="tchips">'
       + gr.ts.map(function(t){
           return '<button data-act="atype" data-t="'+ esc(t) +'" aria-pressed="'
                + (adraft.type === t) +'">'+ esc(t) +'</button>';
         }).join("")
       + '</div>';
  });

  h += '<div class="tglab">언제 풀었어</div><div class="seg">'
     + TODK.map(function(k){
         return '<button data-act="atod" data-x="'+k+'" aria-pressed="'+(adraft.tod===k)+'">'+ TOD[k] +'</button>';
       }).join("")
     + '</div>';

  h += '<div class="numgrid">'
     + '<label>푼 문항<input type="number" id="an" inputmode="numeric" min="1" max="200" placeholder="10"></label>'
     + '<label>맞은 개수<input type="number" id="aok" inputmode="numeric" min="0" max="200" placeholder="7"></label>'
     + '<label>걸린 시간 (분)<input type="number" id="amin" inputmode="numeric" min="0" max="600" placeholder="12"></label>'
     + '<label>초<input type="number" id="asec" inputmode="numeric" min="0" max="59" placeholder="0"></label>'
     + '</div>';
  h += '<div class="studyhint" style="text-align:left">시간은 비워둬도 돼. 적으면 문항당 속도까지 같이 봐줄게.</div>';

  var aAuto = aptNextRun(ex, adraft.type);
  var aMan = adraft.run !== null;
  var aWill = aMan ? adraft.run : aAuto;
  var aMsg;
  if (!adraft.type){
    aMsg = '유형을 고르면 그 유형의 다음 회차가 잡혀';
  } else if (aMan){
    var aTaken = aptRecs(ex, adraft.type).filter(function(r){ return (r.run||1) === aWill; });
    aMsg = aTaken.length
      ? esc(adraft.type) +' '+ aWill +'회차는 이미 있어 — 저장하면 같은 번호가 둘이 돼'
      : esc(adraft.type) +' '+ aWill +'회차는 비어 있어 · 지웠던 회차를 다시 채우는 거라면 여기가 맞아';
  } else {
    aMsg = esc(adraft.type) +'만 세서 '+ aWill +'번째야 · 유형마다 따로 세';
  }
  h += '<div class="runrow"><div class="rl">'
     + (adraft.type ? esc(adraft.type) : '이 기록은')
     + '<input type="number" class="runin" id="aprun" inputmode="numeric" min="1" max="999" value="'+ aWill +'">'
     + '회차<s>'+ aMsg +'</s></div>'
     + (aMan ? '<button class="hbtn" data-act="aprunauto">자동으로</button>' : '')
     + '</div>';
  h += '<button class="addbtn" data-act="aadd" style="width:100%;margin-top:12px">기록 추가</button>';
  h += '</div>';

  /* ── 그래프 ── */
  h += '<div class="card"><h2>추이<em>'+ APT[ex].nm +' · 유형별 회차</em></h2>';
  if (!recs.length){
    h += aneed("한 세트만 적어도 점이 하나 찍혀. 같은 유형을 두 번째 풀 때부터 선이 생겨.");
  } else {
    var pxMax = aptMaxRun(ex);
    var pmk = function(val){
      var out = aptTypes(ex).map(function(t){
        var st = tstyle(ex, t);
        return { name:t, mk:st.mk, color:st.c,
                 pts: aptRecs(ex, t).map(function(r){ return { x:(r.run||1), v:val(r) }; })
                        .filter(function(p){ return p.v !== null; }) };
      }).filter(function(sr){ return sr.pts.length; });
      var byRun = {};
      aptRecs(ex).forEach(function(r){
        var k = r.run||1;
        if (!byRun[k]) byRun[k] = { n:0, ok:0, sec:0, secN:0 };
        byRun[k].n += r.n; byRun[k].ok += r.ok;
        if (r.sec > 0){ byRun[k].sec += r.sec; byRun[k].secN += r.n; }
      });
      var tp = Object.keys(byRun).map(Number).sort(function(a,b){ return a-b; })
        .map(function(k){ return { x:k, v:val(byRun[k]) }; })
        .filter(function(p){ return p.v !== null; });
      out.push({ name:"전체", mk:"ring", color:"var(--ink-2)", pts:tp });
      return out;
    };
    var pAcc  = pmk(function(r){ return r.n ? r.ok/r.n*100 : null; });
    var pPace = pmk(function(r){
      var sN = r.secN !== undefined ? r.secN : (r.sec > 0 ? r.n : 0);
      return sN ? r.sec/sN : null;
    });
    var pVol  = pmk(function(r){ return r.n; });

    var paceMax = 30;
    pPace.forEach(function(sr){ sr.pts.forEach(function(p){ if (p.v > paceMax) paceMax = p.v; }); });
    paceMax = Math.ceil(paceMax/15)*15;
    var volMax = 10;
    pVol.forEach(function(sr){ sr.pts.forEach(function(p){ if (p.v > volMax) volMax = p.v; }); });

    h += '<div class="secintro">시험이랑 같아 — 가로축은 <b>그 유형의 회차</b>고, '
       + '<b>전체</b>는 같은 회차 번호를 합친 값이야. '
       + '유형이 많으니까 <b>범례를 눌러 켜고 끌 수 있어.</b></div>';
    h += chartLegend(ex, pAcc);

    h += '<div class="chead"><span>정답률<i>맞은 / 푼 것</i></span></div>';
    h += multiChart(visible(ex, pAcc), {xMax:pxMax, yMax:100,
           tick:function(v){ return Math.round(v)+""; }, aria:"유형별 회차 정답률"});

    h += '<div class="chead"><span>문항당 시간<i>초 · 낮을수록 빠름</i></span></div>';
    h += multiChart(visible(ex, pPace), {xMax:pxMax, yMax:paceMax,
           tick:function(v){ return Math.round(v)+""; }, aria:"유형별 회차 문항당 시간"});

    h += '<div class="chead"><span>푼 문항<i>그 회차에 푼 개수</i></span></div>';
    h += multiChart(visible(ex, pVol), {xMax:pxMax, yMax:volMax,
           tick:function(v){ return Math.round(v)+""; }, aria:"유형별 회차 푼 문항"});

    h += '<div class="cnote">정답률이 오르는데 <b>문항당 시간도 같이 오르면</b> 실력이 아니라 '
       + '<b>더 오래 붙잡고 있는 것</b>일 수 있어. 시험은 시간이 고정이니까 두 줄을 같이 봐야 해.</div>';
  }
  h += '</div>';

  /* ── 최근 기록 ── */
  h += '<div class="card"><h2 class="h2row">최근 기록<em>'+ APT[ex].nm +'</em>'
     + (recs.length ? '<button class="hbtn" data-act="aprenum">회차 정리</button>' : '')
     + '</h2>';
  if (!recs.length){
    h += '<div class="empty">아직 '+ APT[ex].nm +' 기록이 없어.<br>한 세트 풀고 위에 적어봐.</div>';
  } else {
    var last = recs.slice(-12).reverse();
    h += '<div class="list">';
    last.forEach(function(r){
      var d = parseISO(r.ds);
      if (r.id === aEditId){
        h += '<div class="apedit">'
           + '<div class="ael">'+ md(d) +' · <b>'+ esc(r.type) +'</b>'
           +   '<s>시간은 비우면 없는 걸로 둬</s></div>'
           + '<div class="numgrid">'
           +   '<label>푼 문항<input type="number" id="aeon" inputmode="numeric" min="1" max="200" value="'+ r.n +'"></label>'
           +   '<label>맞은 개수<input type="number" id="aeok" inputmode="numeric" min="0" max="200" value="'+ r.ok +'"></label>'
           +   '<label>걸린 시간 (분)<input type="number" id="aemin" inputmode="numeric" min="0" max="600" value="'
           +      (r.sec > 0 ? Math.floor(r.sec/60) : "") +'"></label>'
           +   '<label>초<input type="number" id="aesec" inputmode="numeric" min="0" max="59" value="'
           +      (r.sec > 0 ? (r.sec%60) : "") +'"></label>'
           + '</div>'
           + '<div class="numgrid">'
           +   '<label>회차<input type="number" id="aerun" inputmode="numeric" min="1" max="999" value="'+ (r.run||1) +'"></label>'
           +   '<label>날짜<input type="date" id="aedate" value="'+ r.ds +'"></label>'
           + '</div>'
           + '<div class="tglab">언제 풀었어</div><div class="seg">'
           +   TODK.map(function(k){
                 return '<button data-act="aedittod" data-x="'+k+'" data-id="'+ r.id +'" aria-pressed="'
                      + (r.tod===k) +'">'+ TOD[k] +'</button>';
               }).join("")
           + '</div>'
           + '<div class="submitrow">'
           +   '<button class="ghost" data-act="aeditcancel">취소</button>'
           +   '<button class="submit" data-act="aeditsave" data-id="'+ r.id +'">저장</button>'
           + '</div></div>';
        return;
      }
      h += '<div class="aprow">'
         + '<div class="ad">'+ (r.run||1) +'회<s>'+ md(d) +'</s></div>'
         + '<div class="at">'+ esc(r.type) +'<s>'+ TOD[r.tod] +' · '+ r.ok +'/'+ r.n +'문항'
         +   (r.sec > 0 ? ' · '+ secText(r.sec) : '') +'</s></div>'
         + '<div class="ar">'+ Math.round(r.ok/r.n*100) +'%'
         +   (r.sec > 0 ? '<s>문항당 '+ secText(r.sec/r.n) +'</s>' : '') +'</div>'
         + '<button class="adel" data-act="aedit" data-id="'+ r.id +'" aria-label="고치기">✎</button>'
         + '<button class="adel" data-act="adel" data-id="'+ r.id +'" aria-label="지우기">×</button>'
         + '</div>';
    });
    h += '</div>';
    var tot = accOf(recs);
    h += '<div class="drep" style="margin-top:14px">'
       + drow("전체 정답률", pctText(tot), tot !== null && tot >= 0.7 ? "good" : "")
       + drow("푼 문항", recs.reduce(function(a,r){ return a+r.n; },0) + "문항 · " + recs.length + "세트", "")
       + drow("문항당 시간", secText(paceOf(recs)), "")
       + '</div>';
  }
  h += '</div>';

  /* ── 유형별 성적표 ── */
  h += '<div class="card"><h2>유형별<em>'+ APT[ex].nm +'</em></h2>';
  if (!recs.length){
    h += aneed("기록이 하나라도 생기면 여기부터 채워져.");
  } else {
    h += atrust(recs.length, 15, "기록");
    var rows = aptTypes(ex).map(function(t){
      var inT = recs.filter(function(r){ return r.type === t; });
      return { t:t, n:inT.length, items:inT.reduce(function(a,r){ return a+r.n; },0),
               acc:accOf(inT), pace:paceOf(inT) };
    }).filter(function(r){ return r.n > 0; });
    /* weakest first — the table is for finding where to aim, not for a ranking */
    rows.sort(function(a,b){ return a.acc - b.acc; });

    h += '<div class="btable">';
    rows.forEach(function(r){
      h += '<div class="brow"><div class="bl">'+ esc(r.t) +'<s>'+ r.items +'문항</s></div>'
         + '<div class="bv">'
         +   '<div class="bcell"><span>정답률</span><u>'+ pctText(r.acc) +'</u>'+ bar(r.acc, "good") +'</div>'
         +   '<div class="bcell"><span>문항당</span><u>'+ secText(r.pace) +'</u></div>'
         + '</div></div>';
    });
    h += '</div>';

    var untouched = aptTypes(ex).filter(function(t){
      return !recs.some(function(r){ return r.type === t; });
    });
    if (untouched.length){
      h += '<div class="studyhint" style="text-align:left">아직 안 푼 유형: '
         + untouched.map(esc).join(" · ") + '</div>';
    }
    if (rows.length >= 3){
      var weak = rows[0];
      h += '<div class="finding"><div class="fk">지금 제일 아쉬운 유형</div>'
         + '<div class="fv">'+ esc(weak.t) +'</div>'
         + '<div class="fs">정답률 '+ pctText(weak.acc) +' · '+ weak.items +'문항 기준</div></div>';
    }
  }
  h += '</div>';

  h += '<button class="jump" data-act="aptin">인적성 분석 <em>'+ all.length +'건</em></button>';
  return h;
}

/* ── 인적성 분석 ──
   두 가지만 묻는다: 매일 이어서 푸는 게 실제로 효과가 있나, 그리고 시간대에 따라
   달라지나. 둘 다 "몇 점 올랐다"가 아니라 "너는 이런 타입이다"로 말한다 —
   소수점 차이를 성적표처럼 읽게 만들지 않으려고. */
function aptSplitStreak(){
  var days = aptDays();
  var cont = [], solo = [];
  (S.aptit || []).forEach(function(r){
    var prev = iso(addDays(parseISO(r.ds), -1));
    (days[prev] ? cont : solo).push(r);
  });
  return { cont:cont, solo:solo };
}
function aptVerdict(kind, a, b, la, lb){
  var gap = (a - b) * 100;                 /* percentage points */
  var out = {};
  if (kind === "streak"){
    if (gap > 3){
      out.cls = "ok";
      out.t = "너는 <b>이어서 풀면 붙는 타입</b>이야. 전날도 푼 다음 날의 정답률이 더 높게 나와. "
            + "매일 조금씩이 너한테는 실제로 통한다는 뜻이야 — 감이 아니라 네 기록이 그래.";
    } else if (gap < -3){
      out.cls = "";
      out.t = "이어서 푼 날이 오히려 조금 낮게 나와. 매일이 나쁘다는 게 아니라, "
            + "<b>연속으로 갈 때 피로가 같이 쌓이는</b> 걸 수도 있어. "
            + "중간에 하루 비워도 손해 아니라는 얘기야.";
    } else {
      out.cls = "";
      out.t = "이어서 풀든 하루 걸러 풀든 정답률이 비슷해. "
            + "적어도 지금 기록에선 <b>연속 여부가 실력을 가르지 않아</b>. "
            + "그러니까 하루 건너뛴 날에 죄책감 가질 이유는 없어.";
    }
  } else {                                  /* trend — a=최근 절반, b=처음 절반 */
    if (gap > 3){
      out.cls = "ok";
      out.t = "최근 절반이 처음 절반보다 정답률이 높아. <b>올라가고 있어.</b> "
            + "이런 건 하고 있는 중에는 절대 체감이 안 되는 종류라서, 숫자로 보라고 여기 둔 거야.";
    } else if (gap < -3){
      out.cls = "";
      out.t = "최근 절반이 조금 낮게 나왔어. 보통은 <b>더 어려운 유형으로 넘어갔을 때</b> 이렇게 돼. "
            + "유형별 표를 같이 보면 어디서 내려갔는지 보일 거야.";
    } else {
      out.cls = "";
      out.t = "처음이나 지금이나 정답률이 비슷해. 아직 <b>변화가 보일 만큼 쌓이지 않은</b> 구간이야. "
            + "인적성은 원래 한참 평평하다가 한 번에 올라가는 편이라 이상한 그림이 아니야.";
    }
  }
  out.sub = la +' '+ pctText(a) +' vs '+ lb +' '+ pctText(b)
          + ' · 차이 '+ Math.abs(gap).toFixed(0) +'%p';
  return out;
}
function afind(v){
  return '<div class="cnote'+(v.cls?' '+v.cls:'')+'">'+ v.t
       + '<div class="fs" style="margin-top:7px">'+ v.sub +'</div></div>';
}

function buildReport(ws){
  var byDay = [], total = 0, tiers = {1:0,2:0,3:0}, oncesDone = [];
  var sleep = [], cond = [];
  for (var i=0;i<7;i++){
    var ds = iso(addDays(ws,i)), m = S.log[ds] || {}, p = 0;
    var cc = condOn(ds);
    sleep.push(sleepHours(cc));
    cond.push(cc && cc.score ? cc.score : null);
    for (var id in m){
      var t = taskById(id);
      if (!t) continue;
      p += PTS[t.tier]; tiers[t.tier]++;
      if (t.repeat !== "weekly") oncesDone.push(t.title);
    }
    byDay.push(p); total += p;
  }
  var routines = S.tasks.filter(function(t){ return t.repeat==="weekly"; }).map(function(t){
    var plan = t.days.length, did = 0;
    t.days.forEach(function(dw){ if (doneOn(iso(addDays(ws,dw)), t.id)) did++; });
    return {title:t.title, did:did, plan:plan};
  });
  return {
    wno: weekNo(ws), key: weekKey(ws),
    range: md(ws) + " → " + md(addDays(ws,6)),
    total: total, byDay: byDay, tiers: tiers, sleep: sleep, cond: cond,
    targets: byDay.map(function(_,i){ return targetFor(iso(addDays(ws,i))); }),
    mins: byDay.map(function(_,i){ return minsOn(iso(addDays(ws,i))); }),
    hits: byDay.filter(function(p,i){ return p >= targetFor(iso(addDays(ws,i))); }).length,
    target: S.weeklyTarget,
    routines: routines, onces: oncesDone,
    claimed: S.rewards.filter(function(r){ return r.claimed; }).length
  };
}

function viewReport(r, prev, isPreview){
  var tgs = r.targets || [];
  var tg = function(i){ return tgs[i] || S.dailyTarget; };
  var max = Math.max.apply(null, r.byDay.concat([S.dailyTarget]));
  var delta = prev ? r.total - prev.total : null;
  var pct = r.target ? Math.round(r.total/r.target*100) : 0;

  var h = '<div class="card">';
  h += '<div class="rep-h"><div class="t">주간 보고서 · W'+ r.wno
     + (isPreview ? ' <i>미리보기</i>' : '') +'</div><div class="d">'+ r.range +'</div></div>';

  h += '<div class="readout"><div class="big">'+ r.total +'<em> pt</em></div><div class="side">'
     + (delta === null ? '첫 주야' : (delta >= 0 ? '지난주 대비 <b>+'+delta+'</b>' : '지난주 대비 <b>'+delta+'</b>'))
     + '<br>목표의 <b>'+ pct +'%</b></div></div>';

  h += '<div class="days">';
  r.byDay.forEach(function(p,i){
    var cls = p >= tg(i) ? "hit" : (p > 0 ? "some" : "");
    var hpx = p ? Math.max(4, Math.round(p/max*76)) : 3;
    h += '<div class="day '+cls+'"><div class="pt">'+ (p||"·") +'</div>'
       + '<div class="stack" style="height:'+hpx+'px"></div></div>';
  });
  h += '</div><div class="dow">'+ DOW.map(function(n){return '<span>'+n+'</span>';}).join("") +'</div>';

  h += '<div class="stats">'
     + '<div class="stat"><div class="k">목표 달성</div><div class="v">'+ r.hits +'<small>/ 7일</small></div></div>'
     + '<div class="stat"><div class="k">받은 보상</div><div class="v">'+ r.claimed +'<small>/ 4</small></div></div>'
     + '<div class="stat"><div class="k">난이도</div><div class="v" style="font-size:14px">H '+r.tiers[3]+' · M '+r.tiers[2]+' · E '+r.tiers[1]+'</div></div>'
     + '<div class="stat"><div class="k">한 번짜리</div><div class="v">'+ r.onces.length +'<small>개 완료</small></div></div>'
     + '</div>';

  var rm = r.mins || [];
  var totM = rm.reduce(function(a,b){ return a+b; }, 0);
  if (totM){
    var daysWith = rm.filter(function(x){ return x > 0; }).length;
    h += '<h2 class="mt">공부 시간</h2>';
    h += '<div class="stats">'
       + '<div class="stat"><div class="k">주 합계</div><div class="v sm">'+ hm(totM) +'</div></div>'
       + '<div class="stat"><div class="k">기록된 날 평균</div><div class="v sm">'
       +   hm(Math.round(totM/daysWith)) +'<small>· '+ daysWith +'일</small></div></div>'
       + '</div>';
  }

  /* sleep ↔ output. Split at the week's own median so it always says something
     real, instead of an arbitrary "7 hours" that some weeks never cross. */
  var sl = r.sleep || [], cd = r.cond || [];
  var haveSleep = sl.filter(function(x){ return x !== null && x !== undefined; }).length;
  if (haveSleep){
    var avgS = mean(sl), avgC = mean(cd);
    h += '<h2 class="mt">잠과 성취</h2>';
    h += '<div class="stats">'
       + '<div class="stat"><div class="k">평균 수면</div><div class="v">'+ avgS.toFixed(1) +'<small>시간</small></div></div>'
       + '<div class="stat"><div class="k">평균 컨디션</div><div class="v">'
       +   (avgC === null ? '—' : avgC.toFixed(1) + '<small>/ 5</small>') +'</div></div>'
       + '</div>';

    if (haveSleep >= 3){
      var med = median(sl), hi = [], lo = [];
      sl.forEach(function(x,i){
        if (x === null || x === undefined) return;
        (x >= med ? hi : lo).push(r.byDay[i]);
      });
      if (hi.length && lo.length){
        h += '<div class="cmp">'
           + '<div class="cmpline"><span>'+ med.toFixed(1) +'시간 이상 잔 날</span>'
           +   '<b>'+ mean(hi).toFixed(1) +' pt</b></div>'
           + '<div class="cmpline"><span>'+ med.toFixed(1) +'시간 미만 잔 날</span>'
           +   '<b>'+ mean(lo).toFixed(1) +' pt</b></div>'
           + '</div>';
      }
    }

    h += '<div class="slist">';
    sl.forEach(function(x,i){
      if (x === null && r.byDay[i] === 0 && !cd[i]) return;
      h += '<div class="sline"><div class="d">'+ DOW[i] +'</div>'
         + '<div class="s">'+ (x === null ? '—' : x.toFixed(1)+'h') +'</div>'
         + '<div class="c">'+ (cd[i] ? CLABEL[cd[i]] : '—') +'</div>'
         + '<div class="p">'+ r.byDay[i] +' pt</div></div>';
    });
    h += '</div>';
  }

  if (r.routines.length){
    h += '<h2 class="mt">루틴 이행</h2><div class="list">';
    r.routines.forEach(function(x){
      h += '<div class="row" style="cursor:default"><div class="ttl">'+ esc(x.title) +'</div>'
         + '<div class="rate">'+ x.did +'/'+ x.plan +'</div></div>';
    });
    h += '</div>';
  }
  if (r.onces.length){
    h += '<h2 class="mt">끝낸 것</h2><div class="list">';
    r.onces.forEach(function(t){
      h += '<div class="row on" style="cursor:default">'+chk()+'<div class="ttl">'+ esc(t) +'</div></div>';
    });
    h += '</div>';
  }

  h += '<div class="note">🐙 '+ esc(comment(r, isPreview)) +'</div>';
  h += '</div><div class="foot"><button data-act="closerep">'
     + (isPreview ? '돌아가기' : '닫고 이번 주로') +'</button></div>';
  return h;
}

function comment(r, isPreview){
  var b = r.byDay, active = b.filter(function(p){ return p>0; }).length;
  if (r.total === 0){
    return isPreview
      ? "아직 아무것도 안 찍혔어. 하나 체크하면 여기부터 채워져."
      : "이번 주는 기록이 없네. 그런 주도 있어. 다음 주는 하나부터.";
  }
  if (isPreview) return "아직 진행 중이야. 지금까지 " + r.total + "pt, " + active +
    "일 움직였고, " + DOW[b.indexOf(Math.max.apply(null,b))] + "요일이 제일 많았어.";
  var best = b.indexOf(Math.max.apply(null,b));
  /* longest run of active days */
  var run=0, bestRun=0;
  b.forEach(function(p){ if (p>0){ run++; if(run>bestRun) bestRun=run; } else run=0; });
  var s = DOW[best] + "요일이 제일 많았고, " + active + "일 움직였어.";
  if (bestRun >= 3) s += " " + bestRun + "일 연속으로 붙은 구간이 있는 게 눈에 띄네.";
  else if (r.hits >= 3) s += " 목표를 " + r.hits + "번 찍었으면 충분한 주야.";
  else s += " 조금씩이라도 이어진 게 기록으로 남았어.";
  return s;
}

/* ───────── week rollover ───────── */
var pendingReport = null;

function checkRollover(){
  var ws = weekStart(today()), key = weekKey(ws);
  if (!S.seenWeek){ S.seenWeek = key; save(); return; }
  if (S.seenWeek === key) return;

  /* close out every week between seenWeek and now that has data */
  var prevWs = weekStart(addDays(ws,-7));
  var rep = buildReport(prevWs);
  if (rep.total > 0 || S.reports.length){
    var already = S.reports.some(function(x){ return x.key === rep.key; });
    if (!already) S.reports.push(rep);
    pendingReport = rep;
  }
  S.seenWeek = key;
  S.rewards.forEach(function(r){ r.claimed = false; });   /* new week, fresh ladder */
  save();
}

function toast(msg){

  t.textContent = msg; t.classList.add("up");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("up"); }, 2600);

function wire(){
  var v = el("view");

  v.querySelectorAll("[data-act]").forEach(function(n){
    var act = n.dataset.act;
    if (act === "reward"){
      n.addEventListener("input", function(){ S.rewards[+n.dataset.i].text = n.value; save(); });
      return;
    }
    if (n.tagName === "INPUT") return;
    n.addEventListener("click", function(ev){ ev.stopPropagation(); doAct(act, n); });
    if (n.getAttribute("role") === "button"){
      n.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); doAct(act,n); }
      });
    }
  });

  var tierSeg = el("ntier"), repSeg = el("nrep"), dayPick = el("ndays"), nt = el("nt");
  if (tierSeg){
    tierSeg.querySelectorAll("button").forEach(function(b){
      b.setAttribute("aria-pressed", (+b.dataset.t === draft.tier) ? "true":"false");
      b.addEventListener("click", function(){
        draft.tier = +b.dataset.t;
        tierSeg.querySelectorAll("button").forEach(function(x){
          x.setAttribute("aria-pressed", x===b ? "true":"false"); });
      });
    });
    /* 일간's quick-add has no repeat/weekday pickers — guard for that */
    if (repSeg && dayPick){
      repSeg.querySelectorAll("button").forEach(function(b){
        b.setAttribute("aria-pressed", (b.dataset.r === draft.repeat) ? "true":"false");
        b.addEventListener("click", function(){
          draft.repeat = b.dataset.r;
          repSeg.querySelectorAll("button").forEach(function(x){
            x.setAttribute("aria-pressed", x===b ? "true":"false"); });
          dayPick.classList.toggle("hide", draft.repeat !== "weekly");
        });
      });
      dayPick.classList.toggle("hide", draft.repeat !== "weekly");
      dayPick.querySelectorAll("button").forEach(function(b){
        var d = +b.dataset.d;
        b.setAttribute("aria-pressed", draft.days.indexOf(d)>=0 ? "true":"false");
        b.addEventListener("click", function(){
          var k = draft.days.indexOf(d);
          if (k>=0) draft.days.splice(k,1); else draft.days.push(d);
          b.setAttribute("aria-pressed", draft.days.indexOf(d)>=0 ? "true":"false");
        });
      });
    }
    nt.addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){ ev.preventDefault(); doAct("add"); }
    });
  }

  /* the time wheel commits as soon as it is dismissed — 확인 is only a fallback
     for browsers that fire no change event until blur */
  var atc = el("atcustom");
  if (atc) atc.addEventListener("change", function(){
    if (atc.value && atId) setAt(atId, atc.value);
  });

  /* inline editor pickers */
  var eTier = el("etier"), eDays = el("edays"), eBox = el("et");
  if (eTier){
    eTier.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        edraft.tier = +b.dataset.t;
        eTier.querySelectorAll("button").forEach(function(x){
          x.setAttribute("aria-pressed", x===b ? "true":"false"); });
      });
    });
  }
  if (eDays){
    eDays.querySelectorAll("button").forEach(function(b){
      var d = +b.dataset.d;
      b.addEventListener("click", function(){
        var k = edraft.days.indexOf(d);
        if (k>=0) edraft.days.splice(k,1); else edraft.days.push(d);
        b.setAttribute("aria-pressed", edraft.days.indexOf(d)>=0 ? "true":"false");
      });
    });
  }
  if (eBox){
    eBox.focus();
    eBox.setSelectionRange(eBox.value.length, eBox.value.length);
    eBox.addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){
        ev.preventDefault();
        var s = document.querySelector('[data-act="saveedit"]'); if (s) s.click();
      }
      if (ev.key === "Escape"){ editingId = null; render(); }
    });
  }

  /* sleep clocks — save every tick, but never re-render while the picker is open */
  ["cSleep","cWake"].forEach(function(id){
    var box = el(id);
    if (!box) return;
    var key = (id === "cSleep") ? "sleep" : "wake";
    function commit(){ cdraft[key] = box.value; patchSleep(); }
    box.addEventListener("input",  commit);
    box.addEventListener("change", commit);
  });

  var csts = document.querySelectorAll("input.cst");
  if (csts.length){
    csts.forEach(function(box){
      box.addEventListener("change", function(){
        var m = S.condTarget ? S.condTarget : condTargets();
        var v = Math.max(1, Math.min(60, parseInt(box.value,10) || 1));
        m[+box.dataset.k] = v;
        S.condTarget = m;
        box.value = v;
        save(); render2("settings");
      });
    });
  }

  var apRunBox = el("aprun");
  if (apRunBox){
    apRunBox.addEventListener("input", function(){
      var v = parseInt(apRunBox.value, 10);
      adraft.run = (isNaN(v) || v < 1) ? null : v;
    });
    apRunBox.addEventListener("change", function(){ render(); });
  }

  var runBox = el("exrun");
  if (runBox){
    /* the chips re-render on every tap, so the typed 회차 lives in the draft */
    runBox.addEventListener("input", function(){
      var v = parseInt(runBox.value, 10);
      exdraft.run = (isNaN(v) || v < 1) ? null : v;
    });
    runBox.addEventListener("change", function(){ render(); });
  }

  var pf = el("packfile");
  if (pf){
    pf.addEventListener("change", function(){
      var file = pf.files && pf.files[0];
      if (!file) return;
      var fr = new FileReader();
      fr.onload = function(){
        var p;
        try { p = JSON.parse(fr.result); }
        catch(e){ toast("이 파일은 못 읽겠어"); pf.value=""; return; }
        if (!p || p.type!=="octopus-pack" || !p.items || !p.items.length){
          toast("옥토퍼스 팩 파일이 아닌 것 같아"); pf.value=""; return;
        }
        /* progress is filed under item id. If the incoming pack no longer
           carries some of those ids, the old records would point at the wrong
           pictures — so say it plainly and start that set over. */
        var have=Object.keys(G().sr.dex||{});
        var ids={}; p.items.forEach(function(it){ ids[it.id]=1; });
        var orphan=have.filter(function(x){ return !ids[x]; });
        if (orphan.length && !confirm("이 팩은 지금 기록과 그림이 달라.\n\n"
              + "이어서 쓰면 모은 그림이 엉뚱하게 표시돼서, 팩을 바꾸면 "
              + "이 세트 기록(" + have.length + "종)은 처음부터 다시 시작해.\n\n계속할까?")){
          pf.value=""; return;
        }
        try { localStorage.setItem(PACKKEY, JSON.stringify(p)); }
        catch(e){ toast("저장 공간이 모자라. 팩이 너무 커."); pf.value=""; return; }
        packInstall(p);
        if (orphan.length) G().sr={dex:{},hold:{},last:null};
        G().set="sr"; save(); pf.value=""; render();
        toast((p.name||"팩")+" 불러왔어 · "+p.items.length+"종");
      };
      fr.readAsText(file);
    });
  }

  var imp = el("impfile");
  if (imp){
    imp.addEventListener("change", function(){
      var file = imp.files && imp.files[0];
      if (!file) return;
      var fr = new FileReader();
      fr.onload = function(){
        var data;
        try { data = JSON.parse(fr.result); }
        catch(e){ toast("이 파일은 못 읽겠어"); imp.value = ""; return; }
        if (!data || typeof data !== "object" || !("tasks" in data) || !("log" in data)){
          toast("옥토퍼스 백업 파일이 아닌 것 같아"); imp.value = ""; return;
        }
        var nd = Object.keys(data.log || {}).length;
        var nt = (data.tasks || []).length;
        if (!confirm("백업을 불러오면 지금 이 기기의 기록은 덮어써져.\n\n"
                   + "불러올 내용: 퀘스트 " + nt + "개, 기록된 날 " + nd + "일\n\n계속할까?")){
          imp.value = ""; return;
        }
        var b = blank();
        for (var k in b) if (!(k in data)) data[k] = b[k];
        S = data;
        cdraftDate = null; timingId = null; editingId = null;
        save(); view = "day"; dayOffset = 0; weekOffset = 0; render();
        toast("복원했어 🐙");
      };
      fr.readAsText(file);
    });
  }

  var sdt = el("sdt"), swt = el("swt");
  if (sdt){
    sdt.addEventListener("change", function(){
      S.dailyTarget = Math.max(1, Math.min(30, +sdt.value || 7));
      S.weeklyTarget = S.dailyTarget * 5;
      save(); render2("settings");
    });
    swt.addEventListener("change", function(){
      S.weeklyTarget = Math.max(1, Math.min(200, +swt.value || 35)); save();
    });
  }
}

function doAct(act, n){
  if (act === "pull"){
    var r=doPull();
    if (!r){
      var D0=SET(curKey());
      toast(!D0 ? "팩을 먼저 불러와줘"
            : (poolOf(D0,curKey()).length ? "뽑기권이 없어 · "+costOf(curKey())+"분에 1장" : "다 모았어"));
      return;
    }
    mergePick=null; save(); render();
    if (S.pet!==false){
      if (!petValid(S.petPick)){ S.petPick={k:curKey(), id:r.id}; save(); }
      if (!petState.raf) petStart(); else petNext();
    }
    var nm=SET(curKey()).nm(r.id);
    toast(r.neu ? nm+" 획득!" : nm+" (중복)");
    return;
  }
  if (act === "setpk"){ G().set="pk"; mergePick=null; save(); render(); return; }
  if (act === "setsr"){ G().set="sr"; mergePick=null; save(); render(); return; }
  if (act === "packimp"){ var pf=el("packfile"); if (pf) pf.click(); return; }
  if (act === "packexp"){
    if (!PACK){ toast("내보낼 팩이 없어"); return; }
    try {
      var blob=new Blob([JSON.stringify(PACK)], {type:"application/json"});
      var url=URL.createObjectURL(blob), a=document.createElement("a");
      a.href=url; a.download="octopus-pack-"+(PACK.set||"set")+".json";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
      toast("팩 파일을 저장했어");
    } catch(e){ toast("내보내기가 안 됐어"); }
    return;
  }
  if (act === "dextoggle"){ dexOpen=!dexOpen; render(); return; }
  if (act === "petset"){
    var pk=n.dataset.k, pid=n.dataset.id, D2=SET(pk);
    if (!D2) return;
    if (D2.ids.indexOf(pid)<0 && D2.ids.indexOf(+pid)>=0) pid=+pid;
    S.petPick={k:pk, id:pid};
    S.pet=true; save();
    if (!petState.raf) petStart(); else petNext();
    render(); toast(D2.nm(pid)+" 산책 시작");
    return;
  }
  if (act === "pettoggle"){
    S.pet = (S.pet===false); save();
    if (S.pet) petStart(); else petStop();
    render(); toast(S.pet ? "산책 시작" : "산책 끔");
    return;
  }
  if (act === "mergeopen"){
    var mid=+n.dataset.id;
    if (DEX[mid].to.length===1){
      var r2=doMerge(mid, DEX[mid].to[0]);
      if (r2){ save(); render(); toast(DEX[r2.id].ko+"(으)로 진화!"); }
      return;
    }
    mergePick=mid; render(); return;
  }
  if (act === "mergego"){
    var r3=doMerge(+n.dataset.id, +n.dataset.to);
    mergePick=null;
    if (r3){ save(); render(); toast(DEX[r3.id].ko+"(으)로 진화!"); }
    return;
  }
  if (act === "mergecancel"){ mergePick=null; render(); return; }

  if (act === "toggle"){
    var id = n.dataset.id, ds = n.dataset.d;
    var ws = weekStart(today());
    var before = Math.round(weekPts(ws)/S.weeklyTarget*100);
    var wasOn = doneOn(ds, id);
    toggle(ds, id);
    if (wasOn) setMins(ds, id, 0);   /* unchecking drops its time too */
    timingId = null; save();
    var after = Math.round(weekPts(ws)/S.weeklyTarget*100);
    var dayNow = ptsOn(iso(today()));

    var todayTgt = targetFor(iso(today()));
    if (dayNow >= todayTgt && dayNow - PTS[taskById(id).tier] < todayTgt && ds === iso(today())){
      toast("오늘 할 일 다 했다 🐙");
    } else {
      S.rewards.forEach(function(r){
        if (before < r.pct && after >= r.pct){
          toast(r.pct + "% 도달 — " + (r.text || "보상 열림"));
        }
      });
    }
    render();
    return;
  }
  if (act === "edit"){
    var et = taskById(n.dataset.id);
    if (!et) return;
    editingId = et.id;
    edraft.tier = et.tier;
    edraft.days = (et.days || []).slice();
    render(); return;
  }
  if (act === "canceledit"){ editingId = null; render(); return; }
  if (act === "saveedit"){
    var st = taskById(n.dataset.id);
    if (!st){ editingId = null; render(); return; }
    var box = el("et"), val = box.value.trim();
    if (!val){ box.focus(); return; }
    if (st.repeat === "weekly" && !edraft.days.length){ toast("요일을 하나는 골라줘"); return; }
    st.title = val;
    st.tier  = edraft.tier;
    if (st.repeat === "weekly") st.days = edraft.days.slice().sort();
    editingId = null; save(); render(); return;
  }
  if (act === "timeopen"){
    timingId = (timingId === n.dataset.id) ? null : n.dataset.id;
    atId = null;
    render(); return;
  }
  if (act === "atopen"){
    atId = (atId === n.dataset.id) ? null : n.dataset.id;
    timingId = null;
    render(); return;
  }
  if (act === "atset"){ setAt(atId, n.dataset.v); return; }
  if (act === "atsetc"){
    var ab = el("atcustom");
    if (!ab || !ab.value){ ab && ab.focus(); return; }
    setAt(atId, ab.value); return;
  }
  if (act === "tset"){
    if (timingId){ setMins(n.dataset.d, timingId, +n.dataset.v); save(); }
    timingId = null; render(); return;
  }
  if (act === "tsetc"){
    var box = el("tcustom"), v = Math.max(0, Math.min(1440, parseInt(box.value,10) || 0));
    if (!v){ box.focus(); return; }
    if (timingId){ setMins(n.dataset.d, timingId, v); save(); }
    timingId = null; render(); return;
  }
  if (act === "del"){
    var tid = n.dataset.id;
    S.tasks = S.tasks.filter(function(t){ return t.id !== tid; });
    for (var d in S.log){ delete S.log[d][tid]; if (!Object.keys(S.log[d]).length) delete S.log[d]; }
    /* its minutes go with it, or they keep counting toward daily totals */
    for (var d2 in S.time){ delete S.time[d2][tid]; if (!Object.keys(S.time[d2]).length) delete S.time[d2]; }
    timingId = null; save(); render(); return;
  }
  if (act === "ctreset"){ S.condTarget = null; save(); render2("settings"); return; }
  if (act === "add"){
    var nt = el("nt"), title = nt.value.trim();
    if (!title){ nt.focus(); return; }
    /* added from 일간 → belongs to that date only; from 전체 → ledger item */
    var rep = (view === "day") ? "day" : draft.repeat;
    if (rep === "weekly" && !draft.days.length){ toast("요일을 하나는 골라줘"); return; }
    S.tasks.push({
      id: "t" + (S.tasks.length ? (Math.max.apply(null, S.tasks.map(function(t){ return +t.id.slice(1)||0; }))+1) : 1),
      title: title, tier: draft.tier,
      repeat: rep,
      date: rep === "day" ? iso(cursorDay()) : undefined,
      days: rep === "weekly" ? draft.days.slice().sort() : []
    });
    nt.value = ""; draft.days = [];
    save(); render();
    el("nt") && el("nt").focus();
    return;
  }
  if (act === "claim"){
    S.rewards[+n.dataset.i].claimed = true; save(); render();
    toast("받았어 🐙"); return;
  }
  if (act === "copy"){
    var url = location.origin + location.pathname + "#" + encode(S);
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        function(){ toast("링크 복사됨 — 다른 기기에서 열면 그대로 복원돼"); },
        function(){ fallbackCopy(url); });
    } else fallbackCopy(url);
    return;
  }
  /* condition form — nothing is written until 제출 */
  if (act === "score"){
    var val = +n.dataset.s;
    cdraft.score = (cdraft.score === val) ? 0 : val;
    render(); return;
  }
  if (act === "submitcond"){
    var cds = iso(cursorDay());
    setCond(cds, "sleep", cdraft.sleep || null);
    setCond(cds, "wake",  cdraft.wake  || null);
    setCond(cds, "score", cdraft.score || null);
    editingCond = false; save();
    view = "day"; render(); window.scrollTo(0,0);
    toast("기록했어 🐙");
    return;
  }
  if (act === "editcond"){ editingCond = true; render(); return; }
  if (act === "cancelcond"){
    var c0 = condOn(iso(cursorDay())) || {};
    cdraft = { sleep:c0.sleep||"", wake:c0.wake||"", score:c0.score||0 };
    editingCond = false; render(); return;
  }
  if (act === "delcond"){
    delete S.cond[iso(cursorDay())];
    cdraft = { sleep:"", wake:"", score:0 };
    editingCond = false; save(); render(); return;
  }
  if (act === "prevday"){ if (dayOffset > -3650){ dayOffset--; timingId = atId = null; render(); } return; }
  if (act === "nextday"){ if (dayOffset <  365){ dayOffset++; timingId = atId = null; render(); } return; }
  if (act === "jumptoday"){ dayOffset = 0; render(); return; }
  if (act === "prevweek"){ if (weekOffset > -520){ weekOffset--; render(); } return; }
  if (act === "nextweek"){ if (weekOffset <   52){ weekOffset++; render(); } return; }
  if (act === "jumpweek"){ weekOffset = 0; render(); return; }
  if (act === "expjson"){
    exportBoard(); render2("settings");
    toast("백업 파일 저장했어 🐙");
    return;
  }
  if (act === "bkyes"){
    exportBoard();
    S.backupAsked = monthKey(today()); save(); render();
    toast("백업 파일 저장했어 🐙");
    return;
  }
  if (act === "bkno"){
    S.backupAsked = monthKey(today()); save(); render();
    return;
  }
  if (act === "impjson"){ var f = el("impfile"); if (f) f.click(); return; }
  if (act === "settings"){ render2("settings"); return; }
  if (act === "backweek"){ view = "week"; render(); return; }
  if (act === "reset"){
    if (confirm("퀘스트·기록·보고서를 전부 지울까? 되돌릴 수 없어.")){
      S = blank(); S.seenWeek = weekKey(weekStart(today()));
      try { history.replaceState(null,"", location.pathname); } catch(e){}
      save(); view = "day"; render();
    }
    return;
  }
  if (act === "amode"){
    aptMode = n.dataset.x; exEditId = null; aEditId = null;
    render(); window.scrollTo(0,0); return;
  }
  /* 시험 기록 고치기 */
  if (act === "exedit"){ exEditId = n.dataset.id; aEditId = null; render(); return; }
  if (act === "exeditcancel"){ exEditId = null; render(); return; }
  if (act === "exeditsave"){
    var er = (S.aptex || []).filter(function(r){ return r.id === n.dataset.id; })[0];
    if (!er){ exEditId = null; render(); return; }
    var esc_ = exSecOf(er.exam, er.sec);
    var etot = esc_ ? esc_.n : (er.ok + er.wr + er.sk);
    var eok = parseInt(el("exeok").value, 10);
    var ewr = parseInt(el("exewr").value, 10);
    var esk = parseInt(el("exesk").value, 10);
    if (isNaN(eok) || isNaN(ewr) || isNaN(esk) || eok < 0 || ewr < 0 || esk < 0){
      toast("숫자를 다 채워줘"); return;
    }
    if (eok + ewr + esk !== etot){
      toast("합이 " + (eok+ewr+esk) + "이야 · " + er.sec + "는 " + etot + "문항");
      return;
    }
    var erun = parseInt(el("exerun").value, 10);
    if (isNaN(erun) || erun < 1){ toast("회차는 1 이상이어야 해"); return; }
    er.ok = eok; er.wr = ewr; er.sk = esk;
    var runMoved = (er.run||1) !== erun;
    var edv = el("exedate").value;
    if (/^\d{4}-\d{2}-\d{2}$/.test(edv)) er.ds = edv;
    er.run = erun;
    exEditId = null; save(); render();
    toast(runMoved ? erun + "회차로 옮겼어 🐙" : "고쳤어 🐙");
    return;
  }
  if (act === "exrunauto"){ exdraft.run = null; render(); return; }
  if (act === "aprunauto"){ adraft.run = null; render(); return; }
  if (act === "aprenum"){
    var pr = aptRenumber(adraft.exam);
    if (!pr.moved){ toast("이미 1회차부터 빈틈없이 붙어 있어"); return; }
    save(); render(); toast(pr.moved + "건을 당겼어 🐙");
    return;
  }
  if (act === "lgtog"){
    var lk = serKey(n.dataset.x, n.dataset.n);
    if (hidSeries[lk]) delete hidSeries[lk]; else hidSeries[lk] = 1;
    render(); return;
  }
  if (act === "exrenum"){
    var rr = exRenumber(adraft.exam);
    if (!rr.moved){ toast("이미 1회차부터 빈틈없이 붙어 있어"); return; }
    save(); render();
    toast(rr.moved + "건을 당겼어 · 1~" + rr.runs + "회차 🐙");
    return;
  }
  /* 연습 기록 고치기 */
  if (act === "aedit"){ aEditId = n.dataset.id; exEditId = null; render(); return; }
  if (act === "aeditcancel"){ aEditId = null; render(); return; }
  if (act === "aedittod"){
    var tr = (S.aptit || []).filter(function(r){ return r.id === n.dataset.id; })[0];
    if (tr){ tr.tod = n.dataset.x; save(); render(); }
    return;
  }
  if (act === "aeditsave"){
    var ar = (S.aptit || []).filter(function(r){ return r.id === n.dataset.id; })[0];
    if (!ar){ aEditId = null; render(); return; }
    var vn = parseInt(el("aeon").value, 10);
    var vok = parseInt(el("aeok").value, 10);
    if (!vn || vn < 1){ el("aeon").focus(); toast("푼 문항을 적어줘"); return; }
    if (isNaN(vok) || vok < 0){ el("aeok").focus(); toast("맞은 개수를 적어줘"); return; }
    if (vok > vn){ toast("맞은 개수가 푼 문항보다 많아"); return; }
    var vmin = parseInt(el("aemin").value, 10) || 0;
    var vsec = parseInt(el("aesec").value, 10) || 0;
    var vrun = parseInt(el("aerun").value, 10);
    if (isNaN(vrun) || vrun < 1){ toast("회차는 1 이상이어야 해"); return; }
    var vdate = el("aedate").value;
    if (/^\d{4}-\d{2}-\d{2}$/.test(vdate)) ar.ds = vdate;
    ar.n = vn; ar.ok = vok; ar.sec = vmin*60 + vsec;
    var vMoved = (ar.run||1) !== vrun;
    ar.run = vrun;
    aEditId = null; save(); render();
    toast(vMoved ? vrun + "회차로 옮겼어 🐙" : "고쳤어 🐙");
    return;
  }
  if (act === "exsec"){
    var sv = n.dataset.t;
    exdraft.sec = (exdraft.sec === sv) ? null : sv;
    render(); return;
  }
  if (act === "exadd"){
    if (!exdraft.sec){ toast("영역을 골라줘"); return; }
    var scd = exSecOf(adraft.exam, exdraft.sec);
    var xok = parseInt(el("exok").value, 10);
    var xwr = parseInt(el("exwr").value, 10);
    var xskRaw = el("exsk").value.trim();
    if (isNaN(xok) || xok < 0){ el("exok").focus(); toast("맞은 개수를 적어줘"); return; }
    if (isNaN(xwr) || xwr < 0){ el("exwr").focus(); toast("틀린 개수를 적어줘"); return; }
    /* leaving 못 푼 blank is the common case — the rest of the section is what
       you never reached, and the app can work that out itself */
    var xsk = xskRaw === "" ? (scd.n - xok - xwr) : parseInt(xskRaw, 10);
    if (isNaN(xsk) || xsk < 0){ toast("못 푼 개수가 이상해"); return; }
    if (xok + xwr + xsk !== scd.n){
      toast("합이 " + (xok+xwr+xsk) + "이야 · " + scd.s + "는 " + scd.n + "문항");
      return;
    }
    var xid = 1;
    (S.aptex || []).forEach(function(r){ var k = +String(r.id).slice(1) || 0; if (k >= xid) xid = k+1; });
    var xrun = exdraft.run !== null ? exdraft.run : exNextRun(adraft.exam, exdraft.sec);
    S.aptex.push({ id:"x"+xid, ds:iso(today()), exam:adraft.exam, sec:exdraft.sec,
                   ok:xok, wr:xwr, sk:xsk, run:xrun });
    exdraft.run = null;                     /* 한 건 넣고 나면 다시 자동으로 */
    save(); render();
    toast(xrun + "회차 " + exdraft.sec + " " + pctText(exAcc({ok:xok,wr:xwr})) + " · 푼 양 "
          + pctText((xok+xwr)/scd.n) + " 🐙");
    return;
  }
  if (act === "exdel"){
    if (!confirm("이 시험 기록을 지울까?")) return;
    S.aptex = (S.aptex || []).filter(function(r){ return r.id !== n.dataset.id; });
    exEditId = null; save(); render(); return;
  }
  if (act === "aexam"){ adraft.exam = n.dataset.x; adraft.type = null; render(); return; }
  if (act === "atype"){
    var tv = n.dataset.t;
    adraft.type = (adraft.type === tv) ? null : tv;
    render(); return;
  }
  if (act === "atod"){ adraft.tod = n.dataset.x; render(); return; }
  if (act === "aadd"){
    if (!adraft.type){ toast("유형을 하나 골라줘"); return; }
    var an = parseInt(el("an").value, 10);
    var aok = parseInt(el("aok").value, 10);
    if (!an || an < 1){ el("an").focus(); toast("몇 문제 풀었는지 적어줘"); return; }
    if (isNaN(aok) || aok < 0){ el("aok").focus(); toast("몇 개 맞았는지 적어줘"); return; }
    if (aok > an){ toast("맞은 개수가 푼 문항보다 많아"); return; }
    var amin = parseInt(el("amin").value, 10) || 0;
    var asec = parseInt(el("asec").value, 10) || 0;
    var nid = 1;
    (S.aptit || []).forEach(function(r){ var k = +String(r.id).slice(1) || 0; if (k >= nid) nid = k+1; });
    var arun = adraft.run !== null ? adraft.run : aptNextRun(adraft.exam, adraft.type);
    S.aptit.push({ id:"a"+nid, ds:iso(today()), exam:adraft.exam, type:adraft.type,
                   n:an, ok:aok, sec:amin*60+asec, tod:adraft.tod, run:arun });
    adraft.run = null;
    save(); render();
    toast(adraft.type + " " + arun + "회차 · " + Math.round(aok/an*100) + "% 🐙");
    return;
  }
  if (act === "adel"){
    /* records are the only thing here, so deleting one asks first */
    if (!confirm("이 기록을 지울까?")) return;
    S.aptit = (S.aptit || []).filter(function(r){ return r.id !== n.dataset.id; });
    aEditId = null; save(); render(); return;
  }
  if (act === "aptin"){
    el("view").innerHTML = viewAptIn(); wire(); window.scrollTo(0,0); return;
  }
  if (act === "closeaptin"){ view = "apt"; render(); window.scrollTo(0,0); return; }
  if (act === "insights"){
    el("view").innerHTML = viewInsights(); wire(); window.scrollTo(0,0); return;
  }
  if (act === "closeinsights"){ view = "cond"; render(); window.scrollTo(0,0); return; }
  if (act === "compare"){
    el("view").innerHTML = viewCompare(cursorDay());
    wire(); window.scrollTo(0,0); return;
  }
  if (act === "closecompare"){ view = "day"; render(); window.scrollTo(0,0); return; }
  if (act === "previewrep"){
    var pws = cursorWeek();
    var pkey = weekKey(addDays(pws,-7)), before = null;
    S.reports.forEach(function(x){ if (x.key === pkey) before = x; });
    el("view").innerHTML = viewReport(buildReport(pws), before, true);
    wire(); window.scrollTo(0,0); return;
  }
  if (act === "openrep"){
    var r = S.reports[+n.dataset.i];
    var prev = S.reports[+n.dataset.i - 1] || null;
    el("view").innerHTML = viewReport(r, prev); wire(); window.scrollTo(0,0); return;
  }
  if (act === "closerep"){ pendingReport = null; view = "week"; render(); window.scrollTo(0,0); return; }
}

function fallbackCopy(url){
  var ta = document.createElement("textarea");
  ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("링크 복사됨"); }
  catch(e){ toast("복사가 안 돼 — 주소창을 직접 복사해줘"); }
  document.body.removeChild(ta);
}

function render2(what){
  if (what === "settings"){ el("view").innerHTML = viewSettings(); wire(); }
}

/* ───────── boot ───────── */
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click", function(){
    var prev = view;
    view = b.dataset.v; pendingReport = null; editingId = null; timingId = null;
    /* 컨디션 ↔ 일간 share a date, so keep the cursor when moving between them */
    var dayPair = (prev === "cond" || prev === "day") && (view === "cond" || view === "day");
    if (!dayPair) dayOffset = 0;
    weekOffset = 0;
    render();
  });
});

load();
checkRollover();
paintWarn();

if (pendingReport){
  var idx = S.reports.indexOf(pendingReport);
  el("view").innerHTML = viewReport(pendingReport, S.reports[idx-1] || null);
  wire();
} else {
  render();
}

(function(){
  var box=el("pet");
  if(box){
    box.addEventListener("click", function(){
      if(petState.cur) toast(SET(petState.cur.k).nm(petState.cur.id));
    });
  }
  petStart();
})();
</script>

</body>
</html>
