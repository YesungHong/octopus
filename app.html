<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Octopus">
<meta name="theme-color" content="#E7EDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071319" media="(prefers-color-scheme: dark)">
<title>Octopus Quest Board</title>
</head>
<body>
<style>
/* ── tokens: light (bare :root = complete palette) ────────────── */
:root{
  --bg:#E7EDEB;
  --surface:#F6FAF9;
  --surface-2:#DCE5E3;
  --sunk:#CFDAD8;
  --ink:#0E1F26;
  --ink-2:#4B646C;
  --ink-3:#7C939A;
  --line:#C8D4D2;
  --line-soft:#DAE3E1;
  --accent:#B06A16;
  --accent-ink:#8A520C;
  --accent-soft:rgba(176,106,22,.13);
  --good:#2C7A5E;
  --good-soft:rgba(44,122,94,.13);
  --t1:#7C939A;
  --t2:#3F7F8C;
  --t3:#B06A16;
  --shadow:0 1px 2px rgba(14,31,38,.07), 0 6px 18px rgba(14,31,38,.05);
  --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",Roboto,sans-serif;
  --font-num:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#071319;
    --surface:#0E2029;
    --surface-2:#152E38;
    --sunk:#0A1A21;
    --ink:#DFEAE9;
    --ink-2:#9BB1B6;
    --ink-3:#6A828A;
    --line:#1B3742;
    --line-soft:#132A34;
    --accent:#E0A050;
    --accent-ink:#F0BC77;
    --accent-soft:rgba(224,160,80,.16);
    --good:#4FA383;
    --good-soft:rgba(79,163,131,.16);
    --t1:#6A828A;
    --t2:#5AA2B0;
    --t3:#E0A050;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --bg:#071319;
  --surface:#0E2029;
  --surface-2:#152E38;
  --sunk:#0A1A21;
  --ink:#DFEAE9;
  --ink-2:#9BB1B6;
  --ink-3:#6A828A;
  --line:#1B3742;
  --line-soft:#132A34;
  --accent:#E0A050;
  --accent-ink:#F0BC77;
  --accent-soft:rgba(224,160,80,.16);
  --good:#4FA383;
  --good-soft:rgba(79,163,131,.16);
  --t1:#6A828A;
  --t2:#5AA2B0;
  --t3:#E0A050;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-ui);
  font-size:15px; line-height:1.5;
  -webkit-text-size-adjust:100%;
  padding:0 0 64px;
}
.wrap{max-width:620px;margin:0 auto;padding:20px 16px 0}

/* ── masthead ─────────────────────────────────────────────────── */
.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.mast h1{
  font-size:14px;font-weight:650;letter-spacing:.14em;text-transform:uppercase;
  margin:0;color:var(--ink-2);
}
.mast h1 span{color:var(--accent)}
.mast .per{font-family:var(--font-num);font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* ── tabs ─────────────────────────────────────────────────────── */
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--sunk);
  padding:3px;border-radius:9px;margin-bottom:18px}
.tabs button{
  appearance:none;border:0;background:transparent;color:var(--ink-3);
  font-family:inherit;font-size:13.5px;font-weight:600;letter-spacing:.02em;
  padding:8px 4px;border-radius:7px;cursor:pointer;transition:background .15s,color .15s;
}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── card ─────────────────────────────────────────────────────── */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card > h2{
  font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;
  color:var(--ink-3);margin:0 0 12px;
}
.card > h2.mt{margin-top:22px}

/* ── date navigator ───────────────────────────────────────────── */
.datenav{display:flex;align-items:center;gap:6px;margin:-2px 0 12px}
.datenav button{appearance:none;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-2);font:inherit;font-size:19px;line-height:1;width:38px;height:36px;
  border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.datenav button:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.datenav button:disabled{opacity:.28;cursor:default}
.datenav button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.datenav .dlabel{flex:1;text-align:center;font-family:var(--font-num);font-size:15px;
  font-weight:600;font-variant-numeric:tabular-nums;display:flex;align-items:center;
  justify-content:center;gap:6px}
.datenav .dlabel span{color:var(--ink-3);font-weight:400}
.datenav .dlabel b{font-family:var(--font-ui);font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--accent-ink);background:var(--accent-soft);padding:3px 7px;border-radius:5px}
.datenav .dlabel b.soon{color:var(--t2);background:color-mix(in srgb,var(--t2) 15%,transparent)}
.jump em{font-style:normal;font-family:var(--font-num);opacity:.7;margin-left:3px}
.jump{appearance:none;width:100%;border:1px dashed var(--line);background:transparent;
  color:var(--ink-3);font:inherit;font-size:12.5px;padding:8px;border-radius:8px;
  cursor:pointer;margin-bottom:12px}
.jump:hover{color:var(--ink);border-color:var(--ink-3)}
.jump:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* ── the readout (big number) ─────────────────────────────────── */
.readout{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:14px}
.readout .big{font-family:var(--font-num);font-size:44px;line-height:.92;font-weight:600;
  letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--ink)}
.readout .big em{font-style:normal;font-size:20px;color:var(--ink-3);margin-left:2px}
.readout .side{text-align:right;font-family:var(--font-num);font-size:12px;color:var(--ink-3);
  font-variant-numeric:tabular-nums;line-height:1.6}
.readout .side b{color:var(--ink-2);font-weight:600}

/* ── daily track: grid of target cells ────────────────────────── */
.track{display:grid;gap:3px;height:34px;margin-bottom:6px}
.cell{background:var(--sunk);border-radius:3px}
.blk{border-radius:3px;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-num);font-size:10px;font-weight:700;color:var(--bg);
  animation:pop .28s cubic-bezier(.2,.9,.3,1.4)}
.blk.t1{background:var(--t1)} .blk.t2{background:var(--t2)} .blk.t3{background:var(--t3)}
@keyframes pop{from{transform:scaleX(.3);opacity:0}to{transform:scaleX(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.blk{animation:none}}
.track-legend{display:flex;justify-content:space-between;font-family:var(--font-num);
  font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.bonus{margin-top:8px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--accent-ink)}
.bonus .bar{flex:1;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}
.bonus .bar i{display:block;height:100%;background:var(--accent);border-radius:3px}

/* ── done banner ──────────────────────────────────────────────── */
.done-banner{
  margin:14px 0 2px;padding:13px 14px;border-radius:10px;
  background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 30%,transparent);
  display:flex;align-items:center;gap:10px;
}
.done-banner b{color:var(--good);font-size:14.5px;font-weight:650}
.done-banner span{color:var(--ink-2);font-size:12.5px}

/* ── weekly: day columns ──────────────────────────────────────── */
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:96px;margin-bottom:7px}
.day{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:4px;position:relative}
.day .stack{background:var(--surface-2);border-radius:3px 3px 2px 2px;min-height:3px;
  transition:height .3s ease;position:relative;overflow:hidden}
.day.hit .stack{background:var(--good)}
.day.some .stack{background:var(--t2)}
.day.today .stack{outline:1.5px solid var(--accent);outline-offset:1px}
.day .pt{font-family:var(--font-num);font-size:10px;text-align:center;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.day.hit .pt,.day.some .pt{color:var(--ink-2)}
.dow{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;font-size:10.5px;text-align:center;
  color:var(--ink-3);letter-spacing:.02em}
.dow span.now{color:var(--accent);font-weight:700}
.tgtline{border-top:1px dashed var(--line);position:relative;margin:0 0 -1px}

/* ── reward ladder ────────────────────────────────────────────── */
.rail{position:relative;height:9px;background:var(--sunk);border-radius:5px;margin:18px 0 10px}
.rail i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:5px;transition:width .35s ease}
.rail u{position:absolute;top:-4px;width:1.5px;height:17px;background:var(--line);text-decoration:none}
.rail u.on{background:var(--accent-ink)}
.ladder{display:flex;flex-direction:column;gap:1px}
.rw{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;font-size:13.5px}
.rw .pct{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3);width:36px;
  font-variant-numeric:tabular-nums;flex:none}
.rw input{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);font:inherit;padding:2px 0}
.rw input::placeholder{color:var(--ink-3);font-style:italic}
.rw input:focus{outline:0;border-bottom:1px solid var(--accent)}
.rw .st{font-family:var(--font-num);font-size:11px;color:var(--ink-3);flex:none;
  font-variant-numeric:tabular-nums}
.rw.locked{opacity:.55}
.rw.next{background:var(--accent-soft)}
.rw.next .pct{color:var(--accent-ink)}
.rw.got{background:var(--good-soft)}
.rw.got .pct{color:var(--good)}
.rw button{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--bg);
  font:inherit;font-size:11.5px;font-weight:650;padding:4px 10px;border-radius:6px;cursor:pointer;flex:none}
.rw button:focus-visible{outline:2px solid var(--accent-ink);outline-offset:2px}

/* ── task rows ────────────────────────────────────────────────── */
.list{display:flex;flex-direction:column;gap:1px}
.row{display:flex;align-items:center;gap:11px;padding:10px 8px;border-radius:8px;
  cursor:pointer;transition:background .12s;-webkit-tap-highlight-color:transparent}
.row:hover{background:var(--surface-2)}
.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.box{width:19px;height:19px;border-radius:5px;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;transition:.14s}
.row.on .box{background:var(--good);border-color:var(--good)}
.box svg{width:11px;height:11px;stroke:var(--bg);stroke-width:2.6;fill:none;
  stroke-linecap:round;stroke-linejoin:round;opacity:0}
.row.on .box svg{opacity:1}
.row .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.row.on .ttl{color:var(--ink-3);text-decoration:line-through;text-decoration-thickness:1px}
.tier{font-family:var(--font-num);font-size:10px;font-weight:700;letter-spacing:.04em;
  padding:2px 6px;border-radius:4px;flex:none}
.tier.t1{color:var(--t1);background:color-mix(in srgb,var(--t1) 15%,transparent)}
.tier.t2{color:var(--t2);background:color-mix(in srgb,var(--t2) 15%,transparent)}
.tier.t3{color:var(--t3);background:color-mix(in srgb,var(--t3) 18%,transparent)}
.dayspec{font-family:var(--font-num);font-size:10.5px;color:var(--ink-3);flex:none;letter-spacing:.06em}
/* touch devices have no hover, so row buttons must stay visible there */
.del,.edit{appearance:none;border:0;background:transparent;color:var(--ink-3);cursor:pointer;
  line-height:1;padding:5px 7px;border-radius:5px;flex:none;opacity:.5;
  display:flex;align-items:center}
.del{font-size:17px}
.edit svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){ .del,.edit{opacity:0} }
.row:hover .del,.row:hover .edit,.del:focus-visible,.edit:focus-visible{opacity:1}
.del:hover,.edit:hover{color:var(--accent-ink);background:var(--surface-2)}

/* ── inline edit ──────────────────────────────────────────────── */
.editrow{display:flex;flex-direction:column;gap:9px;padding:12px 10px;margin:2px 0;
  background:var(--surface-2);border:1px solid var(--accent);border-radius:10px}
.editrow input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;font-size:14px}
.editrow input[type=text]:focus{outline:0;border-color:var(--accent)}
.editbtns{display:flex;gap:7px}
.editbtns button{flex:1;appearance:none;border:0;font:inherit;font-size:13px;font-weight:650;
  padding:10px;border-radius:8px;cursor:pointer}
.editbtns .ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.editbtns .ghost:hover{background:var(--bg)}
.editbtns .save{background:var(--ink);color:var(--bg)}
.editbtns button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.del:hover{color:var(--accent-ink);background:var(--surface-2)}
.rate{font-family:var(--font-num);font-size:11px;color:var(--ink-3);flex:none;
  font-variant-numeric:tabular-nums}

.empty{padding:22px 8px;text-align:center;color:var(--ink-3);font-size:13px;line-height:1.7}


/* ── add form ─────────────────────────────────────────────────── */
.add{margin-top:12px;padding-top:14px;border-top:1px solid var(--line-soft);
  display:flex;flex-direction:column;gap:10px}
.add input[type=text]{width:100%;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit;font-size:14px}
.add input[type=text]:focus{outline:0;border-color:var(--accent)}
.seg{display:flex;gap:4px}
.seg button{flex:1;appearance:none;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:8px 4px;
  border-radius:7px;cursor:pointer;transition:.13s}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.dowpick{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dowpick button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-3);
  font:inherit;font-size:12px;font-weight:600;padding:8px 0;border-radius:7px;cursor:pointer}
.dowpick button[aria-pressed="true"]{background:var(--t2);border-color:var(--t2);color:var(--bg)}
.dowpick button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.addbtn{appearance:none;border:0;background:var(--ink);color:var(--bg);font:inherit;
  font-size:13.5px;font-weight:650;padding:11px;border-radius:8px;cursor:pointer}
.addbtn:disabled{opacity:.35;cursor:default}
.addbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── settings / footer ────────────────────────────────────────── */
.foot{display:flex;gap:8px;margin-top:4px}
.foot button{flex:1;appearance:none;border:1px solid var(--line);background:var(--surface);
  color:var(--ink-2);font:inherit;font-size:12.5px;font-weight:600;padding:10px;
  border-radius:8px;cursor:pointer}
.foot button:hover{background:var(--surface-2)}
.foot button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;
  font-size:13.5px;border-bottom:1px solid var(--line-soft)}
.setrow:last-child{border-bottom:0}
.setrow input{width:66px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
  padding:7px 9px;color:var(--ink);font-family:var(--font-num);font-size:14px;text-align:center}
.setrow input:focus{outline:0;border-color:var(--accent)}
.setrow small{display:block;color:var(--ink-3);font-size:11.5px;margin-top:2px}

/* ── condition tab ────────────────────────────────────────────── */
.timegrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.timegrid label{display:flex;flex-direction:column;gap:6px;font-size:11.5px;
  letter-spacing:.06em;color:var(--ink-3)}
.timegrid input{background:var(--bg);border:1px solid var(--line);border-radius:9px;
  padding:11px 12px;color:var(--ink);font-family:var(--font-num);font-size:17px;
  font-variant-numeric:tabular-nums;width:100%;min-height:46px}
.timegrid input:focus{outline:0;border-color:var(--accent)}

.sleepbig{margin-top:14px;padding:14px;background:var(--sunk);border-radius:10px;
  display:flex;align-items:baseline;justify-content:center;gap:5px}
.sleepbig b{font-family:var(--font-num);font-size:34px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--ink)}
.sleepbig em{font-style:normal;font-size:14px;color:var(--ink-3)}
.sleepbig .none{font-size:12.5px;color:var(--ink-3)}

.condpick{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.condpick button{appearance:none;border:1px solid var(--line);background:var(--bg);
  color:var(--ink-3);font-family:inherit;font-size:11px;font-weight:600;
  padding:10px 2px 9px;border-radius:9px;cursor:pointer;transition:.13s;
  display:flex;flex-direction:column;align-items:center;gap:6px;
  -webkit-tap-highlight-color:transparent}
.condpick button i{width:11px;height:11px;border-radius:50%;display:block}
.condpick i.c1{background:var(--t1)} .condpick i.c2{background:#8E9AA0}
.condpick i.c3{background:var(--t2)} .condpick i.c4{background:#4E9A7E}
.condpick i.c5{background:var(--good)}
.condpick button:hover{border-color:var(--ink-3);color:var(--ink)}
.condpick button[aria-pressed="true"]{background:var(--surface-2);border-color:var(--accent);
  color:var(--ink);box-shadow:0 0 0 2px var(--accent-soft)}
.condpick button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.drep{display:flex;flex-direction:column;gap:1px}
.drow{display:flex;align-items:baseline;gap:12px;padding:10px 2px;
  border-bottom:1px solid var(--line-soft)}
.drow:last-child{border-bottom:0}
.drow .k{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);
  width:62px;flex:none}
.drow .v{font-family:var(--font-num);font-size:15px;font-variant-numeric:tabular-nums}
.drow .v s{text-decoration:none;color:var(--ink-3);font-size:11.5px;margin-left:6px}
.drow.good .v{color:var(--good);font-weight:600}

.submitrow{display:flex;gap:8px;margin-top:16px}
.submitrow button{flex:1;appearance:none;border:0;font:inherit;font-size:14px;font-weight:650;
  padding:13px;border-radius:9px;cursor:pointer;transition:.13s}
.submitrow .submit{background:var(--ink);color:var(--bg)}
.submitrow .submit:disabled{opacity:.3;cursor:default}
.submitrow .ghost{background:transparent;border:1px solid var(--line);color:var(--ink-2)}
.submitrow .ghost:hover{background:var(--surface-2);color:var(--ink)}
.submitrow .ghost.danger{color:var(--ink-3)}
.submitrow .ghost.danger:hover{color:var(--accent-ink);border-color:var(--accent)}
.submitrow button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{margin-top:9px;text-align:center;font-size:12px;color:var(--ink-3)}

/* ── sleep vs output, in the weekly report ────────────────────── */
.cmp{display:flex;flex-direction:column;gap:1px;margin:12px 0 4px}
.cmpline{display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:11px 12px;background:var(--sunk);border-radius:8px;font-size:13px;color:var(--ink-2)}
.cmpline b{font-family:var(--font-num);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.cmpline:first-child b{color:var(--good)}

.slist{display:flex;flex-direction:column;gap:1px;margin-top:12px}
.sline{display:grid;grid-template-columns:28px 1fr 1fr 56px;align-items:center;gap:8px;
  padding:8px 2px;border-bottom:1px solid var(--line-soft);font-size:12.5px}
.sline:last-child{border-bottom:0}
.sline .d{color:var(--ink-3);font-weight:600}
.sline .s,.sline .p{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.sline .p{text-align:right;color:var(--ink-2)}
.sline .c{color:var(--ink-3)}

/* ── report ───────────────────────────────────────────────────── */
.rep-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:16px}
.rep-h .t{font-size:16px;font-weight:650}
.rep-h .t i{font-style:normal;font-size:10px;font-weight:700;letter-spacing:.1em;
  color:var(--t2);background:color-mix(in srgb,var(--t2) 15%,transparent);
  padding:3px 7px;border-radius:5px;vertical-align:2px;margin-left:4px}
.rep-h .d{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line-soft);
  border:1px solid var(--line-soft);border-radius:9px;overflow:hidden;margin:16px 0}
.stat{background:var(--surface);padding:11px 12px}
.stat .k{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:3px}
.stat .v{font-family:var(--font-num);font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.stat .v small{font-size:11.5px;color:var(--ink-3);font-weight:400;margin-left:3px}
.note{font-size:13px;color:var(--ink-2);line-height:1.65;padding:12px 13px;background:var(--sunk);
  border-radius:9px;margin-top:14px}
.arch{display:flex;align-items:center;gap:10px;padding:9px 8px;border-radius:7px;cursor:pointer;font-size:13px}
.arch:hover{background:var(--surface-2)}
.arch .w{font-family:var(--font-num);font-size:11.5px;color:var(--ink-3);flex:none;width:44px}
.arch .p{margin-left:auto;font-family:var(--font-num);font-size:12.5px;color:var(--ink-2);
  font-variant-numeric:tabular-nums}

/* ── toast ────────────────────────────────────────────────────── */
#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);
  background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;
  font-size:13.5px;font-weight:600;z-index:60;transition:transform .3s cubic-bezier(.2,.9,.3,1.2);
  max-width:88vw;text-align:center;box-shadow:0 8px 26px rgba(0,0,0,.28)}
#toast.up{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

.warn{background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-ink);
  padding:11px 13px;border-radius:9px;font-size:12.5px;line-height:1.6;margin-bottom:14px}
.hide{display:none !important}
</style>

<div class="wrap">
  <div class="mast">
    <h1><span>🐙</span> Quest Board</h1>
    <div class="per" id="period"></div>
  </div>

  <div id="storewarn" class="warn hide"></div>

  <div class="tabs" role="tablist">
    <button role="tab" data-v="cond" aria-selected="false">컨디션</button>
    <button role="tab" data-v="day"  aria-selected="true">일간</button>
    <button role="tab" data-v="week" aria-selected="false">주간</button>
    <button role="tab" data-v="all"  aria-selected="false">전체</button>
  </div>

  <div id="view"></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* ───────── constants ───────── */
var PTS   = {1:1, 2:2, 3:3};
var TNAME = {1:"EASY", 2:"MED", 3:"HARD"};
var DOW   = ["일","월","화","수","목","금","토"];
var KEY   = "octopus.board.v1";
var W33   = Date.UTC(2026,7,9);          /* 2026-08-09 (Sun) = week 33, user's own convention */

/* ───────── date helpers (UTC-free, local calendar) ───────── */
function iso(d){
  return d.getFullYear() + "-" +
         String(d.getMonth()+1).padStart(2,"0") + "-" +
         String(d.getDate()).padStart(2,"0");
}
function parseISO(s){ var p = s.split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
function today(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function addDays(d,n){ var x = new Date(d.getTime()); x.setDate(x.getDate()+n); return x; }
function weekStart(d){ return addDays(d, -d.getDay()); }          /* Sunday start */
function weekNo(ws){
  var diff = Date.UTC(ws.getFullYear(), ws.getMonth(), ws.getDate()) - W33;
  return 33 + Math.round(diff / 604800000);
}
function weekKey(ws){ return ws.getFullYear() + "-W" + weekNo(ws); }
function md(d){ return (d.getMonth()+1) + "/" + d.getDate(); }

/* ───────── state ───────── */
var S, storageOK = true;

function blank(){
  return {
    v: 1,
    dailyTarget: 7,
    weeklyTarget: 35,
    tasks: [],
    log: {},                                     /* "YYYY-MM-DD": { taskId: true } */
    cond: {},                                    /* "YYYY-MM-DD": {sleep:"23:30", wake:"07:10", score:1..5}
                                                    filed under the date you WOKE UP */
    rewards: [ {pct:25,text:"",claimed:false},
               {pct:50,text:"",claimed:false},
               {pct:75,text:"",claimed:false},
               {pct:100,text:"",claimed:false} ],
    reports: [],
    seenWeek: null
  };
}

function encode(o){
  var bytes = new TextEncoder().encode(JSON.stringify(o));
  var bin = "";
  for (var i=0;i<bytes.length;i++) bin += String.fromCharCode(bytes[i]);
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function decode(s){
  var b = s.replace(/-/g,"+").replace(/_/g,"/");
  while (b.length % 4) b += "=";
  var bin = atob(b), bytes = new Uint8Array(bin.length);
  for (var i=0;i<bin.length;i++) bytes[i] = bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(bytes));
}

function load(){
  var fromHash = null;
  if (location.hash.length > 3){
    try { fromHash = decode(location.hash.slice(1)); } catch(e){ fromHash = null; }
  }
  var stored = null;
  try { var raw = localStorage.getItem(KEY); if (raw) stored = JSON.parse(raw); }
  catch(e){ storageOK = false; }

  /* probe writability — a sandbox may allow read but block write */
  try { localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
  catch(e){ storageOK = false; }

  S = fromHash || stored || blank();
  if (fromHash) toast("링크에서 불러왔어");

  var b = blank();
  for (var k in b) if (!(k in S)) S[k] = b[k];
  return S;
}

function save(){
  if (storageOK){
    try { localStorage.setItem(KEY, JSON.stringify(S)); }
    catch(e){ storageOK = false; }
  }
  if (!storageOK){
    /* fallback: keep the whole board in the address bar so a bookmark survives */
    try { history.replaceState(null,"", "#" + encode(S)); } catch(e){}
  }
  paintWarn();
}

function paintWarn(){
  var el = document.getElementById("storewarn");
  if (storageOK){ el.classList.add("hide"); return; }
  el.classList.remove("hide");
  el.textContent = "이 브라우저에 저장이 막혀 있어. 대신 주소창에 데이터를 싣고 있으니, 이 페이지를 즐겨찾기 해두면 기록이 남아.";
}

/* ───────── sleep & condition ───────── */
var CLABEL = {1:"지침", 2:"별로", 3:"보통", 4:"괜찮음", 5:"좋음"};

/* hours slept, wrapping past midnight; null when either end is missing */
function sleepHours(c){
  if (!c || !c.sleep || !c.wake) return null;
  var a = c.sleep.split(":"), b = c.wake.split(":");
  var s = (+a[0])*60 + (+a[1]), w = (+b[0])*60 + (+b[1]);
  var mins = w - s;
  if (mins <= 0) mins += 1440;
  return Math.round(mins/6)/10;
}
function condOn(ds){ return S.cond[ds] || null; }
function setCond(ds, key, val){
  if (!S.cond[ds]) S.cond[ds] = {};
  if (val === null || val === "") delete S.cond[ds][key];
  else S.cond[ds][key] = val;
  if (!Object.keys(S.cond[ds]).length) delete S.cond[ds];
}
function mean(arr){
  var v = arr.filter(function(x){ return x !== null && x !== undefined; });
  if (!v.length) return null;
  return v.reduce(function(a,b){ return a+b; },0) / v.length;
}
function median(arr){
  var v = arr.filter(function(x){ return x !== null && x !== undefined; }).slice().sort(function(a,b){ return a-b; });
  if (!v.length) return null;
  var m = Math.floor(v.length/2);
  return v.length % 2 ? v[m] : (v[m-1]+v[m])/2;
}

/* ───────── scoring ───────── */
function taskById(id){
  for (var i=0;i<S.tasks.length;i++) if (S.tasks[i].id === id) return S.tasks[i];
  return null;
}
function doneOn(dateStr, id){ return !!(S.log[dateStr] && S.log[dateStr][id]); }

function toggle(dateStr, id){
  if (!S.log[dateStr]) S.log[dateStr] = {};
  if (S.log[dateStr][id]) delete S.log[dateStr][id];
  else S.log[dateStr][id] = true;
  if (!Object.keys(S.log[dateStr]).length) delete S.log[dateStr];
}

function ptsOn(dateStr){
  var m = S.log[dateStr], sum = 0;
  if (!m) return 0;
  for (var id in m){ var t = taskById(id); if (t) sum += PTS[t.tier]; }
  return sum;
}
function weekPts(ws){
  var sum = 0;
  for (var i=0;i<7;i++) sum += ptsOn(iso(addDays(ws,i)));
  return sum;
}

/* tasks that belong on a given date:
   - weekly  : routine scheduled on that weekday
   - day     : added from 일간, lives only on its own date
   - once    : ledger item, shows every day until it's done */
function tasksFor(d){
  var ds = iso(d), dow = d.getDay(), out = [];
  S.tasks.forEach(function(t){
    if (t.repeat === "weekly"){
      if (t.days.indexOf(dow) >= 0) out.push(t);
    } else if (t.repeat === "day"){
      if (t.date === ds) out.push(t);
    } else {
      if (doneOn(ds,t.id) || !oneOffDone(t.id)) out.push(t);
    }
  });
  return out;
}
function oneOffDone(id){
  for (var d in S.log) if (S.log[d][id]) return true;
  return false;
}
function oneOffDate(id){
  for (var d in S.log) if (S.log[d][id]) return d;
  return null;
}

/* ───────── rendering ───────── */
var view = "day";
var dayOffset = 0;                                  /* 0 = today, negative = past */
var weekOffset = 0;                                 /* 0 = this week */
function cursorDay(){ return addDays(today(), dayOffset); }
function cursorWeek(){ return addDays(weekStart(today()), weekOffset*7); }

/* points already scheduled in a week, done or not — used to preview a future week */
function plannedPts(ws){
  var sum = 0;
  for (var i=0;i<7;i++){
    tasksFor(addDays(ws,i)).forEach(function(t){
      if (t.repeat !== "once") sum += PTS[t.tier];
    });
  }
  return sum;
}
var el = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function render(){
  var d = today(), ws = weekStart(d);
  el("period").textContent = "오늘 " + md(d) + " · W" + weekNo(ws);
  document.querySelectorAll(".tabs button").forEach(function(b){
    b.setAttribute("aria-selected", b.dataset.v === view ? "true" : "false");
  });
  var v = el("view");
  if (view === "cond") v.innerHTML = viewCond(cursorDay());
  if (view === "day")  v.innerHTML = viewDay(cursorDay());
  if (view === "week") v.innerHTML = viewWeek(cursorWeek());
  if (view === "all")  v.innerHTML = viewAll();
  wire();
}

/* shared by 컨디션 and 일간 — both ride the same date cursor */
function dayNav(d){
  var isToday = iso(d) === iso(today()), ahead = dayOffset > 0;
  var s = '<div class="datenav">'
    + '<button data-act="prevday" aria-label="이전 날">‹</button>'
    + '<div class="dlabel">'+ md(d) +' <span>('+ DOW[d.getDay()] +')</span>'
    +   (isToday ? '<b>오늘</b>' : (ahead ? '<b class="soon">예정</b>' : '')) +'</div>'
    + '<button data-act="nextday" aria-label="다음 날">›</button>'
    + '</div>';
  if (!isToday){
    s += '<button class="jump" data-act="jumptoday">오늘로 돌아가기 <em>'
       + (ahead ? "+"+dayOffset : dayOffset) + '일</em></button>';
  }
  return s;
}

/* ── 컨디션 ── */
function ensureDraft(ds){
  if (cdraftDate === ds) return;
  cdraftDate = ds;
  var c = condOn(ds) || {};
  cdraft = { sleep: c.sleep || "", wake: c.wake || "", score: c.score || 0 };
  editingCond = false;
}

function viewCond(d){
  var ds = iso(d);
  ensureDraft(ds);
  var saved = condOn(ds);
  var open  = editingCond || !saved;
  var src   = open ? cdraft : saved;
  var hrs   = sleepHours(src);
  var pts = ptsOn(ds), tgt = S.dailyTarget;

  var h = '<div class="card">';
  h += dayNav(d);

  if (open){
    h += '<h2>잠</h2>';
    h += '<div class="timegrid">'
       + '<label>잠든 시각<input type="time" id="cSleep" value="'+ (cdraft.sleep||"") +'"></label>'
       + '<label>일어난 시각<input type="time" id="cWake" value="'+ (cdraft.wake||"") +'"></label>'
       + '</div>';
    h += '<div class="sleepbig">'+ sleepBigText(hrs) +'</div>';

    h += '<h2 class="mt">컨디션</h2>';
    h += '<div class="condpick">'
       + [1,2,3,4,5].map(function(k){
           return '<button data-act="score" data-s="'+k+'" aria-pressed="'+(cdraft.score===k)+'">'
                + '<i class="c'+k+'"></i>'+ CLABEL[k] +'</button>';
         }).join("")
       + '</div>';

    var filled = !!(cdraft.sleep || cdraft.wake || cdraft.score);
    h += '<div class="submitrow">';
    if (saved) h += '<button class="ghost" data-act="cancelcond">취소</button>';
    h += '<button class="submit" data-act="submitcond"'+ (filled?'':' disabled') +'>제출</button>';
    h += '</div>';
    if (!filled) h += '<div class="hint">하나라도 채우면 제출할 수 있어.</div>';

  } else {
    h += '<h2>기록됨</h2>';
    h += '<div class="drep">'
       + drow("잠든 시각", saved.sleep || "—", "")
       + drow("일어난 시각", saved.wake || "—", "")
       + drow("수면", hrs === null ? "—" : hrs.toFixed(1) + '시간', hrs !== null ? "good" : "")
       + drow("컨디션", saved.score ? CLABEL[saved.score] : "—", "")
       + '</div>';
    h += '<div class="submitrow">'
       + '<button class="ghost" data-act="editcond">수정</button>'
       + '<button class="ghost danger" data-act="delcond">기록 지우기</button>'
       + '</div>';
  }
  h += '</div>';

  /* 하루 보고서 */
  h += '<div class="card"><h2>하루 보고서</h2>';
  h += '<div class="drep">'
     + drow("퀘스트", pts + ' / ' + tgt + ' pt', pts >= tgt ? "good" : "")
     + drow("수면", sleepText(src, hrs), "", "dSleepVal")
     + drow("컨디션", src.score ? CLABEL[src.score] : "—", "")
     + '</div>';
  h += '<div class="note" id="dnote">🐙 '+ esc(dayComment(pts, tgt, hrs, src.score, ds)) +'</div>';
  h += '</div>';
  return h;
}
function drow(k, v, cls, id){
  return '<div class="drow'+(cls?' '+cls:'')+'"><div class="k">'+ k +'</div>'
       + '<div class="v"'+(id?' id="'+id+'"':'')+'>'+ v +'</div></div>';
}
function sleepText(c, hrs){
  if (hrs === null) return "—";
  return hrs.toFixed(1) + '시간'
       + (c.sleep && c.wake ? ' <s>'+ c.sleep +' → '+ c.wake +'</s>' : '');
}
function sleepBigText(hrs){
  return hrs === null
    ? '<span class="none">두 시각을 넣으면 수면 시간이 계산돼</span>'
    : '<b>'+ hrs.toFixed(1) +'</b><em>시간</em>';
}

/* Update only the numbers that depend on the clocks. A full re-render here
   would rip out the input the iOS wheel is still sitting in — the wheel fires
   `change` on every tick, long before the user taps 완료. */
function patchSleep(){
  var ds = iso(cursorDay());
  var saved = condOn(ds);
  var src = (editingCond || !saved) ? cdraft : saved;
  var hrs = sleepHours(src);

  var big = document.querySelector(".sleepbig");
  if (big) big.innerHTML = sleepBigText(hrs);
  var val = el("dSleepVal");
  if (val) val.innerHTML = sleepText(src, hrs);
  var note = el("dnote");
  if (note) note.textContent = "🐙 " + dayComment(ptsOn(ds), S.dailyTarget, hrs, src.score, ds);

  var filled = !!(cdraft.sleep || cdraft.wake || cdraft.score);
  var sub = document.querySelector('[data-act="submitcond"]');
  if (sub) sub.disabled = !filled;
  var hint = document.querySelector(".hint");
  if (hint) hint.style.display = filled ? "none" : "";
}

function dayComment(pts, tgt, hrs, score, ds){
  var future = ds > iso(today());
  if (future) return "아직 오지 않은 날이야. 미리 퀘스트만 얹어둬도 돼.";
  if (!pts && hrs === null && !score) return "아직 아무 기록도 없어. 잠부터 적어도 되고, 퀘스트부터 해도 돼.";
  var s = "";
  if (pts >= tgt) s = "오늘 목표 찍었어. 남은 시간은 온전히 네 거야.";
  else if (pts > 0) s = pts + "pt 쌓였어.";
  else s = "오늘은 기록만 남겼네. 그것도 남긴 거야.";
  /* Never turn sleep into an expectation — "you rested well" quietly becomes
     "so you should have done more". Sleep gets stated, never cashed in. */
  if (hrs !== null){
    if (hrs < 6) s += " 잠이 " + hrs.toFixed(1) + "시간이었네. 오늘 기대치는 낮춰도 괜찮아.";
    else s += " " + hrs.toFixed(1) + "시간 잤어도 피로는 쌓여 있을 수 있어. 무리하지 마.";
  }
  return s;
}

/* ── 일간 ── */
function viewDay(d){
  var ds = iso(d), tgt = S.dailyTarget, got = ptsOn(ds);
  var list = tasksFor(d);

  /* the track: completed tasks occupy blocks proportional to their points */
  var doneList = list.filter(function(t){ return doneOn(ds,t.id); });
  var used = 0, blocks = "", overflow = 0;
  doneList.forEach(function(t){
    var p = PTS[t.tier];
    if (used + p <= tgt){
      blocks += '<div class="blk t'+t.tier+'" style="grid-column:span '+p+'">'+p+'</div>';
      used += p;
    } else if (used < tgt){
      var fit = tgt - used;
      blocks += '<div class="blk t'+t.tier+'" style="grid-column:span '+fit+'">'+fit+'</div>';
      overflow += p - fit; used = tgt;
    } else { overflow += p; }
  });
  for (var i=used;i<tgt;i++) blocks += '<div class="cell"></div>';

  var hit = got >= tgt;
  var left = tgt - got;

  var isToday = ds === iso(today());
  var h = '<div class="card">';
  h += dayNav(d);
  h += '<div class="readout"><div class="big">'+ got +'<em>/'+ tgt +' pt</em></div>'
     +  '<div class="side">완료 <b>'+ doneList.length +'</b> / '+ list.length +'개<br>'
     +  (hit ? '초과 <b>+'+ (got-tgt) +'</b> pt' : '남은 <b>'+ left +'</b> pt') +'</div></div>';
  h += '<div class="track" style="grid-template-columns:repeat('+tgt+',1fr)">'+ blocks +'</div>';
  h += '<div class="track-legend"><span>0</span><span>'+ tgt +' pt</span></div>';

  if (overflow > 0){
    h += '<div class="bonus"><span>보너스 +'+ overflow +'</span>'
       + '<div class="bar"><i style="width:'+ Math.min(100, overflow/tgt*100) +'%"></i></div>'
       + '<span>주간으로</span></div>';
  }
  if (hit){
    h += '<div class="done-banner"><b>오늘 할 일 다 했다.</b>'
       + '<span>'+ (got>tgt ? '넘긴 만큼은 주간에 쌓여.' : '여기서 멈춰도 돼.') +'</span></div>';
  }
  h += '</div>';

  h += '<div class="card"><h2>오늘의 퀘스트</h2>';
  if (!list.length){
    h += '<div class="empty">오늘 잡힌 게 없어.<br><b>전체</b> 탭에서 할 일을 적어두면 여기 자동으로 떠.</div>';
  } else {
    h += '<div class="list">';
    list.forEach(function(t){
      if (t.id === editingId){ h += editRow(t); return; }
      var on = doneOn(ds,t.id);
      h += '<div class="row'+(on?' on':'')+'" role="button" tabindex="0" data-act="toggle" data-id="'+t.id+'" data-d="'+ds+'">'
         + chk() + '<div class="ttl">'+ esc(t.title) +'</div>'
         + (t.repeat==="weekly" ? '<div class="dayspec">'+ t.days.map(function(x){return DOW[x];}).join("") +'</div>' : '')
         + '<div class="tier t'+t.tier+'">'+ TNAME[t.tier] +' '+ PTS[t.tier] +'</div>'
         + editBtn(t.id)
         + (t.repeat !== "weekly" ? delBtn(t.id) : '') +'</div>';
    });
    h += '</div>';
  }

  /* quick-add — lives only on this date */
  h += '<div class="add">'
     + '<input type="text" id="nt" placeholder="'+ (isToday ? '오늘 할 일 추가' : md(d)+' 할 일 추가') +'" autocomplete="off">'
     + '<div class="seg" id="ntier">'
     +   '<button data-t="1" aria-pressed="false">Easy 1</button>'
     +   '<button data-t="2" aria-pressed="true">Med 2</button>'
     +   '<button data-t="3" aria-pressed="false">Hard 3</button></div>'
     + '<button class="addbtn" data-act="add">추가</button>'
     + '</div>';

  h += '</div>';
  return h;
}
function chk(){ return '<div class="box"><svg viewBox="0 0 12 12"><polyline points="1.5,6.5 4.5,9.5 10.5,2.5"/></svg></div>'; }

function editBtn(id){

       + '<svg viewBox="0 0 14 14"><path d="M9.6 1.9l2.5 2.5M10.4 1.1a1.2 1.2 0 011.7 1.7L4.4 10.5l-2.6.7.7-2.6z"/></svg>'

/* inline editor — replaces the row it belongs to */
function editRow(t){

/* ── 주간 ── */
function viewWeek(ws){
  var tgt = S.weeklyTarget, got = weekPts(ws);
  var pct = tgt ? Math.min(100, Math.round(got/tgt*100)) : 0;
  var td = iso(today());

  var day = [], maxp = S.dailyTarget;
  for (var i=0;i<7;i++){
    var ds = iso(addDays(ws,i));
    var p = ptsOn(ds);
    if (p > maxp) maxp = p;
    day.push({ds:ds,p:p,i:i});
  }

  var isNow   = weekOffset === 0;
  var isAhead = weekOffset > 0;

  var h = '<div class="card">';
  h += '<div class="datenav">'
     + '<button data-act="prevweek" aria-label="이전 주">‹</button>'
     + '<div class="dlabel">W'+ weekNo(ws) +' <span>'+ md(ws) +'→'+ md(addDays(ws,6)) +'</span>'
     +   (isNow ? '<b>이번 주</b>' : (isAhead ? '<b class="soon">예정</b>' : '')) +'</div>'
     + '<button data-act="nextweek" aria-label="다음 주">›</button>'
     + '</div>';
  if (!isNow){
    h += '<button class="jump" data-act="jumpweek">이번 주로 돌아가기'
       + ' <em>' + (isAhead ? "+"+weekOffset : weekOffset) + '주</em></button>';
  }

  if (isAhead && got === 0){
    var plan = plannedPts(ws);
    h += '<div class="readout"><div class="big">'+ plan +'<em> pt</em></div>'
       + '<div class="side">예정된 점수<br>목표 '+ tgt +' pt</div></div>';
  } else {
    h += '<div class="readout"><div class="big">'+ pct +'<em>%</em></div>'
       + '<div class="side"><b>'+ got +'</b> / '+ tgt +' pt<br>목표 달성 <b>'
       + day.filter(function(x){return x.p>=S.dailyTarget;}).length +'</b> / 7일</div></div>';
  }

  h += '<div class="days">';
  day.forEach(function(x){
    var cls = x.p >= S.dailyTarget ? "hit" : (x.p > 0 ? "some" : "");
    if (x.ds === td) cls += " today";
    var hpx = x.p ? Math.max(4, Math.round(x.p/maxp*76)) : 3;
    h += '<div class="day '+cls+'"><div class="pt">'+ (x.p||"·") +'</div>'
       + '<div class="stack" style="height:'+hpx+'px"></div></div>';
  });
  h += '</div>';
  h += '<div class="dow">'+ DOW.map(function(n,i){
         return '<span'+(iso(addDays(ws,i))===td?' class="now"':'')+'>'+n+'</span>'; }).join("") +'</div>';

  /* The reward ladder belongs to the week you are actually living in.
     Showing it against a past week's points would be a lie, so other weeks
     get their saved report instead. */
  if (isNow){
    h += '<div class="rail"><i style="width:'+pct+'%"></i>'
       + S.rewards.map(function(r){
           return '<u class="'+(pct>=r.pct?"on":"")+'" style="left:calc('+r.pct+'% - .75px)"></u>'; }).join("")
       + '</div>';

    h += '<h2 class="mt">보상</h2><div class="ladder">';
    var nextIdx = -1;
    S.rewards.forEach(function(r,i){ if (nextIdx<0 && pct < r.pct) nextIdx = i; });
    S.rewards.forEach(function(r,i){
      var open = pct >= r.pct;
      var cls = r.claimed ? "got" : (open ? "" : (i===nextIdx ? "next" : "locked"));
      var need = Math.max(0, Math.ceil(tgt*r.pct/100) - got);
      h += '<div class="rw '+cls+'"><div class="pct">'+ r.pct +'%</div>'
         + '<input type="text" data-act="reward" data-i="'+i+'" value="'+ esc(r.text) +'" placeholder="보상 적기">';
      if (r.claimed)      h += '<div class="st">받음 ✓</div>';
      else if (open)      h += '<button data-act="claim" data-i="'+i+'">받기</button>';
      else if (i===nextIdx) h += '<div class="st">'+ need +'pt 남음</div>';
      else                h += '<div class="st">'+ need +'pt</div>';
      h += '</div>';
    });
    h += '</div>';
  }
  h += '</div>';

  var saved = -1;
  S.reports.forEach(function(x,i){ if (x.key === weekKey(ws)) saved = i; });
  if (saved >= 0){
    h += '<button class="jump" data-act="openrep" data-i="'+saved+'">이 주 보고서 보기</button>';
  } else {
    h += '<button class="jump" data-act="previewrep">'
       + (isNow ? '이번 주 보고서 미리보기' : '이 주 보고서 만들어 보기') + '</button>';
  }

  /* archive + tools live on the current week only */
  if (isNow){
    if (S.reports.length){
      h += '<div class="card"><h2>지난 보고서</h2>';
      S.reports.slice().reverse().forEach(function(r,ri){
        var realIdx = S.reports.length-1-ri;
        h += '<div class="arch" role="button" tabindex="0" data-act="openrep" data-i="'+realIdx+'">'
           + '<div class="w">W'+ r.wno +'</div><div>'+ r.range +'</div>'
           + '<div class="p">'+ r.total +' pt</div></div>';
      });
      h += '</div>';
    }
    h += '<div class="foot"><button data-act="copy">링크 복사</button>'
       + '<button data-act="settings">설정</button></div>';
  }
  return h;
}

/* ── 보고서 ── */
function buildReport(ws){
  var byDay = [], total = 0, tiers = {1:0,2:0,3:0}, oncesDone = [];
  var sleep = [], cond = [];
  for (var i=0;i<7;i++){
    var ds = iso(addDays(ws,i)), m = S.log[ds] || {}, p = 0;
    var cc = condOn(ds);
    sleep.push(sleepHours(cc));
    cond.push(cc && cc.score ? cc.score : null);
    for (var id in m){
      var t = taskById(id);
      if (!t) continue;
      p += PTS[t.tier]; tiers[t.tier]++;
      if (t.repeat !== "weekly") oncesDone.push(t.title);
    }
    byDay.push(p); total += p;
  }
  var routines = S.tasks.filter(function(t){ return t.repeat==="weekly"; }).map(function(t){
    var plan = t.days.length, did = 0;
    t.days.forEach(function(dw){ if (doneOn(iso(addDays(ws,dw)), t.id)) did++; });
    return {title:t.title, did:did, plan:plan};
  });
  return {
    wno: weekNo(ws), key: weekKey(ws),
    range: md(ws) + " → " + md(addDays(ws,6)),
    total: total, byDay: byDay, tiers: tiers, sleep: sleep, cond: cond,
    hits: byDay.filter(function(p){ return p >= S.dailyTarget; }).length,
    target: S.weeklyTarget,
    routines: routines, onces: oncesDone,
    claimed: S.rewards.filter(function(r){ return r.claimed; }).length
  };
}

function viewReport(r, prev, isPreview){
  var max = Math.max.apply(null, r.byDay.concat([S.dailyTarget]));
  var delta = prev ? r.total - prev.total : null;
  var pct = r.target ? Math.round(r.total/r.target*100) : 0;

  var h = '<div class="card">';
  h += '<div class="rep-h"><div class="t">주간 보고서 · W'+ r.wno
     + (isPreview ? ' <i>미리보기</i>' : '') +'</div><div class="d">'+ r.range +'</div></div>';

  h += '<div class="readout"><div class="big">'+ r.total +'<em> pt</em></div><div class="side">'
     + (delta === null ? '첫 주야' : (delta >= 0 ? '지난주 대비 <b>+'+delta+'</b>' : '지난주 대비 <b>'+delta+'</b>'))
     + '<br>목표의 <b>'+ pct +'%</b></div></div>';

  h += '<div class="days">';
  r.byDay.forEach(function(p,i){
    var cls = p >= S.dailyTarget ? "hit" : (p > 0 ? "some" : "");
    var hpx = p ? Math.max(4, Math.round(p/max*76)) : 3;
    h += '<div class="day '+cls+'"><div class="pt">'+ (p||"·") +'</div>'
       + '<div class="stack" style="height:'+hpx+'px"></div></div>';
  });
  h += '</div><div class="dow">'+ DOW.map(function(n){return '<span>'+n+'</span>';}).join("") +'</div>';

  h += '<div class="stats">'
     + '<div class="stat"><div class="k">목표 달성</div><div class="v">'+ r.hits +'<small>/ 7일</small></div></div>'
     + '<div class="stat"><div class="k">받은 보상</div><div class="v">'+ r.claimed +'<small>/ 4</small></div></div>'
     + '<div class="stat"><div class="k">난이도</div><div class="v" style="font-size:14px">H '+r.tiers[3]+' · M '+r.tiers[2]+' · E '+r.tiers[1]+'</div></div>'
     + '<div class="stat"><div class="k">한 번짜리</div><div class="v">'+ r.onces.length +'<small>개 완료</small></div></div>'
     + '</div>';

  /* sleep ↔ output. Split at the week's own median so it always says something
     real, instead of an arbitrary "7 hours" that some weeks never cross. */
  var sl = r.sleep || [], cd = r.cond || [];
  var haveSleep = sl.filter(function(x){ return x !== null && x !== undefined; }).length;
  if (haveSleep){
    var avgS = mean(sl), avgC = mean(cd);
    h += '<h2 class="mt">잠과 성취</h2>';
    h += '<div class="stats">'
       + '<div class="stat"><div class="k">평균 수면</div><div class="v">'+ avgS.toFixed(1) +'<small>시간</small></div></div>'
       + '<div class="stat"><div class="k">평균 컨디션</div><div class="v">'
       +   (avgC === null ? '—' : avgC.toFixed(1) + '<small>/ 5</small>') +'</div></div>'
       + '</div>';

    if (haveSleep >= 3){
      var med = median(sl), hi = [], lo = [];
      sl.forEach(function(x,i){
        if (x === null || x === undefined) return;
        (x >= med ? hi : lo).push(r.byDay[i]);
      });
      if (hi.length && lo.length){
        h += '<div class="cmp">'
           + '<div class="cmpline"><span>'+ med.toFixed(1) +'시간 이상 잔 날</span>'
           +   '<b>'+ mean(hi).toFixed(1) +' pt</b></div>'
           + '<div class="cmpline"><span>'+ med.toFixed(1) +'시간 미만 잔 날</span>'
           +   '<b>'+ mean(lo).toFixed(1) +' pt</b></div>'
           + '</div>';
      }
    }

    h += '<div class="slist">';
    sl.forEach(function(x,i){
      if (x === null && r.byDay[i] === 0 && !cd[i]) return;
      h += '<div class="sline"><div class="d">'+ DOW[i] +'</div>'
         + '<div class="s">'+ (x === null ? '—' : x.toFixed(1)+'h') +'</div>'
         + '<div class="c">'+ (cd[i] ? CLABEL[cd[i]] : '—') +'</div>'
         + '<div class="p">'+ r.byDay[i] +' pt</div></div>';
    });
    h += '</div>';
  }

  if (r.routines.length){
    h += '<h2 class="mt">루틴 이행</h2><div class="list">';
    r.routines.forEach(function(x){
      h += '<div class="row" style="cursor:default"><div class="ttl">'+ esc(x.title) +'</div>'
         + '<div class="rate">'+ x.did +'/'+ x.plan +'</div></div>';
    });
    h += '</div>';
  }
  if (r.onces.length){
    h += '<h2 class="mt">끝낸 것</h2><div class="list">';
    r.onces.forEach(function(t){
      h += '<div class="row on" style="cursor:default">'+chk()+'<div class="ttl">'+ esc(t) +'</div></div>';
    });
    h += '</div>';
  }

  h += '<div class="note">🐙 '+ esc(comment(r, isPreview)) +'</div>';
  h += '</div><div class="foot"><button data-act="closerep">'
     + (isPreview ? '돌아가기' : '닫고 이번 주로') +'</button></div>';
  return h;
}

function comment(r, isPreview){
  var b = r.byDay, active = b.filter(function(p){ return p>0; }).length;
  if (r.total === 0){
    return isPreview
      ? "아직 아무것도 안 찍혔어. 하나 체크하면 여기부터 채워져."
      : "이번 주는 기록이 없네. 그런 주도 있어. 다음 주는 하나부터.";
  }
  if (isPreview) return "아직 진행 중이야. 지금까지 " + r.total + "pt, " + active +
    "일 움직였고, " + DOW[b.indexOf(Math.max.apply(null,b))] + "요일이 제일 많았어.";
  var best = b.indexOf(Math.max.apply(null,b));
  /* longest run of active days */
  var run=0, bestRun=0;
  b.forEach(function(p){ if (p>0){ run++; if(run>bestRun) bestRun=run; } else run=0; });
  var s = DOW[best] + "요일이 제일 많았고, " + active + "일 움직였어.";
  if (bestRun >= 3) s += " " + bestRun + "일 연속으로 붙은 구간이 있는 게 눈에 띄네.";
  else if (r.hits >= 3) s += " 목표를 " + r.hits + "번 찍었으면 충분한 주야.";
  else s += " 조금씩이라도 이어진 게 기록으로 남았어.";
  return s;
}

/* ───────── week rollover ───────── */
var pendingReport = null;

function checkRollover(){
  var ws = weekStart(today()), key = weekKey(ws);
  if (!S.seenWeek){ S.seenWeek = key; save(); return; }
  if (S.seenWeek === key) return;

  /* close out every week between seenWeek and now that has data */
  var prevWs = weekStart(addDays(ws,-7));
  var rep = buildReport(prevWs);
  if (rep.total > 0 || S.reports.length){
    var already = S.reports.some(function(x){ return x.key === rep.key; });
    if (!already) S.reports.push(rep);
    pendingReport = rep;
  }
  S.seenWeek = key;
  S.rewards.forEach(function(r){ r.claimed = false; });   /* new week, fresh ladder */
  save();
}

/* ───────── interaction ───────── */
var draft = { tier:2, repeat:"once", days:[] };
var editingId = null, edraft = { tier:2, days:[] };
var editingCond = false, cdraftDate = null;
var cdraft = { sleep:"", wake:"", score:0 };

function toast(msg){
  var t = el("toast");
  t.textContent = msg; t.classList.add("up");
  clearTimeout(t._h); t._h = setTimeout(function(){ t.classList.remove("up"); }, 2600);
}

function wire(){
  var v = el("view");

  v.querySelectorAll("[data-act]").forEach(function(n){
    var act = n.dataset.act;
    if (act === "reward"){
      n.addEventListener("input", function(){ S.rewards[+n.dataset.i].text = n.value; save(); });
      return;
    }
    if (n.tagName === "INPUT") return;
    n.addEventListener("click", function(ev){ ev.stopPropagation(); doAct(act, n); });
    if (n.getAttribute("role") === "button"){
      n.addEventListener("keydown", function(ev){
        if (ev.key === "Enter" || ev.key === " "){ ev.preventDefault(); doAct(act,n); }
      });
    }
  });

  var tierSeg = el("ntier"), repSeg = el("nrep"), dayPick = el("ndays"), nt = el("nt");
  if (tierSeg){
    tierSeg.querySelectorAll("button").forEach(function(b){
      b.setAttribute("aria-pressed", (+b.dataset.t === draft.tier) ? "true":"false");
      b.addEventListener("click", function(){
        draft.tier = +b.dataset.t;
        tierSeg.querySelectorAll("button").forEach(function(x){
          x.setAttribute("aria-pressed", x===b ? "true":"false"); });
      });
    });
    /* 일간's quick-add has no repeat/weekday pickers — guard for that */
    if (repSeg && dayPick){
      repSeg.querySelectorAll("button").forEach(function(b){
        b.setAttribute("aria-pressed", (b.dataset.r === draft.repeat) ? "true":"false");
        b.addEventListener("click", function(){
          draft.repeat = b.dataset.r;
          repSeg.querySelectorAll("button").forEach(function(x){
            x.setAttribute("aria-pressed", x===b ? "true":"false"); });
          dayPick.classList.toggle("hide", draft.repeat !== "weekly");
        });
      });
      dayPick.classList.toggle("hide", draft.repeat !== "weekly");
      dayPick.querySelectorAll("button").forEach(function(b){
        var d = +b.dataset.d;
        b.setAttribute("aria-pressed", draft.days.indexOf(d)>=0 ? "true":"false");
        b.addEventListener("click", function(){
          var k = draft.days.indexOf(d);
          if (k>=0) draft.days.splice(k,1); else draft.days.push(d);
          b.setAttribute("aria-pressed", draft.days.indexOf(d)>=0 ? "true":"false");
        });
      });
    }
    nt.addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){ ev.preventDefault(); doAct("add"); }
    });
  }

  /* inline editor pickers */
  var eTier = el("etier"), eDays = el("edays"), eBox = el("et");
  if (eTier){
    eTier.querySelectorAll("button").forEach(function(b){
      b.addEventListener("click", function(){
        edraft.tier = +b.dataset.t;
        eTier.querySelectorAll("button").forEach(function(x){
          x.setAttribute("aria-pressed", x===b ? "true":"false"); });
      });
    });
  }
  if (eDays){
    eDays.querySelectorAll("button").forEach(function(b){
      var d = +b.dataset.d;
      b.addEventListener("click", function(){
        var k = edraft.days.indexOf(d);
        if (k>=0) edraft.days.splice(k,1); else edraft.days.push(d);
        b.setAttribute("aria-pressed", edraft.days.indexOf(d)>=0 ? "true":"false");
      });
    });
  }
  if (eBox){
    eBox.focus();
    eBox.setSelectionRange(eBox.value.length, eBox.value.length);
    eBox.addEventListener("keydown", function(ev){
      if (ev.key === "Enter"){
        ev.preventDefault();
        var s = document.querySelector('[data-act="saveedit"]'); if (s) s.click();
      }
      if (ev.key === "Escape"){ editingId = null; render(); }
    });
  }

  /* sleep clocks — save every tick, but never re-render while the picker is open */
  ["cSleep","cWake"].forEach(function(id){
    var box = el(id);
    if (!box) return;
    var key = (id === "cSleep") ? "sleep" : "wake";
    function commit(){ cdraft[key] = box.value; patchSleep(); }
    box.addEventListener("input",  commit);
    box.addEventListener("change", commit);
  });

  var sdt = el("sdt"), swt = el("swt");
  if (sdt){
    sdt.addEventListener("change", function(){
      S.dailyTarget = Math.max(1, Math.min(30, +sdt.value || 7));
      S.weeklyTarget = S.dailyTarget * 5;
      save(); render2("settings");
    });
    swt.addEventListener("change", function(){
      S.weeklyTarget = Math.max(1, Math.min(200, +swt.value || 35)); save();
    });
  }
}

function doAct(act, n){
  if (act === "toggle"){
    var id = n.dataset.id, ds = n.dataset.d;
    var ws = weekStart(today());
    var before = Math.round(weekPts(ws)/S.weeklyTarget*100);
    toggle(ds, id); save();
    var after = Math.round(weekPts(ws)/S.weeklyTarget*100);
    var dayNow = ptsOn(iso(today()));

    if (dayNow >= S.dailyTarget && dayNow - PTS[taskById(id).tier] < S.dailyTarget && ds === iso(today())){
      toast("오늘 할 일 다 했다 🐙");
    } else {
      S.rewards.forEach(function(r){
        if (before < r.pct && after >= r.pct){
          toast(r.pct + "% 도달 — " + (r.text || "보상 열림"));
        }
      });
    }
    render();
    return;
  }
  if (act === "edit"){
    var et = taskById(n.dataset.id);
    if (!et) return;
    editingId = et.id;
    edraft.tier = et.tier;
    edraft.days = (et.days || []).slice();
    render(); return;
  }
  if (act === "canceledit"){ editingId = null; render(); return; }
  if (act === "saveedit"){
    var st = taskById(n.dataset.id);
    if (!st){ editingId = null; render(); return; }
    var box = el("et"), val = box.value.trim();
    if (!val){ box.focus(); return; }
    if (st.repeat === "weekly" && !edraft.days.length){ toast("요일을 하나는 골라줘"); return; }
    st.title = val;
    st.tier  = edraft.tier;
    if (st.repeat === "weekly") st.days = edraft.days.slice().sort();
    editingId = null; save(); render(); return;
  }
  if (act === "del"){
    var tid = n.dataset.id;
    S.tasks = S.tasks.filter(function(t){ return t.id !== tid; });
    for (var d in S.log){ delete S.log[d][tid]; if (!Object.keys(S.log[d]).length) delete S.log[d]; }
    save(); render(); return;
  }
  if (act === "add"){
    var nt = el("nt"), title = nt.value.trim();
    if (!title){ nt.focus(); return; }
    /* added from 일간 → belongs to that date only; from 전체 → ledger item */
    var rep = (view === "day") ? "day" : draft.repeat;
    if (rep === "weekly" && !draft.days.length){ toast("요일을 하나는 골라줘"); return; }
    S.tasks.push({
      id: "t" + (S.tasks.length ? (Math.max.apply(null, S.tasks.map(function(t){ return +t.id.slice(1)||0; }))+1) : 1),
      title: title, tier: draft.tier,
      repeat: rep,
      date: rep === "day" ? iso(cursorDay()) : undefined,
      days: rep === "weekly" ? draft.days.slice().sort() : []
    });
    nt.value = ""; draft.days = [];
    save(); render();
    el("nt") && el("nt").focus();
    return;
  }
  if (act === "claim"){
    S.rewards[+n.dataset.i].claimed = true; save(); render();
    toast("받았어 🐙"); return;
  }
  if (act === "copy"){
    var url = location.origin + location.pathname + "#" + encode(S);
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(
        function(){ toast("링크 복사됨 — 다른 기기에서 열면 그대로 복원돼"); },
        function(){ fallbackCopy(url); });
    } else fallbackCopy(url);
    return;
  }
  /* condition form — nothing is written until 제출 */
  if (act === "score"){
    var val = +n.dataset.s;
    cdraft.score = (cdraft.score === val) ? 0 : val;
    render(); return;
  }
  if (act === "submitcond"){
    var cds = iso(cursorDay());
    setCond(cds, "sleep", cdraft.sleep || null);
    setCond(cds, "wake",  cdraft.wake  || null);
    setCond(cds, "score", cdraft.score || null);
    editingCond = false; save();
    view = "day"; render(); window.scrollTo(0,0);
    toast("기록했어 🐙");
    return;
  }
  if (act === "editcond"){ editingCond = true; render(); return; }
  if (act === "cancelcond"){
    var c0 = condOn(iso(cursorDay())) || {};
    cdraft = { sleep:c0.sleep||"", wake:c0.wake||"", score:c0.score||0 };
    editingCond = false; render(); return;
  }
  if (act === "delcond"){
    delete S.cond[iso(cursorDay())];
    cdraft = { sleep:"", wake:"", score:0 };
    editingCond = false; save(); render(); return;
  }
  if (act === "prevday"){ if (dayOffset > -3650){ dayOffset--; render(); } return; }
  if (act === "nextday"){ if (dayOffset <  365){ dayOffset++; render(); } return; }
  if (act === "jumptoday"){ dayOffset = 0; render(); return; }
  if (act === "prevweek"){ if (weekOffset > -520){ weekOffset--; render(); } return; }
  if (act === "nextweek"){ if (weekOffset <   52){ weekOffset++; render(); } return; }
  if (act === "jumpweek"){ weekOffset = 0; render(); return; }
  if (act === "settings"){ render2("settings"); return; }
  if (act === "backweek"){ view = "week"; render(); return; }
  if (act === "reset"){
    if (confirm("퀘스트·기록·보고서를 전부 지울까? 되돌릴 수 없어.")){
      S = blank(); S.seenWeek = weekKey(weekStart(today()));
      try { history.replaceState(null,"", location.pathname); } catch(e){}
      save(); view = "day"; render();
    }
    return;
  }
  if (act === "previewrep"){
    var pws = cursorWeek();
    var pkey = weekKey(addDays(pws,-7)), before = null;
    S.reports.forEach(function(x){ if (x.key === pkey) before = x; });
    el("view").innerHTML = viewReport(buildReport(pws), before, true);
    wire(); window.scrollTo(0,0); return;
  }
  if (act === "openrep"){
    var r = S.reports[+n.dataset.i];
    var prev = S.reports[+n.dataset.i - 1] || null;
    el("view").innerHTML = viewReport(r, prev); wire(); window.scrollTo(0,0); return;
  }
  if (act === "closerep"){ pendingReport = null; view = "week"; render(); window.scrollTo(0,0); return; }
}

function fallbackCopy(url){
  var ta = document.createElement("textarea");
  ta.value = url; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); toast("링크 복사됨"); }
  catch(e){ toast("복사가 안 돼 — 주소창을 직접 복사해줘"); }
  document.body.removeChild(ta);
}

function render2(what){
  if (what === "settings"){ el("view").innerHTML = viewSettings(); wire(); }
}

/* ───────── boot ───────── */
document.querySelectorAll(".tabs button").forEach(function(b){
  b.addEventListener("click", function(){
    var prev = view;
    view = b.dataset.v; pendingReport = null; editingId = null;
    /* 컨디션 ↔ 일간 share a date, so keep the cursor when moving between them */
    var dayPair = (prev === "cond" || prev === "day") && (view === "cond" || view === "day");
    if (!dayPair) dayOffset = 0;
    weekOffset = 0;
    render();
  });
});

load();
checkRollover();
paintWarn();

if (pendingReport){
  var idx = S.reports.indexOf(pendingReport);
  el("view").innerHTML = viewReport(pendingReport, S.reports[idx-1] || null);
  wire();
} else {
  render();
}
</script>

</body>
