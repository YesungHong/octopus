<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuckoo">
<meta name="theme-color" content="#E7EDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071319" media="(prefers-color-scheme: dark)">
<title>Cuckoo</title>
<style>
:root{
  --bg:#E7EDEB; --surface:#fff; --surface-2:#F1F5F4; --sunk:#DDE5E3;
  --ink:#0E1F26; --ink-2:#3C555E; --ink-3:#7C939A;
  --line:#C4D2D0; --line-soft:#DCE6E4;
  --accent:#0E7C86; --accent-ink:#0A5C63; --accent-soft:#D6ECEC;
  --hot:#B0231A;
  --shadow:0 1px 2px rgba(14,31,38,.06);
  --font-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
 :root{
  --bg:#071319; --surface:#0E1F26; --surface-2:#132B33; --sunk:#0A1A20;
  --ink:#DFEAE9; --ink-2:#A9C0C2; --ink-3:#6A828A;
  --line:#22424B; --line-soft:#18333B;
  --accent:#2FA6A6; --accent-ink:#7FD6D0; --accent-soft:#12333A;
  --hot:#E0655A;
  --shadow:none;
 }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 56px}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.mast h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.mast h1 span{font-size:17px}

/* the clock: the one thing that never stops moving */
/* the day is the page; the totals are a footnote to it */
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 17px 18px;margin:12px 0 14px;box-shadow:var(--shadow)}
.now .d{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.now .big{font-family:var(--font-num);font-size:38px;font-weight:600;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;line-height:1.05;margin-top:1px}
.now .big em{font-style:normal;font-size:17px;color:var(--ink-3);margin-left:5px;letter-spacing:0}
/* ── tabs ── */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--sunk);
  border-radius:10px;padding:3px;margin-bottom:12px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;
  font-size:14px;font-weight:650;padding:9px 0;border-radius:8px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ── date cursor ── */
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datenav button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:17px;line-height:1;width:38px;height:38px;border-radius:9px;cursor:pointer;flex:none}
.datenav button:disabled{opacity:.3;cursor:default}
.datenav .dt{flex:1;text-align:center;font-size:15px;font-weight:650}
.datenav .dt i{font-style:normal;font-size:11px;font-weight:700;color:var(--accent-ink);
  background:var(--accent-soft);border-radius:5px;padding:1px 6px;vertical-align:2px}
.datenav .dt s{display:block;text-decoration:none;font-size:11.5px;font-weight:400;
  color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* ── the clock ── */
.clockwrap{position:relative;width:176px;height:176px;margin:2px auto 4px}
.clk{width:176px;height:176px;display:block}
.clk .face{fill:var(--sunk);stroke:var(--line-soft);stroke-width:1}
.clk .tick{stroke:var(--line);stroke-width:1.4;stroke-linecap:round}
.clk .tick.big{stroke:var(--ink-3);stroke-width:2}
.clk .gap{fill:none;stroke-width:9;stroke-linecap:butt;opacity:.5}
.clk .gap.up{stroke:var(--accent)}
.clk .gap.dn{stroke:var(--hot)}
.clk .hand{stroke-linecap:round}
.clk .hand.t{stroke:var(--ink-3);stroke-width:5}
.clk .hand.w{stroke:var(--hot);stroke-width:3}
.clk .hand.w.up{stroke:var(--accent)}
.clk .pin{fill:var(--ink-2)}
.clockmid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none}
.clockmid .pc{font-family:var(--font-num);font-size:29px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--hot)}
.clockmid .pc.up{color:var(--accent)}
.clockmid .pc em{font-style:normal;font-size:14px;margin-left:1px}
.clockmid .sb{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}

/* four circles, two by two — small enough that a phone shows all of them
   without scrolling, which is the point of putting them together */
/* one row, swiped sideways — the circles get to be big enough to read at a
   glance, which is the whole job of this page */
.grid{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;
  margin:0 -16px;padding:2px 16px 10px;scrollbar-width:none}
.grid::-webkit-scrollbar{display:none}
.cell{flex:0 0 auto;scroll-snap-align:center;text-align:center;width:250px}
.cell .lb{font-size:11px;font-weight:700;letter-spacing:.09em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:1px}

.cell .clockwrap{width:236px;height:236px;margin:0 auto}
.cell .clk{width:236px;height:236px}
.cell .clockmid .pc{font-size:38px}
.cell .clockmid .pc em{font-size:17px;margin-left:2px}
.cell .clockmid .sb{font-size:12px;margin-top:4px}
.zoom{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;display:block;width:100%}

/* ── 확대 ── */
.zoomlay{position:fixed;inset:0;background:var(--bg);z-index:20;
  display:flex;align-items:center;justify-content:center;padding:18px}
.zbox{text-align:center}
.zbox .lb{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:8px}
.zbox .clockwrap{width:min(86vw,64vh);height:min(86vw,64vh);margin:0 auto}
.zbox .clk{width:100%;height:100%}
.zbox .clockmid .pc{font-size:min(15vw,11vh)}
.zbox .clockmid .pc em{font-size:min(6vw,4.4vh)}
.zbox .clockmid .sb{font-size:min(3.6vw,2.6vh);margin-top:5px}
.zbtns{display:flex;gap:8px;justify-content:center;margin-top:20px}
.zbtns button{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;
  font:inherit;font-size:14px;font-weight:650;padding:11px 18px;border-radius:9px;cursor:pointer}
.zbtns button.gh{background:transparent;border-color:var(--line);color:var(--ink-2)}

/* ── 창 모드 (?only=) ── */
body.onlypage .wrap{max-width:none;padding:0;height:100vh}
body.onlypage .mast,body.onlypage .foot{display:none}
.onlywrap{height:100vh;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:6px;padding:10px}
.onlywrap .lb{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);text-transform:uppercase}
.onlywrap .clockwrap{width:min(88vw,74vh);height:min(88vw,74vh);margin:0}
.onlywrap .clk{width:100%;height:100%}
.onlywrap .clockmid .pc{font-size:min(17vw,14vh)}
.onlywrap .clockmid .pc em{font-size:min(7vw,5.6vh)}
.onlywrap .clockmid .sb{font-size:min(4vw,3.2vh);margin-top:4px}
.onlyd{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* circle 1 has no second hand, so the colour carries the hour */
.clk .wedge{opacity:.85;stroke:none}
@media (prefers-color-scheme:dark){ .clk .wedge{opacity:.72} }
.clk .redband{fill:none;stroke:#C0231A;stroke-width:5;stroke-linecap:butt;opacity:.55}
.clk .plate{fill:var(--surface)}
.clk.tone5 .plate{stroke:#C0231A;stroke-width:1.5;stroke-opacity:.5}
.clockmid .pc.neutral{color:var(--ink)}

.items{margin-top:10px;border-top:1px solid var(--line-soft);padding-top:2px}

/* ── 전체 탭 ── */
.allrow{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line-soft)}
.allrow .clockwrap{width:112px;height:112px;flex:none;margin:0}
.allrow .clk{width:112px;height:112px}
.allrow .clockmid .pc{font-size:20px}
.allrow .clockmid .pc em{font-size:11px}
.allrow .clockmid .sb{font-size:10px}
.allmeta{flex:1;min-width:0}
.allmeta .nm{font-size:14.5px;font-weight:650}
.allmeta .ct{font-family:var(--font-num);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:1px}
.allmeta .ct s{text-decoration:none;color:var(--ink-3);font-size:13px}
.allmeta .sb2{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.45}

.q{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line-soft)}
.q:first-of-type{border-top:0}
.q .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.q .nm s{display:block;text-decoration:none;font-size:11.5px;font-weight:400;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.logrow{display:flex;gap:7px;margin:-4px 0 11px}
.logrow .dur{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:9px 11px;color:var(--ink);font:inherit;font-size:14px}
.logrow .dur:focus{outline:0;border-color:var(--accent)}
.logrow button{appearance:none;border:1px solid var(--accent);background:var(--accent);color:#fff;
  font:inherit;font-size:13px;font-weight:650;padding:0 15px;border-radius:8px;cursor:pointer;flex:none}
.q .ct{font-family:var(--font-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;
  flex:none;min-width:62px;text-align:right}
.q .ct s{text-decoration:none;color:var(--ink-3);font-size:13px}
.q.done .ct{color:var(--accent)}
.q .qb{display:flex;gap:5px;flex:none}
.q .qb button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:650;width:34px;height:34px;border-radius:8px;cursor:pointer;
  font-variant-numeric:tabular-nums;padding:0}
.q .qb button.add{border-color:var(--accent);background:var(--accent);color:#fff}
.q .qb button:active{transform:translateY(1px)}
.q .rare{font-size:12.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}

.verdict{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);
  font-size:13.5px;color:var(--ink-2);line-height:1.5}
.verdict b{color:var(--ink);font-weight:650}
.verdict b.hot{color:var(--hot)}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:15px 16px 17px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2{margin:0 0 3px;font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3)}
.tot{display:flex;align-items:baseline;gap:9px;margin-top:13px}
.tot .nm{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tot .ct{font-family:var(--font-num);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tot .ct s{text-decoration:none;color:var(--ink-3);font-size:12px}

.dl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.dl .chip{flex:1 1 150px;background:var(--sunk);border-radius:9px;padding:9px 11px}
.dl .chip b{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.dl .chip .n{font-family:var(--font-num);font-size:21px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dl .chip .n em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:3px}
.dl .chip .s{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rail{position:relative;height:7px;border-radius:5px;background:var(--sunk);margin:9px 0 0;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);transition:width .25s}
.rail u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.rail.over i{background:var(--accent-ink)}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:6px;
  font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.verdict{margin-top:9px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.verdict b{color:var(--ink);font-weight:650}
.verdict b.hot{color:var(--hot)}
.btns{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.btns button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:650;padding:8px 13px;border-radius:8px;cursor:pointer;
  font-variant-numeric:tabular-nums}
.btns button.add{border-color:var(--accent);background:var(--accent);color:#fff}
.btns button:active{transform:translateY(1px)}
.btns .gap{flex:1}
.mini{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;
  font-size:12px;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

.setrow{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:13px;color:var(--ink-2)}
.setrow label{flex:1}
.setrow input{width:104px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;color:var(--ink);font:inherit;font-family:var(--font-num);font-size:14px;
  font-variant-numeric:tabular-nums}
.setrow input[type=date]{width:150px}
.hide{display:none}
.foot{margin-top:18px;text-align:center}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><h1><span>🐦</span> Cuckoo</h1>
    <button class="mini" id="setbtn">설정</button></div>
  <div id="view"></div>
  <div class="foot"><button class="mini" id="resetbtn">전부 지우기</button></div>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ───────── storage ─────────
   Derived from the path like every other board in this repo, so cuckoo can
   never collide with octopus even though they share an origin. */
var KEY = "octopus.cuckoo.v1";
var S, storageOK = true;

function blank(){
  var today = iso(new Date());
  return {
    v: 3,
    start: today,
    marks: [
      { id:"skct",  name:"SKCT",   date:"2026-10-10" },
      { id:"gsat",  name:"GSAT",   date:"2026-10-24" },
      { id:"final", name:"최종면접", date:"2026-11-30" }
    ],
    items: [
      /* 요일별 배분. 일 3 · 화 2 · 목 2 · 토 3 = 주당 10, 5주면 50 — 그래서
         목표가 60 이 아니라 50 이다. 주말 4 는 유저가 못 한다고 했고, 그걸
         맞추려 평일을 3일로 늘리면 같은 자리로 돌아온다. 0 인 요일은 몫이
         없는 날이고, 그건 빠진 게 아니라 설계다.
         금요일은 그룹미팅, 수요일은 비워두는 날이라 평일 2일은 화·목. */
      { id:"mock", track:"인적성", name:"모의고사",   unit:"세트", goal:50,  step:1,
        days:[3,0,2,0,2,0,3], due:"gsat"  },
      /* 사관학교 편수와 책 쪽수는 길이가 제각각이라 서로 더할 수 없다. 시간은
         더해진다 — 두 가지 공부를 하나의 원으로 묶을 수 있는 유일한 단위다.
         하루 2시간 × 11/30 까지 = 144. */
      { id:"semi", track:"면접",   name:"반도체 공부", unit:"시간", goal:144, step:0.5,
        days:[1,1,1,1,1,1,1], due:"final" }
    ],
    /* "YYYY-MM-DD": { itemId: count } — the day is the unit of record, and the
       total is derived from it. Keeping a separate running total would let the
       two drift, and the day is the thing being lived. */
    log: {}
  };
}

function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function fromIso(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
/* deadlines land at the end of their day — a test on 10/24 is not over at 00:00 */
function endOf(s){ var d = fromIso(s); d.setHours(23,59,59,999); return d; }
function dayStart(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function todayIso(){ return iso(new Date()); }

function load(){
  var stored = null;
  try { var raw = localStorage.getItem(KEY); if (raw) stored = JSON.parse(raw); }
  catch(e){ storageOK = false; }
  try { localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
  catch(e){ storageOK = false; }
  S = stored || blank();
  /* v1 kept a running total on the item; move it into the day it was recorded
     so there is one source of truth. Runs before the blank merge, or the new
     `log` key would already be there and hide the evidence. */
  if (S.v === 2){
    /* acad(편) + books(권) 를 semi(시간) 하나로. 서로 다른 단위를 합치지 않고
       기록만 옮기지 않는다 — 옛 기록이 있으면 그대로 두고 항목만 교체한다. */
    S.items = blank().items;
    S.v = 3;
  }
  if (S.v !== 2 && S.v !== 3){
    S.log = S.log || {};
    var d = S.start || todayIso(), day = S.log[d] || (S.log[d] = {});
    (S.items || []).forEach(function(it){
      if (it.n) day[it.id] = (day[it.id] || 0) + it.n;
      delete it.n;
    });
    S.v = 3;
  }
  var b = blank();
  for (var k in b) if (!(k in S)) S[k] = b[k];
}
function save(){
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOK = false; }
}

var el = function(id){ return document.getElementById(id); };
var toastT = null;
function toast(m){
  var t = el("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

/* ───────── the arithmetic ─────────
   Everything is a ratio of elapsed to total, and today's quota is simply what
   is left divided by the days left. That makes it self-correcting in both
   directions without any bookkeeping: skip today and tomorrow's number rises,
   do extra and it falls. No streaks, no penalties — just division. */
function markById(id){
  for (var i=0;i<S.marks.length;i++) if (S.marks[i].id === id) return S.marks[i];
  return S.marks[S.marks.length-1];
}
function itemById(id){
  for (var i=0;i<S.items.length;i++) if (S.items[i].id === id) return S.items[i];
  return null;
}
function total(id){
  var t = 0;
  for (var d in S.log) t += (S.log[d][id] || 0);
  return t;
}
function todayN(id){ var d = S.log[todayIso()]; return (d && d[id]) || 0; }
function addN(id, v, ds){
  var d = ds || todayIso();
  if (!S.log[d]) S.log[d] = {};
  /* minute resolution: 1:20 must not drift into 1.33 hours and back out wrong */
  S.log[d][id] = Math.round(Math.max(0, (S.log[d][id] || 0) + v) * 60) / 60;
  if (!S.log[d][id]) delete S.log[d][id];
  if (!Object.keys(S.log[d]).length) delete S.log[d];
}
function commitDur(id, ds, box){
  var v = parseDur(box.value);
  if (v === null){ toast("1:20 · 1.5 · 80분 처럼 써줘"); box.select && box.select(); return; }
  if (v <= 0){ box.value = ""; return; }
  addN(id, v, ds);
  var it = itemById(id);
  box.value = "";
  box.blur();
  save();
  toast(fmtQ(v, "시간") + " 더했다 · 오늘 " + fmtQ(nOn(id, ds), "시간"));
  draw();
}
function setN(id, v, ds){
  var d = ds || todayIso();
  if (!S.log[d]) S.log[d] = {};
  if (v > 0) S.log[d][id] = v; else delete S.log[d][id];
  if (!Object.keys(S.log[d]).length) delete S.log[d];
}
function daysLeft(dateStr){
  return Math.max(0, Math.ceil((endOf(dateStr) - new Date()) / 86400000));
}
function periodPct(dateStr){
  var a = fromIso(S.start), b = endOf(dateStr), now = new Date();
  if (b <= a) return 100;
  return Math.max(0, Math.min(100, (now - a) / (b - a) * 100));
}
function dayPct(){ return (new Date() - dayStart()) / 86400000 * 100; }
function pad2(n){ return String(n).padStart(2,"0"); }

/* what today owes, counting what is already done today so the number a person
   reads in the morning does not shrink under them as they work */
function quota(it){
  var m = markById(it.due);
  var left = it.goal - total(it.id) + todayN(it.id);
  if (left <= 0) return 0;
  var d = daysLeft(m.date);
  return d <= 0 ? left : left / d;
}

/* ───────── render ───────── */
var DOW = ["일","월","화","수","목","금","토"];
var tab = "day";     /* day | all */
var cur = 0;         /* day offset; 0 = today, negative = past */

function curDate(){ var d = dayStart(); d.setDate(d.getDate() + cur); return d; }
function curIso(){ return iso(curDate()); }

/* totals as they stood at the START of a given day, so a past day can be shown
   with the quota it actually had that morning rather than today's */
function totalBefore(id, dateStr){
  var t = 0;
  for (var d in S.log) if (d < dateStr) t += (S.log[d][id] || 0);
  return t;
}
function daysFrom(dateStr, fromIsoStr){
  var from = fromIso(fromIsoStr);
  return Math.max(0, Math.round((endOf(dateStr) - from) / 86400000));
}
/* A weekday and a Saturday are not the same amount of room, so the remaining
   work is split by weight rather than evenly. Dividing by the weighted sum of
   the days that are left keeps the self-correction — miss a day and every
   later day's share rises — while letting the weekend carry more. The result
   is rounded so the number on the face is one you can actually finish. */
function isWknd(dateStr){ var w = fromIso(dateStr).getDay(); return w === 0 || w === 6; }
/* a weight per weekday, so "화·목만 2세트, 주말 3세트" is expressible without
   giving up the self-correction — a zero day simply carries none of the load */
function wOf(it, dateStr){
  var d = it.days || [1,1,1,1,1,1,1];
  return d[fromIso(dateStr).getDay()];
}
function quotaOn(it, dateStr){
  var left = it.goal - totalBefore(it.id, dateStr);
  if (left <= 0) return 0;
  var end = fromIso(markById(it.due).date), d = fromIso(dateStr), sum = 0;
  while (d <= end){ sum += wOf(it, iso(d)); d.setDate(d.getDate() + 1); }
  if (sum <= 0) return left;
  var q = left * wOf(it, dateStr) / sum;
  return it.unit === "시간" ? Math.round(q * 2) / 2 : Math.max(0, Math.round(q));
}
function nOn(id, dateStr){ var d = S.log[dateStr]; return (d && d[id]) || 0; }

/* the day's clock: 100% is one full turn, noon-up, clockwise */
function timePctOn(dateStr){
  var t = todayIso();
  if (dateStr < t) return 100;
  if (dateStr > t) return 0;
  return dayPct();
}

/* ───────── the clock ─────────
   Two hands on one face. The grey hand is time, the coloured one is what has
   been done. Whichever is further round is ahead, and the arc between them is
   the gap — so "역전" is not a number to read but a shape to see. */
/* tone rises with the hour: barely there at dawn, insistent by evening. The
   colour is the only thing on circle 1 that says "running out", because there
   is no second hand to compare against. */
function toneOf(p){
  return p < 20 ? 1 : p < 40 ? 2 : p < 60 ? 3 : p < 80 ? 4 : 5;
}

/* ───────── 타코미터 ─────────
   The fill is not one colour that deepens but a sweep that travels — calm
   through the morning, amber by mid-afternoon, red at the end. Colour does the
   reading so the number does not have to, and the red band on the rim marks
   where the day stops being recoverable.

   Fixed hex rather than CSS variables: these have to be interpolated, and they
   were picked to hold up on both the light and the dark background. */
var RAMP = [[0, 0x6E, 0x8B, 0x93], [38, 0x2F, 0x9E, 0x8F],
            [62, 0xE0, 0xA3, 0x2B], [82, 0xD9, 0x6B, 0x1F], [100, 0xC0, 0x23, 0x1A]];
var REDLINE = 85;
function rampColor(p){
  p = Math.max(0, Math.min(100, p));
  for (var i = 1; i < RAMP.length; i++){
    if (p > RAMP[i][0] && i < RAMP.length - 1) continue;
    var a = RAMP[i-1], b = RAMP[i];
    var t = b[0] === a[0] ? 0 : (p - a[0]) / (b[0] - a[0]);
    t = Math.max(0, Math.min(1, t));
    var c = [1,2,3].map(function(k){ return Math.round(a[k] + (b[k]-a[k]) * t); });
    return '#' + c.map(function(v){ return v.toString(16).padStart(2,"0"); }).join("");
  }
  return '#6E8B93';
}
function clock(timeP, workP, mid, sub, opt){
  opt = opt || {};
  var R = 74, C = 88, r2 = 60;
  function pt(pct, rad){
    var a = (pct/100) * Math.PI*2 - Math.PI/2;
    return [C + rad*Math.cos(a), C + rad*Math.sin(a)];
  }
  function arc(p0, p1, rad){
    var s = pt(p0, rad), e = pt(p1, rad);
    var big = (((p1 - p0) % 100) + 100) % 100 > 50 ? 1 : 0;
    return 'M' + s[0].toFixed(1) + ' ' + s[1].toFixed(1)
         + ' A' + rad + ' ' + rad + ' 0 ' + big + ' 1 ' + e[0].toFixed(1) + ' ' + e[1].toFixed(1);
  }
  var solo = !!opt.solo;
  var ahead = workP >= timeP;
  var h = '<svg class="clk' + (solo ? ' tone' + toneOf(timeP) : '') + '" viewBox="0 0 176 176" aria-hidden="true">';
  h += '<circle cx="88" cy="88" r="' + R + '" class="face"/>';
  for (var i=0;i<24;i++){
    var o = pt(i/24*100, R), q = pt(i/24*100, R - (i%6 ? 5 : 9));
    h += '<line x1="'+o[0].toFixed(1)+'" y1="'+o[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)
       + '" class="tick' + (i%6 ? '' : ' big') + '"/>';
  }
  if (solo){
    /* the day fills the face rather than tracing its rim — a wedge sweeping
       from noon is the plainest possible picture of time being used up, and
       the tone deepens with it so a glance at the colour is enough */
    /* the red band on the bezel, drawn whether or not the needle has reached it */
    h += '<path d="' + arc(REDLINE, 99.99, R - 4) + '" class="redband"/>';
    var tP = Math.min(timeP, 99.99);
    if (tP > 0.4){
      /* swept in slices so each degree can carry its own colour — SVG has no
         conic gradient, and a single flat fill would lose the whole point */
      var N = Math.max(2, Math.ceil(tP / 1.5));
      for (var k = 0; k < N; k++){
        var p0 = tP * k / N, p1 = tP * (k+1) / N + 0.35;
        if (p1 > tP + 0.35) p1 = tP;
        var a0 = pt(p0, R - 4), a1 = pt(p1, R - 4);
        h += '<path class="wedge" fill="' + rampColor(p1) + '" d="M' + C + ' ' + C
           + ' L' + a0[0].toFixed(1) + ' ' + a0[1].toFixed(1)
           + ' A' + (R-4) + ' ' + (R-4) + ' 0 0 1 '
           + a1[0].toFixed(1) + ' ' + a1[1].toFixed(1) + ' Z"/>';
      }
    }
    /* a plate under the numbers so they stay readable over the fill */
    h += '<circle cx="' + C + '" cy="' + C + '" r="46" class="plate"/>';
  } else {
    var lo = Math.min(timeP, workP), hi = Math.max(timeP, workP);
    if (hi - lo > 0.3)
      h += '<path d="' + arc(lo, hi, r2) + '" class="gap ' + (ahead ? 'up' : 'dn') + '"/>';
  }
  var ht = pt(Math.min(timeP,100), R - 16);
  h += '<line x1="88" y1="88" x2="'+ht[0].toFixed(1)+'" y2="'+ht[1].toFixed(1)+'" class="hand t"'
     + (solo ? ' stroke="' + rampColor(timeP) + '"' : '') + '/>';
  if (!solo){
    var hw = pt(Math.min(workP,100), R - 30);
    h += '<line x1="88" y1="88" x2="'+hw[0].toFixed(1)+'" y2="'+hw[1].toFixed(1)+'" class="hand w'
       + (ahead ? ' up' : '') + '"/>';
  }
  h += '<circle cx="88" cy="88" r="4.5" class="pin"/></svg>';
  return '<div class="clockwrap' + (opt.small ? ' sm' : '') + '">' + h
       + '<div class="clockmid"><div class="pc'
       + (solo ? ' neutral' : (ahead ? ' up' : '')) + '">' + mid + '</div>'
       + '<div class="sb">' + sub + '</div></div></div>';
}

/* The page redraws every second, and innerHTML throws the scroll container
   away with it — which is why a swipe kept snapping back to the first circle.
   The offset is carried across the rebuild, and while a finger is actually
   moving the carousel the tick stands down entirely so momentum is not fought. */
var scrollX = 0, scrolling = 0, zoomId = null;

function zoomLayer(id){
  var ds = curIso(), f = faceOf(id, ds, timePctOn(ds));
  if (!f) return "";
  return '<div class="zoomlay" data-act="unzoom">'
    + '<div class="zbox"><div class="lb">' + esc(f[0]) + '</div>' + f[1]
    + '<div class="zbtns">'
    +   '<button data-act="popout">창으로 열기</button>'
    +   '<button data-act="unzoom" class="gh">닫기</button>'
    + '</div></div></div>';
}
function keepScroll(){
  var g = document.querySelector(".grid");
  if (g) scrollX = g.scrollLeft;
}
function restoreScroll(){
  var g = document.querySelector(".grid");
  if (!g || !scrollX) return;
  g.scrollLeft = scrollX;
}

function render(){
  var only = onlyId();
  if (only){
    document.body.classList.add("onlypage");
    el("view").innerHTML = viewOnly(only);
    return;
  }
  keepScroll();
  var h = '<div class="tabs">'
    + '<button data-act="tab" data-v="day"' + (tab==="day" ? ' aria-selected="true"' : '') + '>오늘</button>'
    + '<button data-act="tab" data-v="all"' + (tab==="all" ? ' aria-selected="true"' : '') + '>전체</button>'
    + '</div>';
  h += (tab === "day") ? viewDay() : viewAll();
  if (zoomId) h += zoomLayer(zoomId);
  el("view").innerHTML = h;
  restoreScroll();
  wire();
}

function fmtQ(v, unit){
  if (unit === "시간"){
    var hh = Math.floor(v), mm = Math.round((v - hh) * 60);
    if (mm === 60){ hh++; mm = 0; }
    return mm ? hh + ':' + pad2(mm) : hh + ':00';
  }
  return (Math.abs(v - Math.round(v)) < 0.01) ? String(Math.round(v)) : v.toFixed(1);
}

/* 전체 진행 = 항목별 달성률의 평균. 단위가 다른 것들을 더할 수는 없지만
   "목표의 몇 %" 는 같은 자로 잴 수 있다. */
function overallPct(){
  if (!S.items.length) return 0;
  var t = 0;
  S.items.forEach(function(it){ t += it.goal > 0 ? Math.min(100, total(it.id)/it.goal*100) : 0; });
  return t / S.items.length;
}

function viewDay(){
  var ds = curIso(), d = curDate(), now = new Date();
  var isToday = cur === 0;
  var tp = timePctOn(ds);
  var leftMs = 86400000 - (now - dayStart());

  var h = '<div class="datenav">'
    + '<button data-act="day" data-v="-1">‹</button>'
    + '<div class="dt">' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'
    +   (isWknd(ds) ? ' <i>주말</i>' : '')
    +   (isToday ? '<s>' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + '</s>'
                 : '<s>' + (cur < 0 ? -cur + '일 전' : '') + '</s>') + '</div>'
    + '<button data-act="day" data-v="1"' + (cur >= 0 ? ' disabled' : '') + '>›</button></div>';

  var g = '<div class="grid">';
  g += ring('시간', clock(tp, 0, tp.toFixed(1) + '<em>%</em>',
        isToday ? fmtLeft(leftMs) + ' 남음' : (tp ? '끝난 날' : '아직'),
        {solo:true}), 'time');

  var parts = [];
  S.items.forEach(function(it){
    var q = quotaOn(it, ds), n = nOn(it.id, ds);
    /* a day this item does not ask for must not drag the average down — it is
       not 0% done, it is not being asked */
    var wp = q > 0 ? Math.min(150, n / q * 100) : (n > 0 ? 100 : null);
    if (wp !== null) parts.push(wp);
    g += ring(it.name, clock(tp, wp,
          fmtQ(n, it.unit) + '<em>/' + (q > 0 ? fmtQ(q, it.unit) : '—') + '</em>',
          esc(it.unit), {}), it.id);
  });

  /* ④ 오늘 전체 — 두 항목을 1:1 로. 세트와 시간은 더할 수 없지만 "제 몫의
     몇 %" 는 같은 자로 잴 수 있고, 유저가 원한 가중도 동률이다. */
  var all = parts.length ? parts.reduce(function(a,b){ return a+b; }, 0) / parts.length : 0;
  g += ring('오늘 전체', clock(tp, all, all.toFixed(0) + '<em>%</em>',
        '모의고사 · 반도체 1:1', {}), 'all');
  var pf = faceOf('period', ds, tp);
  g += ring(pf[0], pf[1], 'period');
  g += '</div>';

  h += '<div class="now">' + g + '<div class="items">';
  S.items.forEach(function(it){
    h += quotaRow(it, quotaOn(it, ds), nOn(it.id, ds), ds);
  });
  h += '</div><div class="verdict">'
     + dayVerdict(100, all, tp, isToday) + '</div></div>';
  return h;
}

function ring(label, svg, id){
  return '<div class="cell"><div class="lb">' + esc(label) + '</div>'
       + '<button class="zoom" data-act="zoom" data-v="' + (id || "") + '"'
       + ' aria-label="' + esc(label) + ' 크게 보기">' + svg + '</button></div>';
}

/* ───────── 확대 / 창 모드 ─────────
   ?only=<id> renders one face and nothing else, sized to the window — so it can
   be popped into a small always-visible window and left there. The overlay is
   the same view without the URL, for when a tap is all that is wanted. */
function onlyId(){
  var m = String(location.search).match(/[?&]only=([a-z]+)/i);
  return m ? m[1] : null;
}
function faceOf(id, ds, tp){
  var isToday = cur === 0, leftMs = 86400000 - (new Date() - dayStart());
  if (id === "time")
    return ['시간', clock(tp, 0, tp.toFixed(1) + '<em>%</em>',
      isToday ? fmtLeft(leftMs) + ' 남음' : (tp ? '끝난 날' : '아직'), {solo:true})];
  /* the long gauge: the whole run from the day cuckoo started to the last
     deadline, on the same dial as the day. Same picture, different scale —
     and it is the one that has been quietly filling since September. */
  if (id === "period"){
    var m = markById("final"), pp = periodPct(m.date), dl = daysLeft(m.date);
    return ['전체 시간', clock(pp, 0, pp.toFixed(1) + '<em>%</em>',
      dl + '일 남음 · ' + m.date.slice(5).replace("-","/"), {solo:true})];
  }
  if (id === "all"){
    var parts = [];
    S.items.forEach(function(it){
      var q = quotaOn(it, ds), n = nOn(it.id, ds);
      var wp = q > 0 ? Math.min(150, n / q * 100) : (n > 0 ? 100 : null);
      if (wp !== null) parts.push(wp);
    });
    var av = parts.length ? parts.reduce(function(a,b){ return a+b; },0)/parts.length : 0;
    return ['오늘 전체', clock(tp, av, av.toFixed(0) + '<em>%</em>', '모의고사 · 반도체 1:1', {})];
  }
  var it = itemById(id);
  if (!it) return null;
  var q = quotaOn(it, ds), n = nOn(it.id, ds);
  var wp = q > 0 ? Math.min(150, n / q * 100) : (n > 0 ? 100 : 0);
  return [it.name, clock(tp, wp,
    fmtQ(n, it.unit) + '<em>/' + (q > 0 ? fmtQ(q, it.unit) : '—') + '</em>', esc(it.unit), {})];
}

function viewOnly(id){
  var ds = curIso(), f = faceOf(id, ds, timePctOn(ds));
  if (!f) return '<div class="card">없는 화면이야.</div>';
  var d = curDate();
  return '<div class="onlywrap"><div class="lb">' + esc(f[0]) + '</div>' + f[1]
       + '<div class="onlyd">' + (d.getMonth()+1) + '.' + d.getDate()
       + ' (' + DOW[d.getDay()] + ')</div></div>';
}

function viewAll(){
  var h = '';
  [["인적성", ["skct","gsat"]], ["면접", ["final"]]].forEach(function(t){
    h += '<div class="card"><h2>' + t[0] + '</h2><div class="dl">';
    t[1].forEach(function(mid){
      var m = markById(mid);
      h += '<div class="chip"><b>' + esc(m.name) + ' · ' + m.date.slice(5).replace("-","/") + '</b>'
         + '<div class="n">' + daysLeft(m.date) + '<em>일 남음</em></div>'
         + '<div class="s">기간 ' + periodPct(m.date).toFixed(1) + '% 지남</div></div>';
    });
    h += '</div>';
    S.items.filter(function(x){ return x.track === t[0]; }).forEach(function(it){
      var tn = total(it.id), pct = it.goal > 0 ? tn / it.goal * 100 : 0;
      var pp = periodPct(markById(it.due).date);
      h += '<div class="allrow">'
         + clock(pp, pct, Math.round(pct) + '<em>%</em>', '시간 ' + pp.toFixed(0) + '%')
         + '<div class="allmeta"><div class="nm">' + esc(it.name) + '</div>'
         + '<div class="ct">' + tn + '<s> / ' + it.goal + ' ' + esc(it.unit) + '</s></div>'
         + '<div class="sb2">' + allLine(it, tn, pct, pp) + '</div></div></div>';
    });
    h += '</div>';
  });
  return h;
}

function allLine(it, tn, pct, pp){
  var left = it.goal - tn;
  if (left <= 0) return '목표를 넘겼다. 여기서부터는 여유분.';
  var d = daysLeft(markById(it.due).date);
  var per = d ? left / d : left;
  var s = '남은 ' + left + esc(it.unit) + ' ÷ ' + d + '일 = 하루 '
        + (per < 1 ? per.toFixed(2) : per.toFixed(1));
  s += pct >= pp ? ' · 시간보다 ' + (pct-pp).toFixed(0) + '%p 앞서 있다.'
                 : ' · 시간이 ' + (pp-pct).toFixed(0) + '%p 앞서 있다.';
  return s;
}

function quotaRow(it, q, n, ds){
  var st = it.step || 1;
  var done = q > 0 && n >= q;
  var cleared = q <= 0;
  var h = '<div class="q' + (done || cleared ? ' done' : '') + '">'
    + '<div class="nm">' + esc(it.name)
    + '<s>' + (cleared ? '목표를 넘겼다'
              : '오늘 ' + fmtQ(q, it.unit) + esc(it.unit)) + '</s></div>'
    + '<div class="ct">' + fmtQ(n, it.unit) + '<s> ' + esc(it.unit) + '</s></div>'
    + '<div class="qb">'
    + '<button data-act="inc" data-id="' + it.id + '" data-d="' + ds + '" data-v="' + (-st) + '">−</button>'
    + '<button data-act="inc" data-id="' + it.id + '" data-d="' + ds + '" data-v="' + st + '" class="add">+</button>'
    + '</div></div>';
  /* A stretch of study is a thing that happened, not a total to overwrite: you
     type how long it was and it is added to the day. 1:20 · 1.5 · 80분 all mean
     the same eighty minutes. */
  if (it.unit === "시간"){
    h += '<div class="logrow">'
      + '<input class="dur" type="text" inputmode="text" placeholder="1:20  ·  1.5  ·  80분"'
      +   ' aria-label="방금 한 시간" data-dur="' + it.id + '" data-d="' + ds + '">'
      + '<button data-act="addtime" data-id="' + it.id + '" data-d="' + ds + '">더하기</button>'
      + '</div>';
  }
  return h;
}

/* "1:20" -> 1.3333, "1.5" -> 1.5, "80분"/"80m" -> 1.3333. Returns null when it
   cannot be read, so a typo is never silently logged as some other number. */
function parseDur(raw){
  var v = String(raw == null ? "" : raw).trim().toLowerCase();
  if (!v) return null;
  var m = v.match(/^(\d{1,2})\s*[:시]\s*(\d{1,2})\s*분?$/);
  if (m) return (+m[1]) + (+m[2]) / 60;
  m = v.match(/^(\d+(?:\.\d+)?)\s*(분|min|m)$/);
  if (m) return (+m[1]) / 60;
  m = v.match(/^(\d+(?:\.\d+)?)\s*(시간|h|hr)?$/);
  if (m) return +m[1];
  return null;
}

function dayVerdict(owed, got, tp, isToday){
  if (owed <= 0) return '이 날 몫은 없다. 쌓이는 건 전부 여유분이다.';
  var wp = got;
  if (wp >= 99.5)
    return '<b>이 날 몫 다 했다.</b> 여기서 더 하는 만큼 내일이 줄어든다.';
  if (!isToday)
    return '몫의 <b>' + wp.toFixed(0) + '%</b> 했다. 나머지는 남은 날들로 넘어갔다.';
  return '몫의 <b>' + wp.toFixed(0) + '%</b> · 하루는 <b>' + tp.toFixed(0) + '%</b> 지났다. '
       + (wp >= tp ? '<b>진행이 시간을 앞질렀다.</b>'
                   : '시간이 <b class="hot">' + (tp - wp).toFixed(0) + '%p</b> 앞서 있다.')
       + '<br>남은 <b>' + fmtLeft(86400000 - (new Date() - dayStart())) + '</b>.';
}

function fmtLeft(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/3600) + '시간 ' + Math.floor(s%3600/60) + '분';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

/* ───────── settings ───────── */
var showSet = false;
function settings(){
  var h = '<div class="card"><h2>설정</h2>';
  h += '<div class="setrow"><label>기간 시작</label>'
     + '<input type="date" id="st" value="' + S.start + '"></div>';
  S.marks.forEach(function(m){
    h += '<div class="setrow"><label>' + esc(m.name) + '</label>'
       + '<input type="date" data-mk="' + m.id + '" value="' + m.date + '"></div>';
  });
  S.items.forEach(function(it){
    h += '<div class="setrow"><label>' + esc(it.name) + ' 목표 (' + esc(it.unit) + ')</label>'
       + '<input type="number" min="0" step="1" data-gl="' + it.id + '" value="' + it.goal + '"></div>';
  });
  h += '<div class="btns"><button data-act="setdone" class="add">확인</button></div></div>';
  return h;
}

function wire(){
  document.querySelectorAll("[data-act]").forEach(function(n){
    n.addEventListener("click", function(){ act(n.dataset.act, n); });
  });
  document.querySelectorAll("[data-set]").forEach(function(n){
    n.addEventListener("change", function(){
      var v = Math.max(0, Math.round((parseFloat(n.value) || 0) * 2) / 2);
      setN(n.dataset.set, v, n.dataset.d);
      save(); n.blur(); draw();
    });
  });
  /* commit on change (blur or Enter), not on every keystroke — typing "3" on
     the way to "3.5" must not be saved as 3 and re-rendered under the caret */
  document.querySelectorAll("[data-dur]").forEach(function(n){
    n.addEventListener("keydown", function(ev){
      if (ev.key === "Enter") commitDur(n.dataset.dur, n.dataset.d, n);
    });
  });
  var g = document.querySelector(".grid");
  if (g) g.addEventListener("scroll", function(){
    scrolling = Date.now();
    scrollX = g.scrollLeft;
  }, { passive:true });
  var st = el("st");
  if (st) st.addEventListener("change", function(){ S.start = st.value; save(); });
  document.querySelectorAll("[data-mk]").forEach(function(n){
    n.addEventListener("change", function(){
      markById(n.dataset.mk).date = n.value; save();
    });
  });
  document.querySelectorAll("[data-gl]").forEach(function(n){
    n.addEventListener("change", function(){
      S.items.forEach(function(it){
        if (it.id === n.dataset.gl) it.goal = Math.max(0, parseInt(n.value,10) || 0);
      });
      save();
    });
  });
}

function act(a, n){
  if (a === "tab"){ tab = n.dataset.v; scrollX = 0; draw(); return; }
  if (a === "zoom"){ zoomId = n.dataset.v || null; draw(); return; }
  if (a === "unzoom"){ zoomId = null; draw(); return; }
  if (a === "popout"){
    /* a small window that can sit on top of everything else, showing one face */
    window.open(location.pathname + "?only=" + zoomId, "cuckoo_" + zoomId,
                "width=380,height=460,menubar=no,toolbar=no,location=no,status=no");
    return;
  }
  if (a === "day"){ cur = Math.min(0, cur + (+n.dataset.v)); draw(); return; }
  if (a === "addtime"){
    var box = document.querySelector('[data-dur="' + n.dataset.id + '"]');
    if (box) commitDur(n.dataset.id, n.dataset.d, box);
    return;
  }
  if (a === "inc"){
    var id = n.dataset.id, ds = n.dataset.d, it = itemById(id);
    addN(id, +n.dataset.v, ds);
    if (+n.dataset.v > 0 && it) toast(it.name + ' ' + nOn(id, ds) + it.unit);
    save(); draw(); return;
  }
  if (a === "setdone"){ showSet = false; draw(); return; }
}

/* the page redraws every second; redrawing under a caret would eat what is
   being typed, so the tick stands down while an input has focus */
function busy(){
  if (Date.now() - scrolling < 500) return true;
  var a = document.activeElement;
  return !!(a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA"));
}
function draw(){
  if (busy()) return;
  render();
  if (showSet){ el("view").insertAdjacentHTML("beforeend", settings()); wire(); }
}

el("setbtn").addEventListener("click", function(){ showSet = !showSet; draw(); });
el("resetbtn").addEventListener("click", function(){
  if (!confirm("cuckoo 기록을 전부 지울까? 되돌릴 수 없어.")) return;
  S = blank(); save(); showSet = false; draw();
});

/* the popped-out window and the page share one key, so a change in either has
   to reach the other — otherwise the small window quietly goes stale */
window.addEventListener("storage", function(ev){
  if (ev.key !== KEY) return;
  load(); draw();
});

load();
draw();
/* the whole point is that it never sits still */
setInterval(draw, 1000);
</script>
</body>
</html>
