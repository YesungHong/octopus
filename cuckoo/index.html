<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuckoo">
<meta name="theme-color" content="#E7EDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071319" media="(prefers-color-scheme: dark)">
<title>Cuckoo</title>
<style>
:root{
  --bg:#E7EDEB; --surface:#fff; --surface-2:#F1F5F4; --sunk:#DDE5E3;
  --ink:#0E1F26; --ink-2:#3C555E; --ink-3:#7C939A;
  --line:#C4D2D0; --line-soft:#DCE6E4;
  --accent:#0E7C86; --accent-ink:#0A5C63; --accent-soft:#D6ECEC;
  --hot:#B0231A;
  --shadow:0 1px 2px rgba(14,31,38,.06);
  --font-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
 :root{
  --bg:#071319; --surface:#0E1F26; --surface-2:#132B33; --sunk:#0A1A20;
  --ink:#DFEAE9; --ink-2:#A9C0C2; --ink-3:#6A828A;
  --line:#22424B; --line-soft:#18333B;
  --accent:#2FA6A6; --accent-ink:#7FD6D0; --accent-soft:#12333A;
  --hot:#E0655A;
  --shadow:none;
 }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 56px}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.mast h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.mast h1 span{font-size:17px}

/* the clock: the one thing that never stops moving */
/* the day is the page; the totals are a footnote to it */
.now{background:var(--surface);border:1px solid var(--line);border-radius:14px;
  padding:16px 17px 18px;margin:12px 0 14px;box-shadow:var(--shadow)}
.now .d{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em;font-variant-numeric:tabular-nums}
.now .big{font-family:var(--font-num);font-size:38px;font-weight:600;letter-spacing:-.025em;
  font-variant-numeric:tabular-nums;line-height:1.05;margin-top:1px}
.now .big em{font-style:normal;font-size:17px;color:var(--ink-3);margin-left:5px;letter-spacing:0}
/* ── tabs ── */
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--sunk);
  border-radius:10px;padding:3px;margin-bottom:12px}
.tabs button{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;
  font-size:14px;font-weight:650;padding:9px 0;border-radius:8px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* ── date cursor ── */
.datenav{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.datenav button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:17px;line-height:1;width:38px;height:38px;border-radius:9px;cursor:pointer;flex:none}
.datenav button:disabled{opacity:.3;cursor:default}
.datenav .dt{flex:1;text-align:center;font-size:15px;font-weight:650}
.datenav .dt s{display:block;text-decoration:none;font-size:11.5px;font-weight:400;
  color:var(--ink-3);font-variant-numeric:tabular-nums;letter-spacing:.03em}

/* ── the clock ── */
.clockwrap{position:relative;width:176px;height:176px;margin:2px auto 4px}
.clk{width:176px;height:176px;display:block}
.clk .face{fill:var(--sunk);stroke:var(--line-soft);stroke-width:1}
.clk .tick{stroke:var(--line);stroke-width:1.4;stroke-linecap:round}
.clk .tick.big{stroke:var(--ink-3);stroke-width:2}
.clk .gap{fill:none;stroke-width:9;stroke-linecap:butt;opacity:.5}
.clk .gap.up{stroke:var(--accent)}
.clk .gap.dn{stroke:var(--hot)}
.clk .hand{stroke-linecap:round}
.clk .hand.t{stroke:var(--ink-3);stroke-width:5}
.clk .hand.w{stroke:var(--hot);stroke-width:3}
.clk .hand.w.up{stroke:var(--accent)}
.clk .pin{fill:var(--ink-2)}
.clockmid{position:absolute;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;pointer-events:none}
.clockmid .pc{font-family:var(--font-num);font-size:29px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1;color:var(--hot)}
.clockmid .pc.up{color:var(--accent)}
.clockmid .pc em{font-style:normal;font-size:14px;margin-left:1px}
.clockmid .sb{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}

.items{margin-top:6px}

/* ── 전체 탭 ── */
.allrow{display:flex;align-items:center;gap:14px;margin-top:14px;padding-top:14px;
  border-top:1px solid var(--line-soft)}
.allrow .clockwrap{width:112px;height:112px;flex:none;margin:0}
.allrow .clk{width:112px;height:112px}
.allrow .clockmid .pc{font-size:20px}
.allrow .clockmid .pc em{font-size:11px}
.allrow .clockmid .sb{font-size:10px}
.allmeta{flex:1;min-width:0}
.allmeta .nm{font-size:14.5px;font-weight:650}
.allmeta .ct{font-family:var(--font-num);font-size:17px;font-weight:600;
  font-variant-numeric:tabular-nums;margin-top:1px}
.allmeta .ct s{text-decoration:none;color:var(--ink-3);font-size:13px}
.allmeta .sb2{font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.45}

.q{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid var(--line-soft)}
.q:first-of-type{border-top:0}
.q .nm{flex:1;min-width:0;font-size:14.5px;font-weight:600;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.q .nm s{display:block;text-decoration:none;font-size:11.5px;font-weight:400;color:var(--ink-3);
  font-variant-numeric:tabular-nums}
.q .ct{font-family:var(--font-num);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;
  flex:none;min-width:62px;text-align:right}
.q .ct s{text-decoration:none;color:var(--ink-3);font-size:13px}
.q.done .ct{color:var(--accent)}
.q .qb{display:flex;gap:5px;flex:none}
.q .qb button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:650;width:34px;height:34px;border-radius:8px;cursor:pointer;
  font-variant-numeric:tabular-nums;padding:0}
.q .qb button.add{border-color:var(--accent);background:var(--accent);color:#fff}
.q .qb button:active{transform:translateY(1px)}
.q .rare{font-size:12.5px;color:var(--ink-3);flex:none;font-variant-numeric:tabular-nums}

.verdict{margin-top:13px;padding-top:13px;border-top:1px solid var(--line-soft);
  font-size:13.5px;color:var(--ink-2);line-height:1.5}
.verdict b{color:var(--ink);font-weight:650}
.verdict b.hot{color:var(--hot)}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:15px 16px 17px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2{margin:0 0 3px;font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3)}
.tot{display:flex;align-items:baseline;gap:9px;margin-top:13px}
.tot .nm{flex:1;min-width:0;font-size:13.5px;color:var(--ink-2);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.tot .ct{font-family:var(--font-num);font-size:14px;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.tot .ct s{text-decoration:none;color:var(--ink-3);font-size:12px}

.dl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.dl .chip{flex:1 1 150px;background:var(--sunk);border-radius:9px;padding:9px 11px}
.dl .chip b{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.dl .chip .n{font-family:var(--font-num);font-size:21px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dl .chip .n em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:3px}
.dl .chip .s{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.rail{position:relative;height:7px;border-radius:5px;background:var(--sunk);margin:9px 0 0;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);transition:width .25s}
.rail u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.rail.over i{background:var(--accent-ink)}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:6px;
  font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.verdict{margin-top:9px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.verdict b{color:var(--ink);font-weight:650}
.verdict b.hot{color:var(--hot)}
.btns{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.btns button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:650;padding:8px 13px;border-radius:8px;cursor:pointer;
  font-variant-numeric:tabular-nums}
.btns button.add{border-color:var(--accent);background:var(--accent);color:#fff}
.btns button:active{transform:translateY(1px)}
.btns .gap{flex:1}
.mini{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;
  font-size:12px;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

.setrow{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:13px;color:var(--ink-2)}
.setrow label{flex:1}
.setrow input{width:104px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;color:var(--ink);font:inherit;font-family:var(--font-num);font-size:14px;
  font-variant-numeric:tabular-nums}
.setrow input[type=date]{width:150px}
.hide{display:none}
.foot{margin-top:18px;text-align:center}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><h1><span>🐦</span> Cuckoo</h1>
    <button class="mini" id="setbtn">설정</button></div>
  <div id="view"></div>
  <div class="foot"><button class="mini" id="resetbtn">전부 지우기</button></div>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ───────── storage ─────────
   Derived from the path like every other board in this repo, so cuckoo can
   never collide with octopus even though they share an origin. */
var KEY = "octopus.cuckoo.v1";
var S, storageOK = true;

function blank(){
  var today = iso(new Date());
  return {
    v: 2,
    start: today,
    marks: [
      { id:"skct",  name:"SKCT",   date:"2026-10-10" },
      { id:"gsat",  name:"GSAT",   date:"2026-10-24" },
      { id:"final", name:"최종면접", date:"2026-11-30" }
    ],
    items: [
      { id:"mock",  track:"인적성", name:"모의고사",       unit:"세트", goal:60,  due:"gsat"  },
      { id:"acad",  track:"면접",   name:"사관학교 5회독", unit:"편",   goal:740, due:"final" },
      { id:"books", track:"면접",   name:"책 읽기",         unit:"권",   goal:5,   due:"final" }
    ],
    /* "YYYY-MM-DD": { itemId: count } — the day is the unit of record, and the
       total is derived from it. Keeping a separate running total would let the
       two drift, and the day is the thing being lived. */
    log: {}
  };
}

function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function fromIso(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
/* deadlines land at the end of their day — a test on 10/24 is not over at 00:00 */
function endOf(s){ var d = fromIso(s); d.setHours(23,59,59,999); return d; }
function dayStart(){ var d = new Date(); d.setHours(0,0,0,0); return d; }
function todayIso(){ return iso(new Date()); }

function load(){
  var stored = null;
  try { var raw = localStorage.getItem(KEY); if (raw) stored = JSON.parse(raw); }
  catch(e){ storageOK = false; }
  try { localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
  catch(e){ storageOK = false; }
  S = stored || blank();
  /* v1 kept a running total on the item; move it into the day it was recorded
     so there is one source of truth. Runs before the blank merge, or the new
     `log` key would already be there and hide the evidence. */
  if (S.v !== 2){
    S.log = S.log || {};
    var d = S.start || todayIso(), day = S.log[d] || (S.log[d] = {});
    (S.items || []).forEach(function(it){
      if (it.n) day[it.id] = (day[it.id] || 0) + it.n;
      delete it.n;
    });
    S.v = 2;
  }
  var b = blank();
  for (var k in b) if (!(k in S)) S[k] = b[k];
}
function save(){
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOK = false; }
}

var el = function(id){ return document.getElementById(id); };
var toastT = null;
function toast(m){
  var t = el("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

/* ───────── the arithmetic ─────────
   Everything is a ratio of elapsed to total, and today's quota is simply what
   is left divided by the days left. That makes it self-correcting in both
   directions without any bookkeeping: skip today and tomorrow's number rises,
   do extra and it falls. No streaks, no penalties — just division. */
function markById(id){
  for (var i=0;i<S.marks.length;i++) if (S.marks[i].id === id) return S.marks[i];
  return S.marks[S.marks.length-1];
}
function itemById(id){
  for (var i=0;i<S.items.length;i++) if (S.items[i].id === id) return S.items[i];
  return null;
}
function total(id){
  var t = 0;
  for (var d in S.log) t += (S.log[d][id] || 0);
  return t;
}
function todayN(id){ var d = S.log[todayIso()]; return (d && d[id]) || 0; }
function addN(id, v, ds){
  var d = ds || todayIso();
  if (!S.log[d]) S.log[d] = {};
  S.log[d][id] = Math.max(0, (S.log[d][id] || 0) + v);
  if (!S.log[d][id]) delete S.log[d][id];
  if (!Object.keys(S.log[d]).length) delete S.log[d];
}
function daysLeft(dateStr){
  return Math.max(0, Math.ceil((endOf(dateStr) - new Date()) / 86400000));
}
function periodPct(dateStr){
  var a = fromIso(S.start), b = endOf(dateStr), now = new Date();
  if (b <= a) return 100;
  return Math.max(0, Math.min(100, (now - a) / (b - a) * 100));
}
function dayPct(){ return (new Date() - dayStart()) / 86400000 * 100; }
function pad2(n){ return String(n).padStart(2,"0"); }

/* what today owes, counting what is already done today so the number a person
   reads in the morning does not shrink under them as they work */
function quota(it){
  var m = markById(it.due);
  var left = it.goal - total(it.id) + todayN(it.id);
  if (left <= 0) return 0;
  var d = daysLeft(m.date);
  return d <= 0 ? left : left / d;
}

/* ───────── render ───────── */
var DOW = ["일","월","화","수","목","금","토"];
var tab = "day";     /* day | all */
var cur = 0;         /* day offset; 0 = today, negative = past */

function curDate(){ var d = dayStart(); d.setDate(d.getDate() + cur); return d; }
function curIso(){ return iso(curDate()); }

/* totals as they stood at the START of a given day, so a past day can be shown
   with the quota it actually had that morning rather than today's */
function totalBefore(id, dateStr){
  var t = 0;
  for (var d in S.log) if (d < dateStr) t += (S.log[d][id] || 0);
  return t;
}
function daysFrom(dateStr, fromIsoStr){
  var from = fromIso(fromIsoStr);
  return Math.max(0, Math.round((endOf(dateStr) - from) / 86400000));
}
function quotaOn(it, dateStr){
  var left = it.goal - totalBefore(it.id, dateStr);
  if (left <= 0) return 0;
  var d = daysFrom(markById(it.due).date, dateStr);
  return d <= 0 ? left : left / d;
}
function nOn(id, dateStr){ var d = S.log[dateStr]; return (d && d[id]) || 0; }

/* the day's clock: 100% is one full turn, noon-up, clockwise */
function timePctOn(dateStr){
  var t = todayIso();
  if (dateStr < t) return 100;
  if (dateStr > t) return 0;
  return dayPct();
}

/* ───────── the clock ─────────
   Two hands on one face. The grey hand is time, the coloured one is what has
   been done. Whichever is further round is ahead, and the arc between them is
   the gap — so "역전" is not a number to read but a shape to see. */
function clock(timeP, workP, mid, sub){
  var R = 74, C = 88, r2 = 60;
  function pt(pct, rad){
    var a = (pct/100) * Math.PI*2 - Math.PI/2;
    return [C + rad*Math.cos(a), C + rad*Math.sin(a)];
  }
  function arc(p0, p1, rad){
    var s = pt(p0, rad), e = pt(p1, rad);
    var big = (((p1 - p0) % 100) + 100) % 100 > 50 ? 1 : 0;
    return 'M' + s[0].toFixed(1) + ' ' + s[1].toFixed(1)
         + ' A' + rad + ' ' + rad + ' 0 ' + big + ' 1 ' + e[0].toFixed(1) + ' ' + e[1].toFixed(1);
  }
  var ahead = workP >= timeP;
  var h = '<svg class="clk" viewBox="0 0 176 176" aria-hidden="true">';
  h += '<circle cx="88" cy="88" r="' + R + '" class="face"/>';
  for (var i=0;i<24;i++){
    var o = pt(i/24*100, R), q = pt(i/24*100, R - (i%6 ? 5 : 9));
    h += '<line x1="'+o[0].toFixed(1)+'" y1="'+o[1].toFixed(1)+'" x2="'+q[0].toFixed(1)+'" y2="'+q[1].toFixed(1)
       + '" class="tick' + (i%6 ? '' : ' big') + '"/>';
  }
  /* the gap, drawn from whichever hand is behind to whichever is ahead */
  var lo = Math.min(timeP, workP), hi = Math.max(timeP, workP);
  if (hi - lo > 0.3)
    h += '<path d="' + arc(lo, hi, r2) + '" class="gap ' + (ahead ? 'up' : 'dn') + '"/>';
  var ht = pt(Math.min(timeP,100), R - 16), hw = pt(Math.min(workP,100), R - 30);
  h += '<line x1="88" y1="88" x2="'+ht[0].toFixed(1)+'" y2="'+ht[1].toFixed(1)+'" class="hand t"/>';
  h += '<line x1="88" y1="88" x2="'+hw[0].toFixed(1)+'" y2="'+hw[1].toFixed(1)+'" class="hand w'
     + (ahead ? ' up' : '') + '"/>';
  h += '<circle cx="88" cy="88" r="4.5" class="pin"/></svg>';
  return '<div class="clockwrap">' + h
       + '<div class="clockmid"><div class="pc' + (ahead ? ' up' : '') + '">' + mid + '</div>'
       + '<div class="sb">' + sub + '</div></div></div>';
}

function render(){
  var h = '<div class="tabs">'
    + '<button data-act="tab" data-v="day"' + (tab==="day" ? ' aria-selected="true"' : '') + '>오늘</button>'
    + '<button data-act="tab" data-v="all"' + (tab==="all" ? ' aria-selected="true"' : '') + '>전체</button>'
    + '</div>';
  h += (tab === "day") ? viewDay() : viewAll();
  el("view").innerHTML = h;
  wire();
}

function viewDay(){
  var ds = curIso(), d = curDate(), now = new Date();
  var isToday = cur === 0;
  var tp = timePctOn(ds);

  var owed = 0, got = 0;
  S.items.forEach(function(it){
    var q = quotaOn(it, ds), n = nOn(it.id, ds);
    if (q >= 0.5){ owed += Math.ceil(q); got += Math.min(n, Math.ceil(q)); }
  });
  var wp = owed ? got / owed * 100 : 0;

  var h = '<div class="datenav">'
    + '<button data-act="day" data-v="-1">‹</button>'
    + '<div class="dt">' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 (' + DOW[d.getDay()] + ')'
    +   (isToday ? '<s>' + pad2(now.getHours()) + ':' + pad2(now.getMinutes()) + ':' + pad2(now.getSeconds()) + '</s>'
                 : '<s>' + (cur < 0 ? -cur + '일 전' : cur + '일 뒤') + '</s>') + '</div>'
    + '<button data-act="day" data-v="1"' + (cur >= 0 ? ' disabled' : '') + '>›</button></div>';

  h += '<div class="now">'
    + clock(tp, wp, owed ? Math.round(wp) + '<em>%</em>' : '—',
            '시간 ' + tp.toFixed(0) + '%')
    + '<div class="items">';
  S.items.forEach(function(it){
    h += quotaRow(it, quotaOn(it, ds), nOn(it.id, ds), ds);
  });
  h += '</div><div class="verdict">' + dayVerdict(owed, got, tp, isToday) + '</div></div>';
  return h;
}

function viewAll(){
  var h = '';
  [["인적성", ["skct","gsat"]], ["면접", ["final"]]].forEach(function(t){
    h += '<div class="card"><h2>' + t[0] + '</h2><div class="dl">';
    t[1].forEach(function(mid){
      var m = markById(mid);
      h += '<div class="chip"><b>' + esc(m.name) + ' · ' + m.date.slice(5).replace("-","/") + '</b>'
         + '<div class="n">' + daysLeft(m.date) + '<em>일 남음</em></div>'
         + '<div class="s">기간 ' + periodPct(m.date).toFixed(1) + '% 지남</div></div>';
    });
    h += '</div>';
    S.items.filter(function(x){ return x.track === t[0]; }).forEach(function(it){
      var tn = total(it.id), pct = it.goal > 0 ? tn / it.goal * 100 : 0;
      var pp = periodPct(markById(it.due).date);
      h += '<div class="allrow">'
         + clock(pp, pct, Math.round(pct) + '<em>%</em>', '시간 ' + pp.toFixed(0) + '%')
         + '<div class="allmeta"><div class="nm">' + esc(it.name) + '</div>'
         + '<div class="ct">' + tn + '<s> / ' + it.goal + ' ' + esc(it.unit) + '</s></div>'
         + '<div class="sb2">' + allLine(it, tn, pct, pp) + '</div></div></div>';
    });
    h += '</div>';
  });
  return h;
}

function allLine(it, tn, pct, pp){
  var left = it.goal - tn;
  if (left <= 0) return '목표를 넘겼다. 여기서부터는 여유분.';
  var d = daysLeft(markById(it.due).date);
  var per = d ? left / d : left;
  var s = '남은 ' + left + esc(it.unit) + ' ÷ ' + d + '일 = 하루 '
        + (per < 1 ? per.toFixed(2) : per.toFixed(1));
  s += pct >= pp ? ' · 시간보다 ' + (pct-pp).toFixed(0) + '%p 앞서 있다.'
                 : ' · 시간이 ' + (pp-pct).toFixed(0) + '%p 앞서 있다.';
  return s;
}

function quotaRow(it, q, n, ds){
  var rare = q > 0 && q < 0.5;
  var goal = Math.ceil(q);
  var done = !rare && q > 0 && n >= goal;
  var cleared = q <= 0;
  var h = '<div class="q' + (done || cleared ? ' done' : '') + '">'
    + '<div class="nm">' + esc(it.name);
  if (rare) h += '<s>' + Math.round(1/q) + '일에 ' + esc(it.unit) + ' 하나</s>';
  else if (cleared) h += '<s>목표를 넘겼다</s>';
  h += '</div>';
  if (rare) h += '<div class="rare">' + n + esc(it.unit) + '</div>';
  else h += '<div class="ct">' + n + '<s> / ' + goal + '</s></div>';
  h += '<div class="qb">'
    + '<button data-act="inc" data-id="' + it.id + '" data-d="' + ds + '" data-v="-1">−</button>'
    + '<button data-act="inc" data-id="' + it.id + '" data-d="' + ds + '" data-v="1" class="add">+</button>'
    + '</div></div>';
  return h;
}

function dayVerdict(owed, got, tp, isToday){
  if (!owed) return '이 날 몫은 없다. 쌓이는 건 전부 여유분이다.';
  if (got >= owed)
    return '<b>몫 ' + owed + '개 다 했다.</b> 여기서 더 하는 만큼 내일이 줄어든다.';
  var left = owed - got, wp = got / owed * 100;
  if (!isToday)
    return '몫 <b>' + owed + '</b> 중 <b>' + got + '</b>. ' + left + '개가 남은 날들로 넘어갔다.';
  return '몫 <b>' + owed + '</b> 중 <b>' + got + '</b>. 남은 <b class="hot">' + left + '개</b>를 '
       + '<b>' + fmtLeft(86400000 - (new Date() - dayStart())) + '</b> 안에.<br>'
       + (wp >= tp ? '진행이 시간을 앞질렀다.' : '시간이 ' + (tp - wp).toFixed(0) + '%p 앞서 있다.');
}

function fmtLeft(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  return Math.floor(s/3600) + '시간 ' + Math.floor(s%3600/60) + '분';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

/* ───────── settings ───────── */
var showSet = false;
function settings(){
  var h = '<div class="card"><h2>설정</h2>';
  h += '<div class="setrow"><label>기간 시작</label>'
     + '<input type="date" id="st" value="' + S.start + '"></div>';
  S.marks.forEach(function(m){
    h += '<div class="setrow"><label>' + esc(m.name) + '</label>'
       + '<input type="date" data-mk="' + m.id + '" value="' + m.date + '"></div>';
  });
  S.items.forEach(function(it){
    h += '<div class="setrow"><label>' + esc(it.name) + ' 목표 (' + esc(it.unit) + ')</label>'
       + '<input type="number" min="0" step="1" data-gl="' + it.id + '" value="' + it.goal + '"></div>';
  });
  h += '<div class="btns"><button data-act="setdone" class="add">확인</button></div></div>';
  return h;
}

function wire(){
  document.querySelectorAll("[data-act]").forEach(function(n){
    n.addEventListener("click", function(){ act(n.dataset.act, n); });
  });
  var st = el("st");
  if (st) st.addEventListener("change", function(){ S.start = st.value; save(); });
  document.querySelectorAll("[data-mk]").forEach(function(n){
    n.addEventListener("change", function(){
      markById(n.dataset.mk).date = n.value; save();
    });
  });
  document.querySelectorAll("[data-gl]").forEach(function(n){
    n.addEventListener("change", function(){
      S.items.forEach(function(it){
        if (it.id === n.dataset.gl) it.goal = Math.max(0, parseInt(n.value,10) || 0);
      });
      save();
    });
  });
}

function act(a, n){
  if (a === "tab"){ tab = n.dataset.v; draw(); return; }
  if (a === "day"){ cur = Math.min(0, cur + (+n.dataset.v)); draw(); return; }
  if (a === "inc"){
    var id = n.dataset.id, ds = n.dataset.d, it = itemById(id);
    addN(id, +n.dataset.v, ds);
    if (+n.dataset.v > 0 && it) toast(it.name + ' ' + nOn(id, ds) + it.unit);
    save(); draw(); return;
  }
  if (a === "setdone"){ showSet = false; draw(); return; }
}

function draw(){
  render();
  if (showSet){ el("view").insertAdjacentHTML("beforeend", settings()); wire(); }
}

el("setbtn").addEventListener("click", function(){ showSet = !showSet; draw(); });
el("resetbtn").addEventListener("click", function(){
  if (!confirm("cuckoo 기록을 전부 지울까? 되돌릴 수 없어.")) return;
  S = blank(); save(); showSet = false; draw();
});

load();
draw();
/* the whole point is that it never sits still */
setInterval(draw, 1000);
</script>
</body>
