<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuckoo">
<meta name="theme-color" content="#E7EDEB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#071319" media="(prefers-color-scheme: dark)">
<title>Cuckoo</title>
<style>
:root{
  --bg:#E7EDEB; --surface:#fff; --surface-2:#F1F5F4; --sunk:#DDE5E3;
  --ink:#0E1F26; --ink-2:#3C555E; --ink-3:#7C939A;
  --line:#C4D2D0; --line-soft:#DCE6E4;
  --accent:#0E7C86; --accent-ink:#0A5C63; --accent-soft:#D6ECEC;
  --hot:#B0231A;
  --shadow:0 1px 2px rgba(14,31,38,.06);
  --font-num:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
 :root{
  --bg:#071319; --surface:#0E1F26; --surface-2:#132B33; --sunk:#0A1A20;
  --ink:#DFEAE9; --ink-2:#A9C0C2; --ink-3:#6A828A;
  --line:#22424B; --line-soft:#18333B;
  --accent:#2FA6A6; --accent-ink:#7FD6D0; --accent-soft:#12333A;
  --hot:#E0655A;
  --shadow:none;
 }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  font-size:16px;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 56px}

.mast{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:6px}
.mast h1{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.mast h1 span{font-size:17px}

/* the clock: the one thing that never stops moving */
.now{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:14px 16px;margin:12px 0 16px;box-shadow:var(--shadow)}
.now .d{font-size:12.5px;color:var(--ink-3);letter-spacing:.04em}
.now .big{font-family:var(--font-num);font-size:34px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.now .sub{font-size:13px;color:var(--ink-2);margin-top:3px}
.daybar{height:5px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:10px}
.daybar i{display:block;height:100%;background:var(--ink-3)}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;
  padding:15px 16px 17px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h2{margin:0 0 3px;font-size:11px;font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;color:var(--ink-3)}

.dl{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 4px}
.dl .chip{flex:1 1 150px;background:var(--sunk);border-radius:9px;padding:9px 11px}
.dl .chip b{display:block;font-size:12.5px;font-weight:650;color:var(--ink-2)}
.dl .chip .n{font-family:var(--font-num);font-size:21px;font-weight:600;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.dl .chip .n em{font-style:normal;font-size:12px;color:var(--ink-3);margin-left:3px}
.dl .chip .s{font-size:11px;color:var(--ink-3);font-variant-numeric:tabular-nums}

.item{margin-top:16px;padding-top:15px;border-top:1px solid var(--line-soft)}
.item:first-of-type{border-top:0;padding-top:4px}
.ihead{display:flex;align-items:baseline;gap:9px}
.ihead .nm{font-size:15px;font-weight:650;flex:1;min-width:0}
.ihead .ct{font-family:var(--font-num);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.ihead .ct s{text-decoration:none;color:var(--ink-3);font-size:13px}
.rail{position:relative;height:9px;border-radius:5px;background:var(--sunk);margin:9px 0 0;overflow:hidden}
.rail i{display:block;height:100%;background:var(--accent);transition:width .25s}
.rail u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.55}
.rail.over i{background:var(--accent-ink)}
.legend{display:flex;justify-content:space-between;gap:10px;margin-top:6px;
  font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.verdict{margin-top:9px;font-size:13.5px;color:var(--ink-2);line-height:1.45}
.verdict b{color:var(--ink);font-weight:650}
.verdict b.hot{color:var(--hot)}
.btns{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.btns button{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink-2);
  font:inherit;font-size:13px;font-weight:650;padding:8px 13px;border-radius:8px;cursor:pointer;
  font-variant-numeric:tabular-nums}
.btns button.add{border-color:var(--accent);background:var(--accent);color:#fff}
.btns button:active{transform:translateY(1px)}
.btns .gap{flex:1}
.mini{appearance:none;border:0;background:transparent;color:var(--ink-3);font:inherit;
  font-size:12px;cursor:pointer;padding:6px 2px;text-decoration:underline;text-underline-offset:3px}

.setrow{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:13px;color:var(--ink-2)}
.setrow label{flex:1}
.setrow input{width:104px;background:var(--bg);border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;color:var(--ink);font:inherit;font-family:var(--font-num);font-size:14px;
  font-variant-numeric:tabular-nums}
.setrow input[type=date]{width:150px}
.hide{display:none}
.foot{margin-top:18px;text-align:center}
#toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;
  opacity:0;pointer-events:none;transition:.18s;max-width:88vw;text-align:center;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="mast"><h1><span>🐦</span> Cuckoo</h1>
    <button class="mini" id="setbtn">설정</button></div>
  <div id="view"></div>
  <div class="foot"><button class="mini" id="resetbtn">전부 지우기</button></div>
</div>
<div id="toast"></div>

<script>
"use strict";

/* ───────── storage ─────────
   Derived from the path like every other board in this repo, so cuckoo can
   never collide with octopus even though they share an origin. */
var KEY = "octopus.cuckoo.v1";
var S, storageOK = true;

function blank(){
  var today = iso(new Date());
  return {
    start: today,                       /* the period runs from the day you began */
    marks: [                            /* deadlines, in date order */
      { id:"skct",  name:"SKCT",   date:"2026-10-10" },
      { id:"gsat",  name:"GSAT",   date:"2026-10-24" },
      { id:"final", name:"최종면접", date:"2026-11-30" }
    ],
    items: [
      { id:"mock",  track:"인적성", name:"모의고사",        unit:"세트", n:0, goal:60,  due:"gsat"  },
      { id:"acad",  track:"면접",   name:"사관학교 5회독",  unit:"편",   n:0, goal:740, due:"final" },
      { id:"books", track:"면접",   name:"책 읽기",          unit:"권",   n:0, goal:5,   due:"final" }
    ]
  };
}

function iso(d){
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0")
       + "-" + String(d.getDate()).padStart(2,"0");
}
function fromIso(s){ var p = String(s).split("-"); return new Date(+p[0], +p[1]-1, +p[2]); }
/* deadlines land at the end of their day — a paper on 10/24 is not over at 00:00 */
function endOf(s){ var d = fromIso(s); d.setHours(23,59,59,999); return d; }
function dayStart(){ var d = new Date(); d.setHours(0,0,0,0); return d; }

function load(){
  var stored = null;
  try { var raw = localStorage.getItem(KEY); if (raw) stored = JSON.parse(raw); }
  catch(e){ storageOK = false; }
  try { localStorage.setItem(KEY+".probe","1"); localStorage.removeItem(KEY+".probe"); }
  catch(e){ storageOK = false; }
  S = stored || blank();
  var b = blank();
  for (var k in b) if (!(k in S)) S[k] = b[k];
}
function save(){
  if (!storageOK) return;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ storageOK = false; }
}

var el = function(id){ return document.getElementById(id); };
var toastT = null;
function toast(m){
  var t = el("toast"); t.textContent = m; t.classList.add("on");
  clearTimeout(toastT); toastT = setTimeout(function(){ t.classList.remove("on"); }, 2000);
}

/* ───────── the arithmetic ─────────
   Everything below is a ratio of elapsed to total. Nothing is rounded in the
   flattering direction and nothing stops at 100%: going past the goal keeps
   counting, because a target you have already cleared should not read the same
   as one you just met. */
function markById(id){
  for (var i=0;i<S.marks.length;i++) if (S.marks[i].id === id) return S.marks[i];
  return S.marks[S.marks.length-1];
}
function daysLeft(dateStr){
  return Math.max(0, Math.ceil((endOf(dateStr) - new Date()) / 86400000));
}
function periodPct(dateStr){
  var a = fromIso(S.start), b = endOf(dateStr), now = new Date();
  if (b <= a) return 100;
  return Math.max(0, Math.min(100, (now - a) / (b - a) * 100));
}
function dayPct(){
  var d = dayStart();
  return (new Date() - d) / 86400000 * 100;
}
function pad2(n){ return String(n).padStart(2,"0"); }

function need(it){
  /* how many per day from right now, counting today as still available */
  var m = markById(it.due), left = it.goal - it.n;
  if (left <= 0) return 0;
  var d = daysLeft(m.date);
  return d <= 0 ? left : left / d;
}

/* ───────── render ───────── */
function render(){
  var h = "";
  var now = new Date();
  var DOW = ["일","월","화","수","목","금","토"];
  var dp = dayPct();

  h += '<div class="now">'
     + '<div class="d">' + (now.getMonth()+1) + '월 ' + now.getDate() + '일 ('
     +   DOW[now.getDay()] + ')  ' + pad2(now.getHours()) + ':' + pad2(now.getMinutes())
     +   ':' + pad2(now.getSeconds()) + '</div>'
     + '<div class="big">오늘 ' + dp.toFixed(1) + '%</div>'
     + '<div class="sub">하루 중 ' + fmtLeft(86400000 - (now - dayStart())) + ' 남음</div>'
     + '<div class="daybar"><i style="width:' + dp.toFixed(2) + '%"></i></div>'
     + '</div>';

  var tracks = [["인적성", ["skct","gsat"]], ["면접", ["final"]]];
  tracks.forEach(function(t){
    var name = t[0], markIds = t[1];
    h += '<div class="card"><h2>' + name + '</h2><div class="dl">';
    markIds.forEach(function(mid){
      var m = markById(mid), dl = daysLeft(m.date), pp = periodPct(m.date);
      h += '<div class="chip"><b>' + esc(m.name) + ' · ' + m.date.slice(5).replace("-","/") + '</b>'
         + '<div class="n">' + dl + '<em>일 남음</em></div>'
         + '<div class="s">기간 ' + pp.toFixed(1) + '% 지남</div></div>';
    });
    h += '</div>';
    S.items.filter(function(x){ return x.track === name; }).forEach(function(it){
      h += itemRow(it);
    });
    h += '</div>';
  });

  el("view").innerHTML = h;
  wire();
}

function fmtLeft(ms){
  var s = Math.max(0, Math.floor(ms/1000));
  var hh = Math.floor(s/3600), mm = Math.floor(s%3600/60);
  return hh + '시간 ' + mm + '분';
}
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }

function itemRow(it){
  var m = markById(it.due);
  var done = it.goal > 0 ? it.n / it.goal * 100 : 0;
  var pp = periodPct(m.date);
  var per = need(it);
  var over = it.n >= it.goal && it.goal > 0;

  var h = '<div class="item">'
    + '<div class="ihead"><div class="nm">' + esc(it.name) + '</div>'
    + '<div class="ct">' + it.n + '<s> / ' + it.goal + ' ' + esc(it.unit) + '</s></div></div>'
    + '<div class="rail' + (over ? ' over' : '') + '">'
    +   '<i style="width:' + Math.min(100, done).toFixed(2) + '%"></i>'
    +   '<u style="left:calc(' + Math.min(100, pp).toFixed(2) + '% - 1px)"></u>'
    + '</div>'
    + '<div class="legend"><span>내 진행 ' + done.toFixed(1) + '%</span>'
    +   '<span>│ 는 시간 ' + pp.toFixed(1) + '%</span></div>';

  h += '<div class="verdict">' + verdict(it, done, pp, per, m) + '</div>';
  h += '<div class="btns">'
    + '<button data-act="inc" data-id="' + it.id + '" data-v="1" class="add">+1</button>'
    + '<button data-act="inc" data-id="' + it.id + '" data-v="5">+5</button>'
    + '<button data-act="inc" data-id="' + it.id + '" data-v="-1">−1</button>'
    + '<span class="gap"></span>'
    + '</div></div>';
  return h;
}

/* One sentence, and it always ends in a number you can act on. No consolation:
   the gap is stated, then converted into today's quota. */
function verdict(it, done, pp, per, m){
  var left = it.goal - it.n, d = daysLeft(m.date);
  if (it.goal <= 0) return '목표를 정하면 속도를 계산해줄게.';
  if (left <= 0)
    return '<b>' + it.n + it.unit + ' — 목표 ' + it.goal + ' 를 넘겼다.</b> 여기서 더 쌓이는 건 전부 여유분이다.';
  var q = per <= 0 ? 0 : per;
  var s = '남은 <b>' + left + it.unit + '</b> ÷ <b>' + d + '일</b> = '
        + '하루 <b class="hot">' + (q < 1 ? q.toFixed(2) : q.toFixed(1)) + it.unit + '</b>';
  var gap = pp - done;
  if (gap > 0) s += ' · 시간이 <b>' + gap.toFixed(1) + '%p</b> 앞서 있다.';
  else s += ' · 진행이 시간보다 <b>' + (-gap).toFixed(1) + '%p</b> 앞서 있다.';
  return s;
}

/* ───────── settings ───────── */
var showSet = false;
function settings(){
  var h = '<div class="card"><h2>설정</h2>';
  h += '<div class="setrow"><label>기간 시작</label>'
     + '<input type="date" id="st" value="' + S.start + '"></div>';
  S.marks.forEach(function(m){
    h += '<div class="setrow"><label>' + esc(m.name) + '</label>'
       + '<input type="date" data-mk="' + m.id + '" value="' + m.date + '"></div>';
  });
  S.items.forEach(function(it){
    h += '<div class="setrow"><label>' + esc(it.name) + ' 목표 (' + esc(it.unit) + ')</label>'
       + '<input type="number" min="0" step="1" data-gl="' + it.id + '" value="' + it.goal + '"></div>';
  });
  h += '<div class="btns"><button data-act="setdone" class="add">확인</button></div></div>';
  return h;
}

function wire(){
  document.querySelectorAll("[data-act]").forEach(function(n){
    n.addEventListener("click", function(){ act(n.dataset.act, n); });
  });
  var st = el("st");
  if (st) st.addEventListener("change", function(){ S.start = st.value; save(); });
  document.querySelectorAll("[data-mk]").forEach(function(n){
    n.addEventListener("change", function(){
      markById(n.dataset.mk).date = n.value; save();
    });
  });
  document.querySelectorAll("[data-gl]").forEach(function(n){
    n.addEventListener("change", function(){
      S.items.forEach(function(it){
        if (it.id === n.dataset.gl) it.goal = Math.max(0, parseInt(n.value,10) || 0);
      });
      save();
    });
  });
}

function act(a, n){
  if (a === "inc"){
    var v = +n.dataset.v;
    S.items.forEach(function(it){
      if (it.id !== n.dataset.id) return;
      it.n = Math.max(0, it.n + v);
      if (v > 0) toast(it.name + ' ' + it.n + esc(it.unit));
    });
    save(); draw(); return;
  }
  if (a === "setdone"){ showSet = false; draw(); return; }
}

function draw(){
  render();
  if (showSet){ el("view").insertAdjacentHTML("beforeend", settings()); wire(); }
}

el("setbtn").addEventListener("click", function(){ showSet = !showSet; draw(); });
el("resetbtn").addEventListener("click", function(){
  if (!confirm("cuckoo 기록을 전부 지울까? 되돌릴 수 없어.")) return;
  S = blank(); save(); showSet = false; draw();
});

load();
draw();
/* the whole point is that it never sits still */
setInterval(draw, 1000);
</script>
</body>
</html>
